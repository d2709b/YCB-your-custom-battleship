mb.hud.build = Режим постройки летающего корабля. Поставленные блоки входят в летающий корабль; блоки без крепления к корпусу подсвечены красным и будут удалены при выходе. Y переносит блок под курсором между мировым слоем (синий) и слоем корабля; зажмите Y и протяните квадрат, чтобы перенести все блоки в нём (начали с блока мира — они присоединяются к летающему кораблю, с блока корабля — уходят из него). Зелёная стрелка на ядре / хранилище — перёд летающего корабля: R поворачивает её (Shift+R — в другую сторону). Буры, помпы, термогенераторы и другие блоки, привязанные к местности, здесь можно ставить где угодно.
