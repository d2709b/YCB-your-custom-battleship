ycb.guide.idea.title = Что такое летающий корабль
ycb.guide.idea.text = Летающий корабль — это юнит, собранный из блоков. Его корпус — [accent]ядро[] или [accent]хранилище / контейнер[]. Каждый блок, присоединённый к корпусу (стороной к стороне, в том числе через другие блоки), становится частью корабля.\n\nПока корабль летит, он не стоит на сетке карты: конвейеры, провода и турели мира его не видят и не касаются. Он взаимодействует только с другими кораблями, врагами и снарядами. Он летает и поворачивается на [accent]любой угол[], а не по клеткам, и все его блоки работают в полёте: конвейеры двигают предметы, буры добывают, заводы производят, генераторы дают энергию, турели стреляют. Каждый блок отбрасывает тень на землю, как у летающего юнита.\n\nКораблём считается только то, что вы сами сделали кораблём. Обычное ядро на карте кораблём не является, пока вы не нажмёте на нём [accent]Y[] в режиме постройки ([accent]G[]) или не построите там корпус.\n\nКораблю нужны [accent]ускорители[] (двигатели): без них он не летит. Скорость = суммарная тяга ускорителей x мощность одного ракетного ускорителя / число блоков корабля, поэтому чем тяжелее корабль, тем он медленнее.
ycb.guide.first.title = Первый корабль: шаг за шагом
ycb.guide.first.text = [accent]1.[] Поставьте на землю ядро или хранилище / контейнер (или возьмите уже стоящее).\n[accent]2.[] Нажмите [accent]G[] (на телефоне — кнопку постройки). Включится режим постройки: появится сетка, а всё, что не входит в корабль, закрасится синим (мировой слой).\n[accent]3.[] Наведите курсор на ядро / хранилище и нажмите [accent]Y[] (на телефоне — кнопку «Перенос построек», затем нажмите на него). Оно станет кораблём, и на нём появится зелёная стрелка — перёд.\n[accent]4.[] Стройте блоки рядом: каждый поставленный блок, который касается корабля, сразу входит в него. Блоки, которые уже стоят на земле, присоединяются клавишей [accent]Y[] (зажмите Y и протяните квадрат, чтобы перенести много блоков сразу).\n[accent]5.[] Поставьте хотя бы один ускоритель, для начала хватит ракетного. Без ускорителей наверху экрана мигает подсказка «Нужны ускорители-двигатели!».\n[accent]6.[] Подайте то, чему нужна подача: энергию — энергетическим ускорителям, уголь / споры / пиротит — топливным, боеприпасы — турелям.\n[accent]7.[] Нажмите [accent]G[] ещё раз: корабль взлетит. Нажмите [accent]Y[] (курсор в стороне от блоков), чтобы вселиться, и летайте на [accent]WASD[]. [accent]Shift+Y[] сажает корабль.\n\nБлоки, не прикреплённые к корпусу, подсвечены красным и удаляются при выходе из режима постройки (часть ресурсов возвращается).
ycb.guide.layers.title = Слои: мир и корабль
ycb.guide.layers.text = Каждый блок лежит на одном из двух слоёв. [accent]Мировой слой[] — обычная карта: в режиме постройки его блоки закрашены синим. [accent]Слой корабля[] — блоки кораблей (в режиме постройки на них лежит фиолетовая маска).\n\n[accent]Y[] переносит блок под курсором на другой слой; блок должен касаться корабля. Зажмите [accent]Y[] и протяните квадрат (как выделение на F / B): все блоки в квадрате переносятся сразу. Направление задаёт блок, с которого вы начали:\n- начали с блока мира: блоки мира в квадрате присоединяются к кораблю (целая постройка присоединяется за один раз, по цепочке от корабля наружу);\n- начали с блока корабля: блоки корабля в квадрате уходят из него и становятся обычными блоками (блоки, державшиеся только на них, краснеют);\n- начали с пустой клетки: блоки мира присоединяются, а если их нет, блоки корабля уходят.\nБлоки чужой команды и блоки в стройке не затрагиваются. Рамка показывает, что изменится: цветом слоя корабля — присоединится, голубым — уйдёт.\n\nЯдро или хранилище, которое ни к чему не крепится, при переносе становится новым кораблём. Группа блоков со своим ядром или хранилищем — отдельный корабль: она не удаляется, а взлетает сама.\n\nНа телефоне вместо клавиши Y работает кнопка «Перенос построек»: нажмите на блок или протяните квадрат.
ycb.guide.pc.title = Клавиши на ПК
ycb.guide.pc.text = На ПК панели с кнопками нет: всё делается клавишами.\n\n[accent]G[] — режим постройки вкл / выкл. Корабль, которым вы управляете (иначе ближайший к курсору), садится на сетку, поворачивается вверх и ездит по клеткам. Повторное нажатие — он взлетает.\n[accent]Y[] вне режима постройки — если под курсором блок вашей команды, он меняет слой; в остальных случаях вы вселяетесь в корабль или выходите из него. Выйти можно и клавишей [accent]V[].\n[accent]Shift+Y[] вне режима постройки — посадить корабль, а если он уже сел — поднять (то же, что приказы «Посадка» / «Взлёт»).\n[accent]Y[] в режиме постройки — перенести блок под курсором между слоями; зажмите и протяните квадрат, чтобы перенести много блоков.\n[accent]R[] в режиме постройки — повернуть стрелку-перёд корабля на 90 градусов ([accent]Shift+R[] — в другую сторону). Если под курсором блок, который игра умеет поворачивать сама (конвейер), R поворачивает этот блок.\n[accent]WASD[] — лететь. По умолчанию корабль поворачивается в сторону движения (настройка).\n[accent]Q / E[] — повернуть корабль вручную на любой угол.\n[accent]Левая кнопка мыши[] (удерживать) — все турели разворачиваются на курсор и стреляют вместе.\n[accent]Ctrl + левая кнопка мыши[] на корабле — взять его под управление, как любой юнит.
ycb.guide.phone.title = Телефон
ycb.guide.phone.text = На телефоне панель с кнопками находится слева на экране. Стрелка сверху панели скрывает и показывает кнопки.\n\nВ панели: режим постройки (как G), вселиться в корабль / выйти (как Y), посадить / поднять корабль (как Shift+Y). В режиме постройки добавляются ещё две: [accent]«Перенос построек»[] (как Y) и [accent]«Поворот»[] (как R). Для севшего корабля под кнопками есть стрелки: они двигают его по клеткам.\n\nЛетающий корабль следует за [accent]центром экрана[]: двигайте карту пальцем, корабль летит за центром, поворачивается к нему перёдом, плавно тормозит и останавливается. Касание корабля в него не вселяет — используйте кнопку вселения.\n\n[accent]Перенос построек[]: нажмите один раз, чтобы включить (кнопка подсвечена). Нажатие на блок отправляет его на другой слой; протянутый квадрат переносит все блоки в нём (направление задаёт блок, с которого начали, как при Y). Пока режим включён, карта не двигается. Чтобы закончить, нажмите кнопку ещё раз.\n\n[accent]Поворот[]: поворачивает корабль в центре экрана (иначе тот, в котором вы сидите, иначе ближайший из севших) на 90 градусов против часовой стрелки. Четыре нажатия — полный круг.
ycb.guide.build.title = Режим постройки (G)
ycb.guide.build.text = Режим постройки — место, где вы создаёте и меняете корабли.\n\n- Корабль садится на сетку, поворачивается вверх, и вы двигаете его по клеткам (8 клеток в секунду). Включена сетка, мировой слой синий.\n- Поставленные блоки, которые касаются корабля, сразу входят в него. Блок, потерявший крепление к корпусу, подсвечен красным и удаляется при выходе из режима (ресурсы частично возвращаются). Группа блоков со своим ядром или хранилищем не удаляется: она становится отдельным кораблём.\n- [accent]Перёд.[] На каждом ядре / хранилище корабля нарисована зелёная стрелка — перёд. [accent]R[] поворачивает её (сразу у всех корпусов корабля). Если вы летите с включённым «поворотом в сторону движения», корабль разворачивается стороной со стрелкой вперёд. Турели без цели смотрят вперёд. После выхода из режима корабль взлетает в том же положении, меняется только то, какая сторона считается передней.\n- [accent]Свободная установка.[] Буры, помпы, термогенераторы, водоизвлекатели и другие блоки, привязанные к местности, ставятся где угодно: ни руда, ни вода, ни жар не нужны. Выберите блок и нажмите (на телефоне — тапните) как обычно; он стоит столько же и строится столько же. В ядре должен лежать хотя бы один предмет каждого нужного вида. Работает и для вставленных схематик (их призраки белые).\n- [accent]Вставка схематики.[] Блоки достраиваются в любом порядке. Достроенные блоки, которые пока ни к чему не крепятся, ждут красными; как только цепочка блоков дотянется до ядра / хранилища, вся схематика становится одним кораблём.\n- Блоки в стройке не двигаются: достройте их до взлёта.\n- Ускорители и магниты можно ставить и вне режима постройки: это блоки земли, пока Y или режим постройки не сделают их частью корабля.\n- Если на корабле нет ускорителей, наверху экрана мигает подсказка.
ycb.guide.landing.title = Посадка и взлёт
ycb.guide.landing.text = [accent]Shift+Y[] (ПК) или кнопка посадки (телефон) сажает корабль, которым вы управляете, иначе ближайший, без режима постройки. Повторное нажатие поднимает корабль. Корабль, который правят в режиме постройки, остаётся за клавишей G.\n\n[accent]Анимация.[] Корабль опускается медленно: его тень съезжает под него, он поворачивается перёдом вверх и подплывает на точные клетки; при касании земли вылетают клубы пыли, как у ядра, садящегося на планету (их число и размер зависят от веса и ширины корабля). Взлёт — то же наоборот, пыль идёт постепенно. Пока это идёт, управлять кораблём нельзя, и он не сталкивается с другими кораблями. Это занимает от 1,3 до 8 секунд, дольше всего у тяжёлого и медленного корабля. Режим постройки (G) сажает и поднимает сразу, без анимации.\n\nЕсли под всем кораблём нет свободного места, он не садится и летит дальше. Садящийся корабль целиком поворачивается к ближайшей стороне (вверх, вправо, вниз, влево): вместе с ним поворачиваются блоки, турели и стрелка-перёд.\n\n[accent]Приказы.[] В командном режиме (RTS) в панели команд есть [accent]«Посадка»[] и [accent]«Взлёт»[]. Севший корабль, получивший приказ идти или атаковать, сначала поднимается, потом идёт. Приказы игрока важнее автопилота.\n\n[accent]В нижнем ряду стоек[] под приказами есть [accent]«Отключить блок управления кораблём»[] (перечёркнутая сетка). Пока она включена, блоки управления всех выбранных кораблей не подают никаких сигналов: не работают модули, не переключаются процессоры, ничего не соединяется магнитами. Корабль стоит на месте, пока вы не прикажете ему идти; правила для буров и помп остаются. [accent]«Копать»[] (для кораблей с бурами) работает как у моно и поли: отметьте руды под приказом (или «Авто»). Корабль летит к ближайшей свободной жиле той руды, которой у него меньше всего, ставит на неё бур и стоит, пока его хранилища не заполнятся, потом висит где есть. «Авто» не берёт песок. От блоков управления это не зависит.\n\nБлок [accent]«Посадочное место»[]: корабль с модулем посадки садится на него сам (см. темы «Блоки» и «Модули автопилота»).\n\n[accent]Аварийная посадка.[] Если не работает ни один двигатель дольше полусекунды (их нет совсем, нет топлива, нет энергии, они выключены), корабль падает: он сохраняет скорость, не управляется и садится туда, куда его принесёт. То, на что он упал, сражается с его блоками (см. «Урон, падающие блоки, падение»).
ycb.guide.thrust.title = Тяга, скорость и вес
ycb.guide.thrust.text = Тяга считается в [accent]ракетных ускорителях[]: один ракетный ускоритель = 1.\n\n[accent]Скорость[] корабля = суммарная тяга его ускорителей x тяга одного ракетного ускорителя (по умолчанию 45 клеток в секунду на клетку корабля, см. «Настройки») / число клеток, которые занимает корабль. Вдвое тяжелее — вдвое медленнее.\n\n[accent]Поворот.[] Тяжёлый корабль и поворачивается медленнее: скорость поворота делится на (1 + вес / 60). Корабль в 60 блоков поворачивается вдвое медленнее крохотного, в 180 блоков — вчетверо; никакой корабль не поворачивается медленнее 6 градусов в секунду.\n\nДвигатели работают всё время, пока корабль в воздухе. Пока он [accent]движется[], они тратят всю энергию, топливо и жидкость; пока он только [accent]парит[] (стоит или снижается), они тратят [accent]половину[], жёлтый кружок мигает вдвое медленнее, а дыма вдвое меньше; при [accent]взлёте[] дыма вдвое больше. Двигатели севшего корабля выключены. Ускоритель, выключенный процессором, тяги не даёт. Когда не работает ни один двигатель, корабль идёт на аварийную посадку.\n\nВ середине работающего ускорителя мигает жёлтый кружок, и он пускает дым, как бур: ракетный раз в секунду, энергетический дважды, топливный трижды (у движущегося корабля; про парение и взлёт см. выше).\n\nСамый большой корабль — около 110 блоков в поперечнике.
ycb.guide.rocket.title = Ракетный ускоритель
ycb.guide.rocket.text = Базовый двигатель. 1x1, тяга 1. Для работы ничего не нужно.\n\nРецепт на Serpulo: 20 меди, 10 свинца, 5 графита. На других планетах делается из первых 2 ресурсов планеты (см. «Другие планеты и моды»).\n\nЕму не нужны ни топливо, ни энергия, поэтому несколько ракетных ускорителей — самый простой способ поднять в воздух маленький корабль. Большому кораблю нужно много таких ускорителей или более сильные двигатели: энергетический (6 ракетных) и топливный (от 14 до 17 ракетных только на топливе).\n\nСтавится в любом режиме. Вне режима постройки это обычный блок земли; Y или режим постройки (G) делают его частью корабля. Процессор может его выключить (control enabled).
ycb.guide.energy.title = Энергетический ускоритель
ycb.guide.energy.text = Двигатель 2x2 с тягой как у [accent]6 ракетных ускорителей[].\n\n[accent]Энергия:[] 90 единиц в секунду, пока корабль движется или взлетает, и 45, пока он только парит. При нехватке энергии тяга падает пропорционально, без энергии он не работает. Подайте энергию от аккумуляторов или генераторов корабля.\n\n[accent]Жидкостный бонус (по желанию).[] Подведите трубами воду или криоген: вода удваивает тягу (x2 = 12 ракетных ускорителей), криоген даёт x2,5 (15). Расход — 10 единиц жидкости за 10 секунд работы (вдвое меньше, пока корабль только парит), в баке 20, одна жидкость за раз. Без жидкости двигатель работает, только слабее.\n\nНаведите курсор (ПК): панель покажет, чего двигателю не хватает: нехватка энергии или жидкости перечёркнута красным, ниже написана текущая тяга. У летящего корабля эта панель рисуется рядом с курсором.\n\nОн светится от энергии. Рецепт на Serpulo: 100 меди, 50 свинца, 30 кремния, 20 пластания. На других планетах: первые 3 ресурса планеты.
ycb.guide.fuel.title = Топливный ускоритель
ycb.guide.fuel.text = Двигатель 3x3, сжигающий топливо: один предмет за 8 секунд работы (за 16 секунд, пока корабль только парит).\n\n[accent]Топливо и тяга:[] уголь — 14 ракетных ускорителей, споры — 15, пиротит — 17,3. В нём помещается до 20 предметов каждого вида; если видов несколько, первым сгорает самый слабый. Подавайте топливо конвейером или выгрузчиком; выгрузчик может и забирать топливо из двигателя. Без топлива он не работает.\n\n[accent]Жидкостный бонус (по желанию):[] вода x1,25, криоген x3 (уголь 42, споры 45, пиротит 52). На один сожжённый предмет уходит 20 единиц жидкости; в баке 120.\n\n[accent]На других планетах и с другими модами[] топливом служит любой горючий предмет, тяга = 4 + 10 x его горючесть (не больше 20). Где ничего не горит, топливом становятся самые летучие ресурсы планеты.\n\nРецепт на Serpulo: 300 меди, 400 свинца, 100 графита, 100 пластания, 200 титана. На других планетах: первые 4 ресурса планеты.
ycb.guide.control.title = Управление кораблём
ycb.guide.control.text = Автопилот корабля. Блок 2x2 во вкладке [accent]«Логика»[]. Рецепт на Serpulo: 50 меди, 300 свинца, 120 кремния.\n\nСтавится в режиме постройки (как ускорители); на одном корабле их может быть несколько. Нажмите [accent]карандаш[] на блоке: откроется панель на весь экран, где добавляются [accent]модули[]. Модули описаны в теме «Модули автопилота».\n\nАвтопилот ведёт только летящий корабль и корабль, севший по одному из его модулей. Корабль, который вы посадили сами (G, Shift+Y, кнопка посадки), он не трогает. Приказы командного режима (идти, атаковать, посадка, взлёт) важнее всех модулей, а пока вы ведёте корабль сами, автопилот молчит.\n\nНастройки блока (модули, проценты, точки, списки мест, таймеры) сохраняются вместе с кораблём, в сохранении игры и в схематиках: копирование и вставка их не теряют.\n\nПроцессор может выключить блок (control enabled): тогда его модули и правила не работают.\n\nНа чужом сервере блок настраивает только хост (сам сервер).
ycb.guide.spot.title = Посадочное место
ycb.guide.spot.text = Обычный блок 1x1 на земле. Рецепт на Serpulo: 20 меди, 20 свинца. Ставится [accent]вне[] режима постройки.\n\nСам по себе ничего не делает. Корабль с модулем посадки («Посадка для ресурсов» или «Точка отдыха» в режиме «садится») летит на него и садится: одно из хранилищ корабля (ядро или контейнер) должно накрывать место. Место не разрушается: оно только накрыто, пока корабль стоит, и возвращается, когда корабль взлетает. Остальным частям корабля нужна свободная земля; если что-то мешает, корабль не садится и летит дальше.\n\nМесто, на котором стоит корабль или к которому он летит, считается занятым: другие корабли вашей команды берут следующее свободное место из своего списка.\n\nЕсли вы подняли корабль с места вручную (приказ «Взлёт» или управление), его модуль посадки ставится на паузу и не посадит корабль обратно, пока вы не измените модуль.
ycb.guide.magnet.title = Магнит
ycb.guide.magnet.text = Вращающийся блок 1x1 с передом (красный) и задом (синий). Потребляет 10 единиц энергии в секунду. Рецепт на Serpulo: 40 меди, 30 кремния, 20 титана. Ставится в обоих режимах (вне режима постройки это блок земли, пока Y или G не сделают его частью корабля).\n\n[accent]Притяжение.[] Магнит одного корабля притягивает магниты [accent]другого[] корабля вашей команды в радиусе 5 клеток, повёрнутые другой стороной (перёд одного смотрит на другой магнит, и перёд второго смотрит туда же: перёд к заду). Сила равна 3 ракетным ускорителям и слабеет с расстоянием до нуля на границе в 5 клеток. Она даёт скорость так же, как двигатели (сила x мощность ускорителя / клетки корабля): большой корабль почти не сдвинется, маленький придёт быстро (но не быстрее 6 клеток в секунду). Каждый магнит тянет один раз: у корабля с десятью магнитами сила в десять раз больше. Корабли ещё и поворачиваются, каждый настолько, насколько позволяет его вес, пока магниты не станут смотреть в одну сторону, и сходятся бок о бок.\n\n[accent]Соединение.[] Когда два магнита-партнёра сблизились примерно на 1,5 клетки, смотрят в одну сторону с точностью до 10 градусов и блоки можно сложить без наложения, лёгкий корабль входит в тяжёлый: получается [accent]ОДИН корабль[], с одним весом и тягой всех двигателей. Кто вёл вошедший корабль, ведёт общий. Если блоки наложились бы, корабли просто упираются друг в друга.\n\n[accent]Отпускание.[] Если у магнитов нет энергии треть секунды или магнит уничтожен, связь рвётся. Группы блоков, не связанные с главной, отделяются в самостоятельные корабли с той же скоростью. Часть, у которой не осталось двигателей, падает (сохраняя скорость), а её блоки остаются на земле обычными блоками.\n\n[accent]Одинаковые полюса отталкивают.[] Два магнита, смотрящие друг на друга (красный к красному) или спиной к спине (синий к синему), отталкивают свои корабли с той же силой. Они только толкают: без поворота и без соединения. Магниты одного корабля друг на друга не действуют.\n\n[accent]На земле.[] Включённый магнит, стоящий на земле, действует и на летающие корабли вашей команды с магнитами: разные полюса притягивают корабль к земле, одинаковые отталкивают. Подробнее в теме «Супер магнит».
ycb.guide.supermagnet.title = Супер магнит
ycb.guide.supermagnet.text = Вращающийся блок 2x2 с передом (красный) и задом (синий): сильный брат Магнита. Рецепт на Serpulo: 100 кинетического сплава (surge), 200 графита, 200 свинца (на другой планете первые 3 ресурса планеты). Потребляет 500 единиц энергии в секунду. Радиус 25 клеток, сила как у 100 ракетных ускорителей (у Магнита: 5 клеток и 3 ускорителя), то есть радиус в 5 раз больше, а сила в 33 раза. Притянутый им корабль летит до 12 клеток в секунду (у Магнита: 6).\n\n[accent]С другими магнитами.[] Работает и с супер магнитами, и с обычными по тем же правилам (разные полюса притягивают, одинаковые отталкивают, соединение кораблей, отпускание: см. Магнит). Пара разных магнитов работает с более сильной тягой и большим радиусом из двух, а мощность берётся у того, кто получает меньше энергии.\n\n[accent]На земле.[] Магнит, стоящий на земле (и обычный тоже, и магнит севшего корабля), не бездействует. Он действует на магниты [accent]летающих[] кораблей вашей команды в своём радиусе по тем же правилам полюсов. [accent]Одинаковые полюса отталкивают[] корабль. [accent]Разные полюса притягивают его к магниту[]: корабль летит к магниту, разворачивается, пока его магнит не посмотрит в ту же сторону, его тень плавно уменьшается, как при посадке, и когда его притянет до конца, он садится магнитом [accent]стык в стык[] с магнитом на земле (1x1 к 2x2 садится к одной из двух клеток; если место занято, он сдвигается вдоль грани или берёт другую клетку; если места нет совсем, корабль остаётся в воздухе). Притяжения всех магнитов, действующих на корабль, складываются, садится он к сильнейшей паре, у которой есть место; чем сильнее притяжение, тем быстрее корабль летит.\n\n[accent]Когда притягивает.[] Только корабль, который парит и не двигается: его никто не ведёт, ни приказ, ни автопилот никуда его не посылают. Когда притяжение началось, кораблём нельзя управлять. Вырваться из притяжения (он поднимется и полетит дальше) и взлететь, если он уже сел, он может только тогда, когда тяга его двигателей [accent]больше[] притяжения действующих на него магнитов. Если у магнитов пропадает энергия или они уничтожены, корабль поднимается сам.
ycb.guide.builder.title = Строитель схематик
ycb.guide.builder.text = Принтер кораблей [accent]16x16[], ставится вне режима постройки. Никогда не входит в состав корабля. Время постройки самого блока — 6 минут. Рецепт на Serpulo: 1000 кинетического сплава, 2000 графита, 1500 пластания.\n\n[accent]Выбор корабля.[] Нажмите карандаш под блоком: в списке схематики кораблей. Схематика — корабль, если она не больше 16x16 клеток, в ней есть ядро или хранилище, все блоки касаются друг друга и нет строителя. Чтобы её создать, скопируйте корабль в режиме постройки (G) как схематику. Схематики, которые не корабли, перечислены внизу с причиной.\n\n[accent]Направление.[] Вторая кнопка (после карандаша) задаёт, куда [accent]смотрит[] напечатанный корабль: вправо, вверх (как в схематике), влево или вниз. Каждый новый создатель начинает с той стороны, куда смотрит сам (настройку другого создателя он не копирует). А [accent]вылетает[] корабль всегда в ту сторону, куда смотрит сам создатель (поверните создатель клавишей R до установки, стрелки на полу показывают выход), каким бы ни был выбранный поворот, и сохраняет выбранный поворот.\n\n[accent]Печать[] идёт как у завода юнитов. Нужны предметы схематики (стоимость каждого блока) + 100 фазовой ткани, 3000 энергии и 240 криожидкости в секунду; печать идёт в 1,5 раза дольше, чем игрок строит все её блоки. Строитель хранит все виды жидкостей и принимает предметов до двух раз больше, чем нужно на один корабль. Оранжевый силуэт показывает ход печати, а три дымохода горят, пока идёт печать.\n\n[accent]Новый корабль[] появляется в воздухе над блоком с выбранным поворотом, несётся создателем в сторону, куда тот смотрит, а потом выполняет модули своего блока управления. [accent]Первый полёт.[] Третья кнопка (две стрелки вверх) открывает два ползунка: сколько блоков корабль будут нести (от 0 до 50, по умолчанию 10) и скорость (от 1 до 10 блоков в секунду, по умолчанию 2). Корабль несут ровно с этой скоростью, какой бы ни была его масса и двигатели. При 0 блоков он просто висит над создателем (скорость тогда 0, и менять её нельзя). Под каждым ползунком написана его цена в пиротите, между ними стоит x: корабль стоит на [accent]блоки x скорость[] пиротита дороже (по умолчанию 20). Корабль без работающих двигателей падает, когда перенос закончится. Модули «Предзагрузка ресурсов», «Загрузка жидкости» и «Соединение при крафте» читает именно строитель.
ycb.guide.mods.title = Как работают модули
ycb.guide.mods.text = Блок «Управление кораблём» выполняет модули [accent]по очереди сверху вниз, а после последнего снова с первого[] (по кругу).\n\nМодуль держит корабль, пока не выполнится или не сможет работать; потом корабль получает следующий. Модуль, который сейчас ничего не может (нет бура, всё занято, ресурс уже набран), пропускается. Если на корабле несколько блоков управления, первым идёт тот, что построен раньше. Приказы командного режима важнее всех модулей.\n\n[accent]Цвета[] такие же, как у инструкций процессора: [#ff6060]красный[] — получение ресурсов и объединение; [#5aa0ff]синий[] — отдых; [#ffa040]оранжевый[] — то, что получает напечатанный корабль; [#b280ff]фиолетовый[] — правила; [#5fe070]зелёный[] — процессоры; [#40d8d0]бирюзовый[] — центр поворота. На каждой карточке состояние написано словами (ждёт очереди, добывает, летит к точке, выполнено, на паузе...).\n\nМодули добавляются кнопками под списком, их можно переставлять и удалять. Если вы подняли корабль с посадочного места вручную, этот модуль посадки встаёт на паузу, пока вы его не измените. Руда, точка или посадочное место, которое занял один корабль, закрыты для остальных, пока это его цель.
ycb.guide.modres.title = Ресурс и посадка для ресурсов
ycb.guide.modres.text = [accent]Ресурс[] (красный). Выберите руду, песок или жидкость из тех, что есть на карте, и процент заполнения (по умолчанию 50%, от 0 до 100). Предметы считаются от вместимости хранилищ корабля (ядро, контейнеры), жидкость — от вместимости его баков и жидкостных контейнеров (без баков жидкость недоступна). Кораблю нужен бур, который может добыть эту руду, или помпа.\n\n[accent]Одного кончика мало.[] Простояв 2 секунды у жилы, корабль считает клетки, с которых его буры (помпы) действительно берут руду, и сравнивает их с максимумом, который даёт одна жила: клетки всех его буров и помп для этого ресурса, но не больше, чем есть в жиле (маленькая жила считается как есть). Если меньше половины, корабль перемещается на другое место, стоит там 2 секунды и считает снова, всего не больше 5 мест (первое тоже считается). Если ни одно место не достигло половины, он возвращается на лучшее и остаётся там. Он пробует только места, где буры покроют больше, чем на лучшем из уже проверенных, поэтому может остановиться раньше. Это работает и для модуля «Ресурс», и для приказа «Копать».\n\nКорабль летит к жиле, ближайшей к его буру или помпе (а не к середине корабля), плавно подлетает и останавливается совсем: ни тяги, ни поворота, ни расхода топлива и энергии. Если что-то оттолкнёт его дальше чем на клетку, он вернётся. Когда процент набран, модуль отдаёт корабль следующему. После каждой команды ближайшая жила выбирается заново от того места, где корабль сейчас.\n\n[accent]У каждого корабля своя руда.[] Жила, которую корабль выбрал целью, закрыта для других кораблей вашей команды (круг вокруг неё, чтобы два корабля не оказались друг на друге), пока это его цель. Если ближайшая занята, берётся следующая свободная; если заняты все, карточка пишет «Все руды / места заняты другими кораблями», а корабль идёт дальше по кругу.\n\n[accent]Посадка для ресурсов[] (красный). Список посадочных мест (берётся первое свободное) и ресурсов, предметов и жидкостей, с процентом у каждого. Корабль летит к первому свободному месту, садится и стоит, пока все перечисленные ресурсы не наберутся до своих процентов (заполнить можно конвейером, выгрузчиком или вручную). Потом он взлетает и отдаёт корабль следующему модулю. Здесь же выбирается сторона посадки: как есть, перёд вверх / вниз / влево / вправо или любая подходящая.
ycb.guide.modrest.title = Точка отдыха
ycb.guide.modrest.text = [accent]Точка отдыха[] (синий) задаёт, как и где корабль отдыхает.\n\n[accent]Корабль[] висит над точкой или садится на посадочное место. Выбирается кнопкой. В списке точки на карте (висит) или посадочные места (садится); они перебираются по порядку, берётся первое свободное, стрелки меняют порядок. Точка занята, если над ней уже висит другой корабль или летит к ней так близко, что корабли коснулись бы друг друга. Если свободных нет, карточка так и пишет, а корабль идёт дальше.\n\n[accent]Отдых, пока каждый из ресурсов не ниже...[] Список ресурсов с процентом у каждого. Когда любой из них упал ниже своего процента, отдых кончается и корабль переходит к следующему модулю. Отдых не начинается, пока какой-то ресурс списка уже ниже процента (иначе корабль сразу бы улетел).\n\n[accent]Таймер отдыха (по желанию).[] Кнопка включает его, поле задаёт секунды (по умолчанию 30, максимум 3600). Отдых кончается по тому, что наступит раньше: ресурс или таймер. Если нет ни списка, ни таймера, отдых не кончается.\n\nЕсли ни один другой модуль ничего не хочет от корабля, он остаётся на точке отдыха.
ycb.guide.modrule.title = Правила для буров и помп
ycb.guide.modrule.text = [accent]Правило[] (фиолетовый) говорит, какие ресурсы могут брать буры и помпы корабля. Это не задача автопилота: поставьте его в списке где угодно, порядок не важен.\n\n[accent]Цель.[] «Все буры и помпы» (по умолчанию) или один блок. Блок выбирается из списка (название и сдвиг от блока управления) или нажатием на него на карте. Сдвиг одинаков в полёте и на земле, поэтому правило не сбивается при посадке и взлёте. Если на этом месте блока больше нет, карточка пишет «Блок не найден».\n\n[accent]Режим.[] Белый список: блок берёт только перечисленные ресурсы. Чёрный список: берёт всё, кроме перечисленных. Ресурсы правила: для бура руды и песок, которые он вообще может брать, для помпы жидкости; для «всех» — всё, что берёт хоть один бур или помпа корабля.\n\n[accent]Как действует.[] Бур «не видит» запрещённую руду: если под ним две руды, а разрешена одна, он берёт её, даже если запрещённой под ним больше. Помпа так же выбирает жидкость. Автопилот тоже учитывает правила: ресурс он везёт только тем буром или помпой, которым это разрешено; если запрещено всем, модуль пишет «Запрещено правилом».\n\n[accent]Мелочи.[] Пустой список ничего не меняет. Несколько правил для одного блока действуют вместе: ресурс должен пройти каждое. Белый список ограничивает только тот вид, который в нём назван: список руд не мешает помпам, а список с водой и медью ограничивает и буры, и помпы. Правила действуют, пока корабль летит; на земле буры — обычные блоки.
ycb.guide.modcenter.title = Центр поворота
ycb.guide.modcenter.text = [accent]Центр[] (бирюзовый, настройка, а не задача) задаёт точку корабля, от которой всё отсчитывается: корабль поворачивается вокруг неё (клавиши Q и E, поворот по курсу, автопилот, столкновения, магниты), и именно эта точка летит к цели. Модуль можно поставить в любое место списка; если их несколько, действует первый из блока управления, построенного раньше.\n\n[accent]Ядро или хранилище.[] Выберите какое: в списке или нажатием на карте. Работает только если на корабле два и больше ядер и хранилищ; если оно одно, кнопка выключена, а карточка пишет, что нужно два.\n\n[accent]Среднее клеток[] (по умолчанию). Средняя позиция всех клеток, которые заняты блоками; большой блок считается всеми своими клетками. Точка смещается, когда блоки добавляются или теряются.\n\n[accent]Выбранный блок.[] Любой блок корабля; нажмите на него на карте (по умолчанию сам блок управления).\n\n[accent]Как это работает.[] Точка задаётся при взлёте. Если она потом меняется (блок добавлен или потерян, модуль изменён или удалён), блоки остаются на своих местах в мире, двигается только точка, поэтому корабль не прыгает. Во время анимаций посадки и подъёма точка не меняется. Без модуля «Центр» или когда модуль не может работать (нет такого блока, всего одно ядро), корабль поворачивается вокруг главного ядра или хранилища. Смещение выбранного блока сохраняется, если корабль сел повёрнутым. Пока корабль стоит на земле, модуль не используется.
ycb.guide.modjoin.title = Объединение кораблей магнитами
ycb.guide.modjoin.text = Два модуля помогают кораблям встретиться и соединиться магнитами (см. блок «Магнит»).\n\n[accent]Точка объединения[] (красный, задача автопилота). Выберите точку на карте и [accent]поворот[] в градусах (0 = как построен корабль, против часовой стрелки). Корабль летит в точку, поворачивается на заданный угол и стоит там, пока магниты не объединят его с другим кораблём. После объединения модуль выполнен, и корабль берёт следующий; если корабли разойдутся, он вернётся в точку. Пока магниты тянут корабль, он им не сопротивляется, иначе корабли не смогли бы сойтись.\n\n[accent]Соединение при крафте[] (оранжевый, без настроек, читает строитель схематик). Корабль, напечатанный строителем, летит в ту точку, куда его отправил строитель, стоит там с точным поворотом, с которым его напечатали, и не двигается. Если что-то его сдвинет, он возвращается в точку с точным поворотом, пока магниты не объединят его с другим кораблём. Модули автопилота в это время не выполняются. Приказ игрока или управление вручную прекращают ожидание. Ожидание сохраняется в сохранении игры.\n\nВместе с магнитами это позволяет строителю печатать части большого корабля, которые собираются сами в воздухе.
ycb.guide.modmisc.title = Процессоры, предзагрузка, загрузка жидкости
ycb.guide.modmisc.text = [accent]Процессоры[] (зелёный, параметр, а не задача). Выберите событие: корабль [accent]садится[], [accent]взлетает[] или [accent]получает урон[]; выберите действие: включить, выключить или переключить; и добавьте процессоры корабля в список кнопкой «+ Процессор». Действие — то же, что собственная команда процессора «control enabled». Посадка и взлёт засчитываются каждый раз, в том числе при входе в режим постройки и выходе из него. Урон проверяется несколько раз в секунду и срабатывает не чаще двух раз в секунду. В режиме постройки урон не отслеживается. Несколько модулей — несколько действий.\n\nПроцессоры могут выключать и другое: магнит (не притягивает, не тратит энергию), строитель схематик (печать останавливается), блок управления кораблём (его модули и правила не работают) и все ускорители (тяги нет, топливо и энергия не тратятся; если выключены все, корабль идёт на аварийную посадку).\n\n[accent]Предзагрузка ресурсов[] (оранжевый, читает строитель). Перечисленные предметы сразу появятся в хранилище (сначала в ядре) корабля, напечатанного строителем схематик. Они добавляются к стоимости: строитель берёт их тоже. Что не поместилось, остаётся в строителе. Для корабля, построенного вручную, ничего не делает.\n\n[accent]Загрузка жидкости[] (оранжевый, читает строитель). Баки напечатанного корабля заполняются выбранной жидкостью на выбранную долю их вместимости. Строитель переливает её из своих баков (подведите к нему трубы) и ждёт, пока её не хватит.
ycb.guide.fly.title = В полёте: блоки, буры, турели
ycb.guide.fly.text = [accent]Всё работает.[] Конвейеры двигают предметы, мосты и провода сохраняют связи, выгрузчики, хранилища, генераторы, заводы и турели работают как обычно. Севший корабль — снова часть карты, там всё работает обычным образом.\n\n[accent]Буры[] добывают то, что сейчас под кораблём: если краем бура касается руда, он добывает её. Руда переключается на лету, пока корабль движется, поэтому бур можно поставить где угодно (см. «Свободная установка») и пролететь на нём над рудой. [accent]Помпы[] берут жидкость из воды, которой касаются, и отдают её в соседние баки и трубы. Труба, выходящая в пустоту, проливает жидкость на землю под кораблём. Термогенераторы, культиваторы и водоизвлекатели читают пол под летящим кораблём.\n\n[accent]Турели работают как одно орудие.[] Когда корабль выбирает цель (или вы стреляете сами), все пушки разворачиваются на неё и стреляют вместе. У каждой турели свой боезапас и своя скорость поворота. Прицел учитывает упреждение и скорость корабля.\n\n[accent]Снаряды сохраняют скорость корабля.[] Как у снарядов юнита, к скорости снарядов его орудий прибавляется скорость корабля (кроме лазеров, молний и других, у которых игра отключила наследование скорости). Летающий корабль считается воздушной целью: снаряды, бьющие только по воздуху (зенитная шрапнель), могут попасть в него, а снаряды только по земле (артиллерия, огонь) не могут; фазовые стены отражают снаряды.\n\n[accent]Вид.[] Каждый блок отбрасывает тень. Повреждённый блок покрывается трещинами, чем больше урон, тем они темнее. Летящий корабль рисуется над затемнением у края карты и над толстыми стенами и там не темнеет.
ycb.guide.collide.title = Столкновения и вес
ycb.guide.collide.text = Каждая занятая клетка весит 1, так что корабль из 100 блоков в 100 раз тяжелее одиночного блока.\n\nПри касании корабли обмениваются [accent]импульсом[] (масса x скорость), как бильярдные шары: суммарный импульс сохраняется, но часть кинетической энергии теряется (удар не абсолютно упругий и не абсолютно мягкий, коэффициент 0,25). Расталкиваются они обратно пропорционально массе, поэтому тяжёлый корабль почти не сдвигается, а лёгкий отлетает.\n\nПример: 100 блоков на 1 клетке в секунду несут импульс 100, один блок на 10 клетках в секунду — только 10, поэтому большой корабль продолжает путь, а маленький отброшен назад.\n\nДвигатели работают и во время контакта: лёгкий корабль, упёршийся в тяжёлый, его не сдвинет, а тяжёлый может нести лёгкий перед собой. Сильные удары высекают искры. У корабля игрока нет приоритета: решает только масса.\n\nВо время посадки и взлёта корабли не сталкиваются. В режиме постройки блоки мира останавливают корабль как обычные блоки; в полёте рельеф не мешает.\n\nТяжёлые корабли ещё и медленнее поворачиваются (см. «Тяга, скорость и вес»).
ycb.guide.damage.title = Урон, падающие блоки, падение
ycb.guide.damage.text = [accent]Урон.[] Вражеские снаряды попадают в конкретные блоки корабля (броня учитывается). Если уничтожен блок, державший другие, всё, что оторвалось от корпуса, падает. Если уничтожены все ядра и хранилища, разрушается весь корабль, а его оставшиеся блоки падают.\n\n[accent]Падающие блоки.[] Каждая оторвавшаяся группа становится обломком: он сохраняет скорость и поворот корабля на момент отрыва, проигрывает анимацию посадки в 1,5 раза быстрее (без дыма и пыли) и касается земли. Каждый блок отдаёт свои здоровье [accent]врагам[] под ним (юнит погибает, если получил не меньше своего здоровья). После этого все блоки обломка уничтожаются с обычным взрывом: топливо и горючее загораются, аккумуляторы взрываются, жидкости разливаются. Союзники не страдают. Режим постройки ничего не роняет: там оторванные блоки просто краснеют.\n\n[accent]Посадка на врагов.[] Когда корабль садится (любая посадка, в том числе G), каждый вражеский наземный юнит (в том числе шагающий), которого задевает блок, сражается с блоками, которых касается. Если у блоков в сумме больше здоровья, чем у юнита (здоровье + щит), юнит погибает, а блоки вместе теряют 25% здоровья юнита (но ни один не опускается ниже 1). Иначе юнит теряет столько здоровья, сколько было у блоков, а блоки [accent]ломаются[] (взрываются, как любой уничтоженный блок). Если сломалось ядро или хранилище, его место занимает другое хранилище корабля; если их не осталось, корабль распадается на обычные блоки. Юниты вашей команды и нейтральные не страдают, их просто выставляют на ближайшее свободное место.\n\n[accent]Падение.[] Корабль без работающих двигателей не выбирает место: он падает точно туда, куда его принесёт скорость. Каждое задетое здание сравнивается с суммарным здоровьем упавших блоков. Если здоровья у блоков больше, здание уничтожено и замещено, а блоки теряют 25% его здоровья. Если столько же или меньше, блоки ломаются, а здание получает урон, равный их здоровью. Блоки, упавшие на то, что застроить нельзя (стена карты, глубокая вода, за краем карты), тоже ломаются. [accent]Зона аннигиляции.[] В начале волны игра уничтожает всё ваше рядом с наземными точками появления врага (красный круг). Летающий корабль над ней не в безопасности: каждый блок, оказавшийся в этот момент внутри круга, отрывается и падает, как любой блок, потерявший опору (экстренное падение). Что держали оторванные блоки, падает вместе с ними; если оторван корпус, падает весь корабль. Корабли команды волн не затрагиваются.
ycb.guide.fire.title = Огонь и взрывы
ycb.guide.fire.text = У летящего корабля свои огни и свои взрывы, связанные с землёй под ним. Севший корабль стоит на карте, там работает штатный огонь игры.\n\n[accent]Огонь.[] На каждой горящей клетке блока горит один огонь.\n- Он возникает от зажигательных снарядов, от разрушенного блока с горючим внутри (уголь, нефть, споры...); огонь земли под блоками переходит на корабль при взлёте (а огонь корабля на землю при посадке).\n- Каждые полсекунды он бьёт свой блок (2,5 урона x сила огня, броня не считается). Без топлива он живёт около 17 секунд.\n- Пока в блоке есть горючее, огонь набирает силу (до x4 урона) и живёт дольше; без горючего слабеет.\n- Он перекидывается на соседние блоки, а раз в 0,75 секунды может упасть вниз: если под ним блок на земле, там загорается настоящий огонь.\n- Блок, где есть вода или другая тушащая жидкость (от 10 единиц), гасит свой огонь быстро. Волновые турели на корабле его огонь сами не тушат.\nНа корабле может гореть до 400 огней; они не сохраняются в сохранении.\n\n[accent]Взрывы.[] Умирающий блок взрывается по числам игры: по взрывчатости, горючести и заряду того, что в нём лежит.\n- Волны бьют блоки всех летящих кораблей в радиусе, в том числе своего. С краю урон равен 40%. Броня считается.\n- [accent]Аккумуляторы[] (и любой блок с зарядом) при гибели разряжаются: урон = заряд / 25, не больше 600; блокам, которым нужна энергия, достаётся x1,5.\n- [accent]Ториевый реактор[] (и импульсный) бьёт всё вокруг своим радиусом и уроном (у ториевого 19 клеток и 5000). Он взрывается только заряженным: топлива от 5 или нагрева от 0,5, и если в правилах включены взрывы реактора.\n- Блок корабля при гибели по-прежнему запускает штатный взрыв игры на земле под ним (блоки бьются, огонь, молнии). Блок на земле при гибели так же бьёт корабли над ним.\nВзрывы идут цепочкой с задержкой в несколько тиков, как волны игры. Правила игры «огонь», «урон от взрывов» и «взрыв реактора» учитываются.
ycb.guide.units.title = Проекторы и фабрики юнитов
ycb.guide.units.text = [accent]Мендеры и проекторы.[] Мендер, восстановительный проектор и овердрайв-проектор на летящем корабле действуют на блоки [accent]этого корабля[], а не на настоящие блоки под ним: мендеры лечат повреждённые блоки, овердрайв ускоряет блоки. Силовой проектор создаёт поле вокруг корабля, нарисованное как в самой игре. Процессор может выключить проектор. На севшем корабле блоки стоят на карте и работают обычным образом.\n\n[accent]Фабрики юнитов.[] Фабрика юнитов (и реконструктор) на летящем корабле держит готового юнита, только если блок перед ней его принимает: грузовой конвейер, роутер, массдрайвер и т. п. или реконструктор, который умеет улучшить именно этого юнита. Во всех остальных случаях:\n- [accent]воздушный[] юнит вылетает (в том числе когда впереди стоит блок: раньше он оставался внутри навсегда);\n- [accent]наземный, шагающий или водный[] юнит падает на настоящую землю под кораблём: на ближайшее место, где он может стоять (до 5 клеток от точки падения), с облачком пыли и частью скорости корабля. Водный юнит, упавший не на воду, гибнет, как и в самой игре.\nРеконструктор в конце цепочки выпускает юнита так же, когда ему некуда улучшать дальше. Лимит юнитов учитывается: при лимите юнит ждёт в фабрике.
ycb.guide.planets.title = Другие планеты и моды
ycb.guide.planets.text = [accent]Все блоки мода есть на всех планетах[], в том числе на Erekir и на планетах из других модов. Они всегда открыты (исследовать не нужно), видны во вкладке «Юниты» (блок управления кораблём — в «Логике») и ставятся где угодно, в том числе в космосе и под водой.\n\n[accent]Рецепты.[] На Serpulo действуют классические рецепты. На любой другой планете блок делается из первых ресурсов списка планеты; чем «старше» блок, тем больше первых ресурсов он берёт:\n- Ракетный ускоритель: 2 ресурса, 20 и 10\n- Посадочное место: 2 ресурса, 20 и 20\n- Энергетический ускоритель: 3 ресурса, 100, 50 и 30\n- Управление кораблём: 3 ресурса, 50, 300 и 120\n- Топливный ускоритель: 4 ресурса, 300, 400, 100 и 200\nЕсли у планеты ресурсов меньше, берутся все. Строитель схематик берёт последний ресурс планеты (вместо кинетического сплава и фазовой ткани) и первые два (вместо графита и пластания).\n\n[accent]Список ресурсов планеты[] идёт в том порядке, в каком планета их выдаёт: её дерево исследований, уровень за уровнем (только предметы); затем остальные ресурсы, сделанные для этой планеты, в том порядке, в котором мод их объявил; и только если у планеты нет своих ресурсов, остальные ресурсы.\n\n[accent]Топливо.[] На Serpulo горят уголь, споры и пиротит. Любой предмет из другого мода с горючестью от 0,3 тоже топливо, с тягой 10 x горючесть (максимум 20). Где ничего не горит (Erekir), топливом становятся самые летучие ресурсы планеты. Жидкостный бонус по-прежнему дают только вода и криоген.\n\nРецепты пересчитываются при загрузке мира или сектора и когда у игры меняется планета.
ycb.guide.multi.title = Многопользовательская игра
ycb.guide.multi.text = Мод работает в одиночной игре, у хоста и на выделенном сервере. [accent]Мод одной и той же версии нужен и серверу, и каждому клиенту.[]\n\n[accent]Как устроено.[] Всю работу кораблей выполняет сервер: полёт, посадку и взлёт, урон, огонь, автопилот, приказы. Клиент логику кораблей не запускает: он держит копию каждого корабля и рисует её. Полёт, анимации взлёта и посадки с пылью, наведение турелей, работа двигателей, урон, огонь, выстрелы и взрывы синхронизируются.\n\n[accent]Клиент может[] управлять кораблём (Y, Shift+Y или Ctrl + щелчок), отдавать ему приказы командного режима (идти, «Посадка», «Взлёт») и пользоваться G и Y. Блок управления кораблём и строитель схематик настраивает только хост (сам сервер).\n\n[accent]Режим постройки локальный.[] G включается только у вас: выбранный вами корабль (тот, в котором вы сидите, иначе под курсором, иначе ближайший) садится, остальные продолжают лететь. [accent]Фиолетовая маска[] — это слой корабля; клетки с маской видят все игроки, а у корабля, который сейчас кто-то правит, маска ярче и мигает. Блоки, которые вы ставите в G, для других выглядят фиолетовыми, пока вы не выйдете. Выход из G поднимает только те корабли, у которых не осталось редакторов; севший (припаркованный) корабль остаётся на земле.\n\n[accent]Сохранение.[] Корабли сохраняются в отдельном блоке файла сохранения, поэтому даже большие базы сохраняются без ошибки «encoded string too long». Старые сохранения загружаются.
ycb.guide.settings.title = Настройки, ограничения и советы
ycb.guide.settings.text = [accent]Настройки[] (Настройки, страница мода):\n- Тяга одного ракетного ускорителя: по умолчанию 45 клеток в секунду на клетку корабля. От неё зависит скорость любого корабля.\n- Поворачивать летающий корабль в сторону движения: включено по умолчанию.\n- Кнопка YCB guide.\n\n[accent]Ограничения.[]\n- Корабль — не больше около 110 блоков в поперечнике.\n- Блоки в стройке не двигаются: достройте их до взлёта.\n- Свободная установка работает только в режиме постройки и только для блоков, у которых игра сама проверяет местность (буры, помпы, термогенераторы и т. п.). В ядре должен лежать хотя бы один предмет каждого нужного вида.\n- Предметы в хранилище, оторванном и удалённом при выходе из режима постройки, пропадают.\n- Наземные враги прокладывают путь к ядрам по карте: пока ядро летит, они его так не находят. Атаковать корабль может любой враг, который его видит и стреляет по воздуху.\n- Автопилот уступает приказам командного режима. Посадка по модулю возможна, только если под всем кораблём есть место. Пока идёт посадка или взлёт, кораблём нельзя управлять и приказы не действуют.\n- Ускорители при повороте не зеркалятся.\n- Враги целятся в центр летающего корабля, а не в отдельные блоки. Лазеры, молнии и энергетические поля (Наванакс, Эгирес) не повреждают его блоки, а вражеский Параллакс не может его притянуть.\n- Плазменные буры и дробители скал не добывают ничего из стен, пока корабль летит.\n\n[accent]Советы.[]\n- Скопируйте корабль в режиме постройки как схематику: строитель сможет её напечатать, а модули его блока управления поедут вместе с ней.\n- Поставьте посадочные места у своих буров и дайте кораблю модуль «Посадка для ресурсов»: он сам будет возить и разгружаться.\n- Несколько магнитов на корабле тянут сильнее; ставьте их на сторону, обращённую к партнёру.\n- Если корабль не взлетает, посмотрите наверх экрана, нет ли подсказки про ускорители, и проверьте топливо и энергию.
