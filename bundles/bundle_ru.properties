mb.hud.build.mobile = Режим постройки летающего корабля. Поставленные блоки входят в летающий корабль; блоки без крепления к корпусу подсвечены красным и будут удалены при выходе. «Перенос построек» отправляет блок на другой слой (мир / корабль). «Поворот летающего корабля» поворачивает зелёную стрелку (перёд) летающего корабля в центре экрана.
