block.your-custom-battleship-ship-builder.name = Строитель схематик
block.your-custom-battleship-ship-builder.description = Принтер кораблей 16×16. Нажмите на карандаш под блоком и выберите схематику корабля: в списке только схематики не больше 16×16 клеток с ядром или хранилищем, все блоки которых касаются друг друга. Блок можно повернуть (R) при установке: стрелки на полу показывают, куда выйдет готовый корабль (всегда в ту сторону, куда смотрит создатель; поворот корабля задаётся кнопкой направления). Печатает как завод юнитов: нужны предметы схематики (стоимость постройки каждого блока) + 100 фазовой ткани, 3000 энергии в секунду и 240 криожидкости в секунду; печать идёт в 1,5 раза дольше, чем игрок строит все её блоки. Пока идёт печать, три дымохода горят и дымят. Готовый корабль пролетает чуть вперёд и дальше выполняет приказы своего блока управления. Нельзя поставить в режиме конструктора летающего корабля, никогда не входит в состав корабля. Рецепт зависит от планеты: на Серпуло кинетический сплав, графит и пластан; на другой планете последний по id ресурс планеты (вместо кинетического сплава и фазовой ткани) и два первых ресурса планеты (вместо графита и пластана). Хранит в себе все виды жидкостей. Блок управления кораблём в схематике может запросить предзагрузку ресурсов (они добавляются к стоимости и сразу появляются в хранилище нового корабля) и загрузку жидкости (строитель переливает её из своих баков в баки нового корабля).
