block.your-custom-battleship-rocket-booster.name = Ракетный ускоритель
block.your-custom-battleship-rocket-booster.description = Базовый двигатель летающего корабля. Ставится только в режиме конструктора летающего корабля. Тяга = 1. Скорость летающего корабля равна суммарной тяге всех ускорителей, умноженной на мощность одного ракетного ускорителя и делённой на число клеток, которые занимает летающий корабль. Рецепт зависит от планеты: на Serpulo классический, на любой другой планете он делается из первых 2 ресурсов планеты.
block.your-custom-battleship-energy-booster.name = Энергетический ускоритель
block.your-custom-battleship-energy-booster.description = Двигатель 2×2 с тягой как у 6 ракетных ускорителей. Потребляет 90 ед. энергии в секунду, пока летающий корабль летит; при нехватке энергии тяга падает. Жидкостный бонус (по желанию): вода удваивает тягу (x2 = 12 ракетных ускорителей), криоген даёт x2,5 (15); расход — 10 ед. жидкости за 10 секунд работы. Ставится только в режиме конструктора летающего корабля. Рецепт зависит от планеты: на Serpulo классический, на любой другой планете он делается из первых 3 ресурсов планеты.
block.your-custom-battleship-fuel-booster.name = Топливный ускоритель
block.your-custom-battleship-fuel-booster.description = Двигатель 3×3, сжигает 1 предмет за 8 секунд работы. Уголь даёт тягу как у 14 ракетных ускорителей, споры — как у 15, пиротит — как у 17,3. Жидкостный бонус (по желанию): вода даёт x1,25, криоген x3 (42 / 45 / 52 ракетных ускорителя); на 1 сожжённый предмет уходит 20 ед. жидкости. Топливо подаётся конвейером или выгрузчиком, забрать его из двигателя тоже можно выгрузчиком; без топлива двигатель не работает. Ставится только в режиме конструктора летающего корабля. На других планетах и с другими модами топливом служит любой горючий ресурс (тяга = 4 + 10 × его горючесть); где ничего не горит — самые летучие ресурсы. Рецепт зависит от планеты: на Serpulo классический, на любой другой планете он делается из первых 4 ресурсов планеты.
