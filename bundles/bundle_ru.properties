block.your-custom-battleship-ship-control.name = Управление кораблём
mb.ship.nothing = На карте нет руд и жидкостей
block.your-custom-battleship-ship-control.description = Говорит летающему кораблю, что делать: логические модули выполняются по очереди сверху вниз, а после последнего снова с первого (по кругу); модуль держит корабль, пока не выполнится. Ресурс: привезти руду или жидкость до заданного процента (руда, которую занял один корабль, закрыта для остальных). Точка отдыха: зависнуть над точкой или сесть на посадочное место и стоять, пока заданные ресурсы держатся выше своих процентов, либо по таймеру; список мест перебирается по порядку, берётся первое свободное. Посадка для ресурсов: сесть на первое свободное посадочное место из списка и стоять, пока заданные ресурсы не наберутся до процентов, затем взлететь. Карандаш открывает меню. Ставится только в режиме конструктора летающего корабля; на одном летающем корабле их может быть несколько. Рецепт зависит от планеты: на Serpulo классический, на любой другой планете он делается из первых 3 ресурсов планеты. Блок может также хранить предзагрузку ресурсов и загрузку жидкости: корабль, напечатанный строителем схематик, получит эти ресурсы в хранилище (они добавляются к стоимости), а его баки будут заполнены жидкостью.
block.your-custom-battleship-landing-spot.name = Посадочное место
block.your-custom-battleship-landing-spot.description = Обычная площадка на земле. Летающий корабль с модулем посадки летит на неё и садится: одно из его хранилищ перекрывает площадку (сама площадка не разрушается, только накрыта, пока летающий корабль стоит). Взлетает, когда его модули выполнены. Ставится вне режима конструктора. Рецепт зависит от планеты: на Serpulo классический, на любой другой планете он делается из первых 2 ресурсов планеты.
block.your-custom-battleship-magnet.name = Магнит
block.your-custom-battleship-magnet.description = Блок на одну клетку с передом (красный) и задом (синий); вращается. Потребляет 10 единиц энергии в секунду. Магнит одного летающего корабля притягивает магниты ДРУГОГО летающего корабля вашей команды в радиусе 5 клеток, повёрнутые другой стороной (перед одного смотрит на другой магнит, и перед второго смотрит туда же: перед к заду). Сила притяжения равна 3 ракетным ускорителям и слабеет с расстоянием; она даёт скорость так же, как двигатели: большой летающий корабль почти не сдвинется, маленький придёт быстро; корабли также разворачиваются, чтобы встать бок о бок. Когда два магнита встретятся, летающие корабли становятся ОДНИМ летающим кораблём: один вес, тяга всех двигателей. Одинаковые полюса, наоборот, отталкивают: если магниты смотрят друг на друга лицом к лицу (красный к красному) или спиной к спине (синий к синему), магнит толкает свой летающий корабль прочь с той же силой. Магниты одного летающего корабля друг на друга не действуют. Когда энергия магнитов пропадает, летающие корабли отпускают друг друга; часть, у которой не осталось двигателей, падает с анимацией падения, сохраняя скорость, а её блоки остаются на земле обычными блоками. Ставится только в режиме конструктора летающего корабля. Рецепт зависит от планеты: на Serpulo классический, на любой другой планете он делается из первых 3 ресурсов планеты. Магниты на земле действуют и на летающие корабли (см. Супер магнит).
block.your-custom-battleship-super-magnet.name = Супер магнит
block.your-custom-battleship-super-magnet.description = Блок 2x2 с передом (красный) и задом (синий); вращается. Потребляет 500 единиц энергии в секунду. Работает как Магнит, но с радиусом 25 клеток и силой 100 ракетных ускорителей (притянутый корабль летит до 12 клеток в секунду) и взаимодействует и с обычными магнитами, и с супер магнитами (пара работает с более сильной тягой и большим радиусом из двух). Включённый магнит на ЗЕМЛЕ тоже не бездействует: он притягивает К СЕБЕ летающий корабль вашей команды с магнитами, повёрнутыми другой стороной (корабль летит к магниту, разворачивается, тень уменьшается, как при посадке, и корабль садится стык в стык с магнитом, как при соединении), если корабль парит и не двигается, а корабли, у которых магниты повёрнуты так же, отталкивает. Корабль в притяжении может вырваться, а севший корабль может взлететь, только если тяга его двигателей больше тяги магнитов. Рецепт зависит от планеты: на Serpulo 100 кинетического сплава (surge), 200 графита и 200 свинца, на любой другой планете он делается из первых 3 ресурсов планеты.
