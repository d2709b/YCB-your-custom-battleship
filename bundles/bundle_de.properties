ycb.guide.idea.title = Was ist ein Flugschiff
ycb.guide.idea.text = Ein Flugschiff ist eine aus Blöcken gebaute Einheit. Sein Rumpf ist ein [accent]Kern[] oder ein [accent]Lager / Behälter[]. Jeder Block, der am Rumpf hängt (Seite an Seite, auch über andere Blöcke), wird Teil des Schiffs.\n\nSolange es fliegt, liegt das Schiff nicht auf dem Feldraster: Förderbänder, Kabel und Türme der Welt sehen es nicht und berühren es nicht. Es wirkt nur mit anderen Schiffen, Gegnern und Geschossen zusammen. Es bewegt und dreht sich in [accent]jedem Winkel[], nicht Feld für Feld, und jeder seiner Blöcke arbeitet im Flug weiter: Förderbänder bewegen Gegenstände, Bohrer fördern, Fabriken produzieren, Generatoren liefern Energie, Türme schießen. Jeder Block wirft einen Schatten auf den Boden, wie eine fliegende Einheit.\n\nNur was du zum Schiff gemacht hast, ist ein Schiff. Ein gewöhnlicher Kern auf der Karte ist keines, bis du im Baumodus ([accent]G[]) [accent]Y[] darauf drückst oder dort einen Rumpf baust.\n\nEin Schiff braucht [accent]Booster[] (Triebwerke): Ohne sie fliegt es nicht. Geschwindigkeit = Gesamtschub der Booster x Kraft eines Raketen-Boosters / Anzahl der Blöcke des Schiffs; je schwerer das Schiff, desto langsamer ist es.
ycb.guide.first.title = Dein erstes Schiff, Schritt für Schritt
ycb.guide.first.text = [accent]1.[] Platziere einen Kern oder ein Lager / einen Behälter auf dem Boden (oder nutze einen, den du schon hast).\n[accent]2.[] Drücke [accent]G[] (auf dem Handy: die Bau-Schaltfläche). Der Baumodus ist an: Das Raster wird gezeigt, und alles, was nicht Teil eines Schiffs ist, wird blau gefärbt (die Weltebene).\n[accent]3.[] Zeige auf den Kern / das Lager und drücke [accent]Y[] (auf dem Handy: die Schaltfläche „Blöcke verschieben“, dann tippen). Er wird zum Schiff, und ein grüner Pfeil, seine Front, erscheint darauf.\n[accent]4.[] Baue Blöcke daneben: Jeder Block, den du platzierst und der das Schiff berührt, schließt sich sofort an. Blöcke, die schon auf dem Boden stehen, schließen sich mit [accent]Y[] an (halte Y und ziehe ein Quadrat, um viele auf einmal zu verschieben).\n[accent]5.[] Setze mindestens einen Booster darauf, ein Raketen-Booster reicht für den Anfang. Ohne Booster wird oben am Bildschirm ein blinkender Hinweis „Booster (Triebwerke) werden benötigt!“ angezeigt.\n[accent]6.[] Versorge, was versorgt werden muss: Energie für Energie-Booster, Kohle / Sporen-Pods / Pyratit für Treibstoff-Booster, Munition für Türme.\n[accent]7.[] Drücke erneut [accent]G[]: Das Schiff hebt ab. Drücke [accent]Y[] (mit dem Cursor abseits von Blöcken), um es zu betreten und mit [accent]WASD[] zu fliegen. [accent]Shift+Y[] landet es.\n\nBlöcke, die nicht am Rumpf hängen, werden rot markiert und beim Verlassen des Baumodus entfernt (ein Teil der Ressourcen kommt zurück).
ycb.guide.layers.title = Ebenen: Welt und Schiff
ycb.guide.layers.text = Jeder Block liegt auf einer von zwei Ebenen. Die [accent]Weltebene[] ist die gewöhnliche Karte: Ihre Blöcke werden im Baumodus blau gefärbt. Die [accent]Schiffsebene[] enthält die Blöcke von Schiffen (sie tragen im Baumodus eine violette Maske).\n\n[accent]Y[] verschiebt den Block unter dem Cursor in die andere Ebene; der Block muss das Schiff berühren. Halte [accent]Y[] und ziehe ein Quadrat auf (wie bei der Auswahl mit F / B): Alle Blöcke im Quadrat werden auf einmal verschoben. Der Block, auf dem du startest, legt die Richtung fest:\n- Start auf einem Weltblock: Die Weltblöcke im Quadrat schließen sich dem Schiff an (ein ganzes Gebäude schließt sich auf einmal an, Kette für Kette vom Schiff nach außen);\n- Start auf einem Schiffsblock: Die Schiffsblöcke im Quadrat verlassen das Schiff und werden zu gewöhnlichen Blöcken (Blöcke, die nur von ihnen gehalten wurden, werden rot);\n- Start auf einem leeren Feld: Weltblöcke schließen sich an; gibt es keine, verlassen Schiffsblöcke das Schiff.\nBlöcke anderer Teams und Blöcke im Bau werden nicht berührt. Der Rahmen zeigt, was sich ändert: Die Farbe der Schiffsebene schließt sich an, Hellblau verlässt.\n\nEin Kern oder Lager, das an nichts hängt, wird beim Anschließen zu einem neuen Schiff. Eine Gruppe von Blöcken mit einem eigenen Kern oder Lager ist ein eigenes Schiff: Sie wird nicht entfernt, sie hebt von selbst ab.\n\nAuf dem Handy ersetzt die Schaltfläche „Blöcke verschieben“ die Taste Y: Tippe auf einen Block oder ziehe ein Quadrat auf.
ycb.guide.pc.title = Tasten am PC
ycb.guide.pc.text = Am PC gibt es kein Schaltflächenpanel: Alles liegt auf den Tasten.\n\n[accent]G[] - Baumodus an / aus. Das Schiff, das du steuerst (sonst das dem Cursor nächste), landet auf dem Raster, zeigt nach oben und bewegt sich Feld für Feld. Drücke erneut: Es hebt ab.\n[accent]Y[] außerhalb des Baumodus - Ein Block deines Teams unter dem Cursor wechselt seine Ebene; überall sonst betrittst / verlässt du ein Schiff. [accent]V[] verlässt ebenfalls ein Schiff.\n[accent]Shift+Y[] außerhalb des Baumodus - Das Schiff landen, oder es wieder abheben, wenn es gelandet ist (dasselbe wie die Befehle Landen / Abheben).\n[accent]Y[] im Baumodus - Den Block unter dem Cursor zwischen den Ebenen verschieben; halte es gedrückt und ziehe ein Quadrat auf, um viele Blöcke zu verschieben.\n[accent]R[] im Baumodus - Den Frontpfeil des Schiffs um 90 Grad drehen ([accent]Shift+R[] in die andere Richtung). Bei einem Block, den das Spiel selbst drehen kann (ein Förderband), dreht R stattdessen den Block.\n[accent]WASD[] - fliegen. Standardmäßig dreht sich das Schiff in Flugrichtung (eine Einstellung).\n[accent]Q / E[] - das Schiff von Hand in jeden Winkel drehen.\n[accent]Linke Maustaste[] (halten) - Alle Türme drehen sich zum Cursor und feuern gemeinsam.\n[accent]Strg + linke Maustaste[] auf ein Schiff - Übernimm die Kontrolle darüber, wie bei jeder Einheit.
ycb.guide.phone.title = Handy-Steuerung
ycb.guide.phone.text = Auf dem Handy liegt das Panel mit den Schaltflächen links am Bildschirm. Der Pfeil darüber blendet die Schaltflächen aus und ein.\n\nDas Panel hat: den Baumodus (wie G), Schiff betreten / verlassen (wie Y), Schiff landen / abheben (wie Shift+Y). Im Baumodus kommen zwei weitere hinzu: [accent]Blöcke verschieben[] (wie Y) und [accent]Front drehen[] (wie R). Bei einem gelandeten Schiff bewegen die Pfeile unter den Schaltflächen es Feld für Feld.\n\nEin fliegendes Schiff folgt der [accent]Bildschirmmitte[]: Ziehe die Karte mit dem Finger, und das Schiff fliegt der Mitte nach, dreht seine Front dorthin, bremst sanft ab und hält dort an. Ein Antippen eines Schiffs betritt es nicht, nutze die Betreten-Schaltfläche.\n\n[accent]Blöcke verschieben[]: Drücke es einmal zum Einschalten (es leuchtet). Ein Tippen auf einen Block schickt ihn in die andere Ebene; ein aufgezogenes Quadrat verschiebt alle Blöcke darin (der Block, auf dem du startest, legt die Richtung fest, wie bei Y). Solange es an ist, scrollt die Karte nicht. Drücke die Schaltfläche erneut, um zu beenden.\n\n[accent]Front drehen[]: Dreht das Schiff in der Bildschirmmitte (sonst das, in dem du bist, sonst das nächste gelandete) um 90 Grad gegen den Uhrzeigersinn. Vier Tipper sind ein voller Kreis.
ycb.guide.build.title = Baumodus (G)
ycb.guide.build.text = Im Baumodus erstellst und änderst du Schiffe.\n\n- Das Schiff landet auf dem Raster, zeigt nach oben, und du bewegst es Feld für Feld (8 Felder pro Sekunde). Das Raster ist an, die Weltebene ist blau.\n- Blöcke, die du platzierst und die das Schiff berühren, schließen sich sofort an. Ein Block, der seinen Halt am Rumpf verloren hat, wird rot markiert und beim Verlassen des Modus entfernt (Ressourcen kommen teilweise zurück). Eine Gruppe von Blöcken mit einem eigenen Kern oder Lager wird nicht entfernt: Sie wird zu einem eigenen Schiff.\n- [accent]Front.[] Jeder Kern / jedes Lager eines Schiffs zeigt einen grünen Pfeil, die Front. [accent]R[] dreht ihn (alle Rümpfe des Schiffs auf einmal). Wenn du bei eingeschaltetem „in Fahrtrichtung drehen“ steuerst, dreht sich das Schiff so, dass die Pfeilseite nach vorn zeigt. Türme ohne Ziel schauen nach vorn. Nach dem Modus hebt das Schiff in derselben Lage ab; nur die Seite, die als Front gilt, ändert sich.\n- [accent]Freies Platzieren.[] Bohrer, Pumpen, Thermische Generatoren, Wasser-Extraktoren und andere an den Boden gebundene Blöcke können überall platziert werden: Es braucht kein Erz, kein Wasser und keine Hitze. Wähle den Block und klicke (auf dem Handy tippe) wie gewohnt; er kostet gleich viel und braucht gleich lange. Der Kern muss mindestens einen von jedem Gegenstand enthalten, den der Block braucht. Funktioniert auch bei eingefügten Entwürfen (ihre Geister sind weiß).\n- [accent]Einen Entwurf einfügen.[] Die Blöcke werden in beliebiger Reihenfolge fertiggestellt. Fertige Blöcke, die noch nichts berühren, warten in Rot; sobald eine Kette einen Kern / ein Lager erreicht, wird der ganze Entwurf zu einem Schiff.\n- Blöcke im Bau bewegen sich nicht: Stelle sie vor dem Abheben fertig.\n- Booster und Magnete können auch außerhalb des Baumodus platziert werden: Sie sind Bodenblöcke, bis Y oder der Baumodus sie zu einem Teil des Schiffs macht.\n- Hat ein Schiff keine Booster, wird oben ein blinkender Hinweis angezeigt.
ycb.guide.landing.title = Landen und Abheben
ycb.guide.landing.text = [accent]Shift+Y[] (PC) oder die Schaltfläche „Schiff landen“ (Handy) landet das Schiff, das du steuerst, oder das nächste, ohne den Baumodus. Drücke es erneut, um das Schiff abzuheben. Ein Schiff, das im Baumodus bearbeitet wird, überlässt man G.\n\n[accent]Die Animation.[] Das Schiff senkt sich langsam: Sein Schatten gleitet darunter, es dreht sich mit der Front nach oben und gleitet auf die genauen Felder; beim Aufsetzen steigen Staubwolken auf, wie bei einem Kern, der auf einem Planeten landet (ihre Zahl und Größe hängen von Gewicht und Breite des Schiffs ab). Das Abheben läuft umgekehrt ab, der Staub kommt nach und nach. Das Schiff lässt sich währenddessen nicht steuern, und es kollidiert nicht mit anderen Schiffen. Es dauert etwa 1,3 bis 8 Sekunden, ein schweres und langsames Schiff am längsten. Der Baumodus (G) landet und hebt sofort ab, ohne Animation.\n\nGibt es unter dem ganzen Schiff keinen freien Platz, landet es nicht und fliegt weiter. Ein Schiff, das landet, dreht sich als Ganzes zur nächsten Seite (oben, rechts, unten, links): Seine Blöcke, Türme und der Frontpfeil drehen sich mit.\n\n[accent]Befehle.[] Im Befehlsmodus (RTS) hat das Befehlspanel [accent]Landen[] und [accent]Abheben[]. Ein gelandetes Schiff, das einen Bewegungs- oder Angriffsbefehl bekommt, steigt zuerst auf und fliegt dann los. Die Befehle des Spielers haben Vorrang vor dem Autopiloten.\n\n[accent]Die Haltungsleiste[] unter den Befehlen hat [accent]Schiffssteuerungsblock deaktivieren[] (das durchgestrichene Raster). Solange sie an ist, senden die Schiffssteuerungsblöcke aller gewählten Schiffe keine Signale: Es laufen keine Module, keine Prozessoren werden geschaltet, nichts wird durch Magnete verbunden. Das Schiff bleibt, wo es ist, bis du es irgendwohin befiehlst; die Regeln für Bohrer und Pumpen bleiben. [accent]Abbauen[] (für Schiffe mit einem Bohrer) funktioniert wie bei Mono und Poly: Hake die Erze unter dem Befehl an (oder Auto). Das Schiff fliegt zur nächsten freien Ader des Erzes, von dem es am wenigsten hat, setzt seinen Bohrer darauf und bleibt, bis seine Lager voll sind; dann hängt es dort, wo es ist. Auto lässt Sand aus. Es hängt nicht von den Steuerblöcken ab.\n\n[accent]Landeplatz[]-Block: Ein Schiff mit einem Landemodul landet von selbst darauf (siehe die Themen Blöcke und Autopilot).\n\n[accent]Notlandung.[] Arbeitet länger als eine halbe Sekunde kein Triebwerk (gar keines, kein Treibstoff, keine Energie, ausgeschaltet), stürzt das Schiff: Es behält seine Geschwindigkeit, lässt sich nirgendwohin lenken und landet dort, wohin die Geschwindigkeit es trägt. Worauf es landet, kämpft gegen seine Blöcke (siehe Schaden, fallende Blöcke und Abstürze).
ycb.guide.thrust.title = Schub, Geschwindigkeit und Gewicht
ycb.guide.thrust.text = Schub wird in [accent]Raketen-Boostern[] gezählt: ein Raketen-Booster = 1.\n\n[accent]Geschwindigkeit[] eines Schiffs = Gesamtschub seiner Booster x Schub eines Raketen-Boosters (standardmäßig 45 Felder pro Sekunde pro Feld des Schiffs, siehe Einstellungen) / Anzahl der Felder, die das Schiff belegt. Doppelt so schwer = halb so schnell.\n\n[accent]Drehen.[] Ein schwereres Schiff dreht auch langsamer: Die Drehrate wird durch (1 + Gewicht / 60) geteilt. Ein Schiff aus 60 Blöcken dreht halb so schnell wie ein winziges, eines aus 180 Blöcken viermal so langsam; kein Schiff dreht langsamer als 6 Grad pro Sekunde.\n\nDie Triebwerke arbeiten die ganze Zeit, in der das Schiff in der Luft ist. Solange es sich [accent]bewegt[], verbrauchen sie ihre volle Energie, ihren vollen Treibstoff und ihre volle Flüssigkeit; solange es nur [accent]schwebt[] (steht oder herunterkommt), verbrauchen sie [accent]die Hälfte[], der gelbe Kreis blinkt halb so schnell und sie stoßen halb so viel Rauch aus; beim [accent]Abheben[] stoßen sie doppelt so viel aus. Die Triebwerke eines gelandeten Schiffs sind aus. Ein Booster, den du mit einem Prozessor ausgeschaltet hast, liefert keinen Schub. Arbeitet keines der Triebwerke, geht das Schiff in eine Notlandung.\n\nEin arbeitender Booster zeigt in der Mitte einen blinkenden gelben Kreis und stößt Rauch aus wie ein Bohrer: der Raketen-Booster einmal pro Sekunde, der Energie-Booster zweimal, der Treibstoff-Booster dreimal (bei einem Schiff in Bewegung; zu Schweben und Abheben siehe oben).\n\nDas größte Schiff ist etwa 110 Blöcke breit.
ycb.guide.rocket.title = Raketen-Booster
ycb.guide.rocket.text = Das Basistriebwerk. 1x1, Schub 1. Es braucht nichts zum Arbeiten.\n\nRezept auf Serpulo: 20 Kupfer, 10 Blei, 5 Graphit. Auf anderen Planeten wird er aus den ersten 2 Ressourcen des Planeten gemacht (siehe Andere Planeten und Mods).\n\nDa er weder Treibstoff noch Energie braucht, sind ein paar Raketen-Booster der einfachste Weg, ein kleines Schiff zum Fliegen zu bringen. Für ein großes Schiff braucht man viele davon oder die stärkeren Triebwerke: den Energie-Booster (6 Raketen-Booster) und den Treibstoff-Booster (14 bis 17 Raketen-Booster allein mit Treibstoff).\n\nEr kann in jedem Modus platziert werden. Außerhalb des Baumodus ist er ein gewöhnlicher Bodenblock; Y oder der Baumodus (G) macht ihn zu einem Teil des Schiffs. Er lässt sich mit einem Prozessor ausschalten (control enabled).
ycb.guide.energy.title = Energie-Booster
ycb.guide.energy.text = Ein 2x2-Triebwerk mit dem Schub von [accent]6 Raketen-Boostern[].\n\n[accent]Energie:[] 90 Energieeinheiten pro Sekunde, solange das Schiff sich bewegt oder abhebt, 45, solange es nur schwebt. Bei Energiemangel sinkt der Schub im gleichen Verhältnis; ohne Energie arbeitet er nicht. Versorge ihn mit Energie aus Batterien oder Generatoren des Schiffs.\n\n[accent]Flüssigkeits-Boost (optional).[] Versorge ihn über Leitungen mit Wasser oder Kryoflüssigkeit: Wasser verdoppelt den Schub (x2 = 12 Raketen-Booster), Kryoflüssigkeit ergibt x2,5 (15). Er verbraucht 10 Flüssigkeitseinheiten pro 10 Sekunden Betrieb (die Hälfte, solange das Schiff nur schwebt), und der Tank fasst 20, jeweils nur eine Flüssigkeit. Ohne die Flüssigkeit arbeitet er trotzdem, nur schwächer.\n\nZeige darauf (PC), und das Panel zeigt, was dem Triebwerk fehlt: Die fehlende Energie oder Flüssigkeit ist rot durchgestrichen, und darunter steht der aktuelle Schub. Ein fliegendes Schiff zeigt dieses Panel neben dem Cursor.\n\nEr leuchtet mit seiner Energie. Rezept auf Serpulo: 100 Kupfer, 50 Blei, 30 Silizium, 20 Plastanium. Auf anderen Planeten: die ersten 3 Ressourcen des Planeten.
ycb.guide.fuel.title = Treibstoff-Booster
ycb.guide.fuel.text = Ein 3x3-Triebwerk, das Treibstoff verbrennt: ein Gegenstand pro 8 Sekunden Betrieb (einer pro 16 Sekunden, solange das Schiff nur schwebt).\n\n[accent]Treibstoff und Schub:[] Kohle 14 Raketen-Booster, Sporen-Pods 15, Pyratit 17,3. Er fasst bis zu 20 Gegenstände jeder Art; hat er mehrere Arten, brennt die schwächste zuerst. Versorge ihn mit Förderbändern oder Entladern; ein Entlader kann auch Treibstoff aus ihm herausnehmen. Ohne Treibstoff arbeitet er nicht.\n\n[accent]Flüssigkeits-Boost (optional):[] Wasser x1,25, Kryoflüssigkeit x3 (Kohle 42, Sporen-Pods 45, Pyratit 52). Pro verbranntem Gegenstand werden 20 Flüssigkeitseinheiten verbraucht; der Tank fasst 120.\n\n[accent]Auf anderen Planeten und mit anderen Mods[] ist jeder brennbare Gegenstand ein Treibstoff, mit dem Schub 4 + 10 x seine Entflammbarkeit (höchstens 20). Wo nichts brennt, werden die flüchtigsten Ressourcen des Planeten genutzt.\n\nRezept auf Serpulo: 300 Kupfer, 400 Blei, 100 Graphit, 100 Plastanium, 200 Titan. Auf anderen Planeten: die ersten 4 Ressourcen des Planeten.
ycb.guide.control.title = Schiffssteuerung
ycb.guide.control.text = Der Autopilot eines Schiffs. Ein 2x2-Block im Reiter [accent]Logik[]. Rezept auf Serpulo: 50 Kupfer, 300 Blei, 120 Silizium.\n\nPlatziere ihn im Baumodus (wie die Booster); mehrere können auf einem Schiff sitzen. Drücke den [accent]Stift[] am Block: Ein Vollbild-Panel öffnet sich, in dem du [accent]Module[] hinzufügst. Die Module sind im Thema „Autopilot-Module“ beschrieben.\n\nDer Autopilot steuert nur ein fliegendes Schiff und ein Schiff, das durch eines seiner Module gelandet ist. Ein Schiff, das du selbst gelandet hast (G, Shift+Y, die Schaltfläche „Schiff landen“), bleibt unberührt. Die Befehle des Befehlsmodus (bewegen, angreifen, landen, abheben) haben Vorrang vor allen Modulen, und das Steuern von Hand stoppt den Autopiloten, solange du steuerst.\n\nDie Einstellungen des Blocks (Module, Prozente, Punkte, Listen von Plätzen, Timer) werden mit dem Schiff, mit dem Spielstand und mit Entwürfen gespeichert: Kopieren und Einfügen behält sie.\n\nEin Prozessor kann den Block ausschalten (control enabled): Seine Module und Regeln arbeiten dann nicht.\n\nAuf dem Server eines anderen kann nur der Host (der Server selbst) den Block einrichten.
ycb.guide.spot.title = Landeplatz
ycb.guide.spot.text = Ein schlichter 1x1-Block am Boden. Rezept auf Serpulo: 20 Kupfer, 20 Blei. Platziere ihn [accent]außerhalb[] des Baumodus.\n\nAllein tut er nichts. Ein Schiff mit einem Landemodul (Landung für Ressourcen oder Ruhepunkt im Modus „landet“) fliegt darauf zu und landet: Eines der Lager des Schiffs (der Kern oder ein Behälter) muss den Platz abdecken. Der Platz wird nicht zerstört: Er ist nur bedeckt, solange das Schiff dort steht, und kommt zurück, wenn das Schiff abhebt. Der Rest des Schiffs braucht freien Boden ringsum; ist etwas im Weg, landet das Schiff nicht und fliegt weiter.\n\nEin Platz mit einem Schiff darauf oder mit einem Schiff im Anflug ist belegt: Andere Schiffe deines Teams nutzen den nächsten freien Platz ihrer Liste.\n\nHebst du ein Schiff von Hand von seinem Platz ab (der Befehl Abheben oder Steuern), pausiert sein Landemodul und setzt das Schiff nicht wieder ab, bis du das Modul änderst.
ycb.guide.magnet.title = Magnet
ycb.guide.magnet.text = Ein drehbarer 1x1-Block mit einer Vorderseite (rot) und einer Rückseite (blau). Er verbraucht 10 Energieeinheiten pro Sekunde. Rezept auf Serpulo: 40 Kupfer, 30 Silizium, 20 Titan. Kann in beiden Modi platziert werden (außerhalb des Baumodus ist er ein Bodenblock, bis Y oder G ihn zu einem Teil eines Schiffs macht).\n\n[accent]Anziehung.[] Ein Magnet eines Schiffs zieht die Magnete eines [accent]anderen[] Schiffs deines Teams im Umkreis von 5 Feldern, die andersherum gedreht sind (die Vorderseite des einen schaut zum anderen Magneten, und die Vorderseite des anderen schaut in dieselbe Richtung: Front zu Rückseite). Die Anziehung ist so stark wie 3 Raketen-Booster und wird mit der Entfernung schwächer, bis auf null bei 5 Feldern. Sie gibt Geschwindigkeit so wie Triebwerke (Anziehung x Boosterkraft / Felder des Schiffs), also bewegt sich ein großes Schiff kaum, ein kleines kommt schnell (nicht schneller als 6 Felder pro Sekunde). Jeder Magnet zieht einmal: Ein Schiff mit zehn Magneten wird zehnmal so stark gezogen. Die Schiffe drehen sich auch, jedes so weit, wie sein Gewicht es erlaubt, bis die Magnete in dieselbe Richtung schauen, und kommen Seite an Seite.\n\n[accent]Verbinden.[] Sind zwei Partnermagnete etwa 1,5 Felder voneinander entfernt, schauen sie innerhalb von 10 Grad in dieselbe Richtung und lassen sich die Blöcke ohne Überlappung zusammensetzen, tritt das leichtere Schiff in das schwerere ein: Sie werden zu [accent]EINEM Schiff[], mit einem Gewicht und dem Schub aller Triebwerke. Wer das eingetretene Schiff steuerte, steuert das ganze. Würden Blöcke überlappen, stehen die Schiffe nur aneinander.\n\n[accent]Loslassen.[] Verlieren die Magnete für 1/3 Sekunde die Energie oder wird einer zerstört, reißt die Verbindung. Die Gruppen von Blöcken, die nicht am Hauptteil hängen, trennen sich als eigene Schiffe mit derselben Geschwindigkeit. Ein Teil ohne Triebwerk fällt (er behält seine Geschwindigkeit), und seine Blöcke bleiben als gewöhnliche Blöcke am Boden.\n\n[accent]Gleiche Pole stoßen ab.[] Zwei Magnete, die einander anschauen (rot zu rot) oder die Rücken zukehren (blau zu blau), stoßen ihre Schiffe mit gleicher Kraft auseinander. Sie stoßen nur ab: kein Drehen und kein Verbinden. Magnete desselben Schiffs tun einander nichts.\n\n[accent]Am Boden.[] Ein mit Energie versorgter Magnet am Boden wirkt auch auf fliegende Schiffe deines Teams, die Magnete haben: Ungleiche Pole ziehen das Schiff zum Magneten und setzen es Seite an Seite mit ihm ab, gleiche Pole stoßen es weg. Lies dazu das Thema Supermagnet.
ycb.guide.supermagnet.title = Supermagnet
ycb.guide.supermagnet.text = Ein drehbarer 2x2-Block mit einer Vorderseite (rot) und einer Rückseite (blau): der starke Bruder des Magneten. Rezept auf Serpulo: 100 Spannungslegierung, 200 Graphit, 200 Blei (auf einem anderen Planeten die ersten 3 Ressourcen des Planeten). Er verbraucht 500 Energieeinheiten pro Sekunde. Reichweite 25 Felder, Anziehung so stark wie 100 Raketen-Booster (der Magnet: 5 Felder und 3 Raketen-Booster), also das Fünffache der Reichweite und das 33-Fache der Anziehung. Ein von ihm gezogenes Schiff erreicht bis zu 12 Felder pro Sekunde (der Magnet: 6).\n\n[accent]Mit anderen Magneten.[] Er arbeitet mit Supermagneten und mit einfachen Magneten gleichermaßen, nach denselben Regeln (ungleiche Pole ziehen an, gleiche stoßen ab, Verbinden der Schiffe, Loslassen: siehe Magnet). Ein Paar verschiedener Magnete arbeitet mit der stärkeren Anziehung und der größeren Reichweite von beiden und mit der Energie desjenigen, der weniger bekommt.\n\n[accent]Am Boden.[] Ein Magnet am Boden (auch ein einfacher, auch einer eines gelandeten Schiffs) ist nicht untätig. Er wirkt auf die Magnete der [accent]fliegenden[] Schiffe deines Teams in seiner Reichweite, nach denselben Regeln der Pole. [accent]Gleiche Pole stoßen[] das Schiff weg. [accent]Ungleiche Pole ziehen es zum Magneten[]: Das Schiff fliegt zum Magneten, dreht sich, bis sein Magnet in dieselbe Richtung schaut, sein Schatten schrumpft sanft wie bei einer Landung, und wenn es ganz herangezogen wurde, landet es mit seinem Magneten [accent]Seite an Seite[] mit dem Magneten am Boden (ein 1x1 gegen ein 2x2 sitzt an einem seiner zwei Felder; ist dieser Platz belegt, gleitet es an der Seite entlang oder nimmt das andere Feld; ist gar kein Platz, bleibt das Schiff oben). Die Anziehung aller Magnete, die auf das Schiff wirken, addiert sich, und das stärkste Paar mit Platz ist das, an dem es andockt; je stärker die Anziehung, desto schneller kommt das Schiff.\n\n[accent]Wann er zieht.[] Nur ein Schiff, das schwebt und stillsteht: Niemand steuert es, kein Befehl und kein Autopilot schickt es irgendwohin. Hat die Anziehung einmal begonnen, lässt sich das Schiff nicht mehr steuern. Es kann die Anziehung nur verlassen (es steigt auf und fliegt weiter), und ein von ihm gelandetes Schiff kann nur abheben, wenn der Schub seiner Triebwerke [accent]größer[] ist als die Anziehung der Magnete, die auf es wirken. Verlieren die Magnete Energie oder werden zerstört, steigt das Schiff von selbst auf.
ycb.guide.builder.title = Entwurfsdrucker
ycb.guide.builder.text = Ein [accent]16x16[]-Drucker für Schiffe, außerhalb des Baumodus gebaut. Er wird nie Teil eines Schiffs. Bauzeit des Blocks selbst: 6 Minuten. Rezept auf Serpulo: 1000 Spannungslegierung, 2000 Graphit, 1500 Plastanium.\n\n[accent]Ein Schiff wählen.[] Drücke den Stift unter dem Block: Die Liste zeigt die Schiffsentwürfe. Ein Entwurf ist ein Schiff, wenn er bis zu 16x16 Felder groß ist, einen Kern oder ein Lager hat, alle seine Blöcke sich berühren und er keinen Drucker enthält. Um einen zu erstellen: Kopiere ein Schiff im Baumodus (G) als Entwurf. Entwürfe, die keine Schiffe sind, stehen unten in der Liste mit dem Grund.\n\n[accent]Richtung.[] Die zweite Schaltfläche (nach dem Stift) legt fest, wohin das gedruckte Schiff [accent]zeigt[]: rechts, oben (wie im Entwurf), links oder unten. Jeder neue Drucker beginnt mit der Seite, zu der er selbst zeigt (er kopiert nicht die Einstellung eines anderen Druckers). Das Schiff [accent]verlässt[] den Drucker immer zu der Seite, zu der er zeigt (drehe den Drucker vor dem Platzieren mit R, die Pfeile am Boden zeigen den Ausgang), egal welche Ausrichtung du wählst, und behält die gewählte Ausrichtung.\n\n[accent]Das Drucken[] ist wie bei einer Einheitenfabrik. Es braucht die Gegenstände des Entwurfs (den Preis jedes Blocks) + 100 Phasengewebe, 3000 Energieeinheiten und 240 Kryoflüssigkeit pro Sekunde und dauert 1,5-mal so lange, wie ein Spieler zum Bauen aller Blöcke braucht. Er fasst jede Art von Flüssigkeit und nimmt bis zum Doppelten dessen auf, was ein Schiff braucht. Eine orangefarbene Silhouette zeigt den Fortschritt, und die drei Schornsteine brennen während des Druckens.\n\n[accent]Das neue Schiff[] erscheint in der Luft über dem Block mit der gewählten Ausrichtung, wird vom Drucker zu der Seite getragen, zu der er zeigt, und folgt dann den Modulen seines Schiffssteuerungsblocks. [accent]Erster Flug.[] Die dritte Schaltfläche (zwei Pfeile nach oben) öffnet zwei Schieberegler: die Zahl der Blöcke, die das Schiff getragen wird (0 bis 50, standardmäßig 10), und die Geschwindigkeit (1 bis 10 Blöcke pro Sekunde, standardmäßig 2). Das Schiff wird mit genau dieser Geschwindigkeit getragen, egal wie schwer es ist oder welche Triebwerke es hat. Bei 0 Blöcken hängt es nur über dem Drucker (die Geschwindigkeit ist dann 0 und lässt sich nicht ändern). Unter jedem Regler steht sein Preis in Pyratit, mit einem x dazwischen: Das Schiff kostet [accent]Blöcke x Geschwindigkeit[] Pyratit mehr (standardmäßig 20). Ein Schiff ohne arbeitendes Triebwerk fällt, wenn das Tragen vorbei ist. Die Module Vorladung von Gegenständen, Flüssigkeitsladung und Verbinden beim Drucken werden vom Drucker gelesen.
ycb.guide.mods.title = Wie Module funktionieren
ycb.guide.mods.text = Der Schiffssteuerungsblock führt seine Module [accent]nacheinander von oben nach unten aus, dann wieder vom ersten an[] (im Kreis).\n\nEin Modul behält das Schiff, bis es fertig ist oder nicht arbeiten kann; dann bekommt das nächste das Schiff. Ein Modul, das jetzt nichts tun kann (kein Bohrer, alles belegt, die Ressource ist schon voll), wird übersprungen. Bei mehreren Steuerblöcken auf einem Schiff kommt der zuerst gebaute zuerst. Die Befehle des Befehlsmodus haben Vorrang vor allen Modulen.\n\n[accent]Farben[] sind die der Anweisungen eines Prozessors: [#ff6060]Rot[] - Ressourcen holen und Verbinden; [#5aa0ff]Blau[] - Ruhe; [#ffa040]Orange[] - was ein gedrucktes Schiff bekommt; [#b280ff]Violett[] - Regeln; [#5fe070]Grün[] - Prozessoren; [#40d8d0]Türkis[] - das Drehzentrum. Jede Karte zeigt ihren Status in Worten (wartet, holt, fliegt zum Punkt, fertig, pausiert ...).\n\nModule werden mit den Schaltflächen unter der Liste hinzugefügt und lassen sich verschieben oder entfernen. Hebst du das Schiff von Hand von einem Landeplatz ab, pausiert dieses Landemodul, bis du es änderst. Ein Erz, ein Punkt oder ein Landeplatz, den ein Schiff belegt hat, ist für die anderen Schiffe gesperrt, solange er sein Ziel ist.
ycb.guide.modres.title = Ressource und Landung für Ressourcen
ycb.guide.modres.text = [accent]Ressource[] (rot). Wähle ein Erz, Sand oder eine Flüssigkeit, die es auf der Karte gibt, und einen Füllprozentsatz (standardmäßig 50 %, 0 bis 100). Gegenstände werden gegen den Platz der Lager des Schiffs (Kern, Behälter) gezählt, Flüssigkeiten gegen seine Tanks und Flüssigkeitsbehälter (ohne Tank ist die Flüssigkeit nicht verfügbar). Das Schiff braucht einen Bohrer, der dieses Erz abbauen kann, oder eine Pumpe.\n\n[accent]Eine Spitze reicht nicht.[] Nachdem das Schiff 2 Sekunden an seiner Ader gestanden hat, zählt es die Felder, aus denen seine Bohrer (Pumpen) das Erz wirklich nehmen, und vergleicht sie mit dem Meisten, was eine Ader erlaubt: die Felder aller seiner Bohrer und Pumpen für diese Ressource, aber nicht mehr, als die Ader hat (eine kleine Ader wird so gezählt, wie sie ist). Ist es weniger als die Hälfte, wechselt das Schiff an einen anderen Ort, steht dort 2 Sekunden und zählt erneut, insgesamt höchstens an 5 Orten (den ersten eingerechnet). Es versucht nur Orte, an denen seine Bohrer mehr abdecken würden als am bisher besten, also kann es nach weniger Versuchen anhalten. Das gilt für das Modul Ressource und für den Befehl Abbauen.\n\nDas Schiff fliegt zur Ader, die seinem Bohrer oder seiner Pumpe am nächsten ist (nicht zu seiner Mitte), bremst sanft ab und hält dort an: kein Schub, kein Drehen, kein Treibstoff- oder Energieverbrauch. Wird es mehr als ein Feld weggeschoben, kommt es zurück. Ist der Prozentsatz erreicht, gibt das Modul das Schiff an das nächste weiter. Nach jedem Befehl wird die nächste Ader neu gewählt, von dort, wo das Schiff jetzt ist.\n\n[accent]Jedes Schiff hat sein eigenes Erz.[] Eine Ader, die ein Schiff gewählt hat, ist für die anderen Schiffe deines Teams gesperrt (ein Kreis darum, damit nicht zwei Schiffe aufeinander landen), solange sie sein Ziel ist. Ist die nächste belegt, wird die nächste freie genutzt; sind alle belegt, sagt die Karte „Alle Erze / Orte sind von anderen Schiffen belegt“, und das Schiff läuft im Kreis weiter.\n\n[accent]Landung für Ressourcen[] (rot). Eine Liste von Landeplätzen (der erste freie wird genutzt) und die Ressourcen, Gegenstände und Flüssigkeiten, jeweils mit einem Prozentsatz. Das Schiff fliegt zum ersten freien Platz, landet und bleibt, bis jede aufgelistete Ressource ihren Prozentsatz erreicht (fülle per Förderband, Entlader oder von Hand). Dann hebt es ab und gibt das Schiff an das nächste Modul weiter. Es wählt auch die Seite zum Landen: wie es ist, Front oben / unten / links / rechts oder jede, die passt.
ycb.guide.modrest.title = Ruhepunkt
ycb.guide.modrest.text = [accent]Ruhepunkt[] (blau) legt fest, wie und wo das Schiff ruht.\n\n[accent]Das Schiff[] schwebt über einem Punkt oder landet auf einem Landeplatz. Wähle mit der Schaltfläche. Die Liste enthält Punkte auf der Karte (Schweben) oder Landeplätze (Landen); sie werden der Reihe nach probiert, der erste freie wird genutzt, die Pfeile ändern die Reihenfolge. Ein Punkt ist belegt, wenn ein anderes Schiff dort hängt oder so nah heranfliegt, dass sich die Schiffe berühren würden. Ist keiner frei, sagt die Karte das, und das Schiff fliegt weiter.\n\n[accent]Ruhen, solange jede aufgelistete Ressource mindestens ... hält[] Eine Liste von Ressourcen mit je einem Prozentsatz. Fällt eine davon unter ihren Prozentsatz, endet die Ruhe, und das Schiff geht zum nächsten Modul. Die Ruhe beginnt nicht, solange eine aufgelistete Ressource schon knapp ist (das Schiff würde sofort wieder gehen).\n\n[accent]Ruhe-Timer (optional).[] Eine Schaltfläche schaltet ihn ein, und ein Feld legt die Sekunden fest (standardmäßig 30, bis zu 3600). Die Ruhe endet mit dem, was zuerst eintritt, Ressource oder Timer. Ohne Liste und ohne Timer endet die Ruhe nie.\n\nWill kein anderes Modul das Schiff, bleibt es am Ruhepunkt.
ycb.guide.modrule.title = Regeln für Bohrer und Pumpen
ycb.guide.modrule.text = [accent]Regel[] (violett) legt fest, welche Ressourcen die Bohrer und Pumpen des Schiffs nehmen dürfen. Sie ist keine Aufgabe des Autopiloten: Setze sie irgendwohin in die Liste, die Reihenfolge spielt keine Rolle.\n\n[accent]Ziel.[] „Alle Bohrer und Pumpen“ (Standard) oder ein einzelner Block. Wähle ihn aus der Liste (sein Name und der Versatz vom Steuerblock) oder tippe ihn auf der Karte an. Der Versatz ist im Flug und am Boden derselbe, daher bricht die Regel nicht, wenn das Schiff landet oder abhebt. Ist der Block weg, sagt die Karte „Block nicht gefunden“.\n\n[accent]Modus.[] Whitelist: Der Block nimmt nur die aufgelisteten Ressourcen. Blacklist: Er nimmt alles außer den aufgelisteten. Ressourcen einer Regel: bei einem Bohrer die Erze und der Sand, die er überhaupt abbauen kann, bei einer Pumpe die Flüssigkeiten; bei „alle“ alles, was irgendein Bohrer oder eine Pumpe des Schiffs nehmen kann.\n\n[accent]Wie es funktioniert.[] Der Bohrer „sieht“ ein verbotenes Erz nicht: Liegen zwei Erze unter ihm und eines ist erlaubt, nimmt er das erlaubte, auch wenn vom verbotenen mehr da ist. Eine Pumpe wählt ihre Flüssigkeit auf dieselbe Weise. Der Autopilot beachtet die Regeln: Er holt eine Ressource nur mit einem Bohrer oder einer Pumpe, die sie nehmen darf; sind alle verboten, sagt das Modul „Durch eine Regel verboten“.\n\n[accent]Einzelheiten.[] Eine leere Liste ändert nichts. Mehrere Regeln für einen Block gelten alle: Eine Ressource muss jede davon bestehen. Eine Whitelist beschränkt nur die Art, die sie nennt: Eine Liste von Erzen behindert Pumpen nicht, eine Liste mit Wasser und Kupfer beschränkt beide. Die Regeln wirken, solange das Schiff fliegt; am Boden sind die Bohrer gewöhnliche Blöcke.
ycb.guide.modcenter.title = Drehzentrum
ycb.guide.modcenter.text = [accent]Zentrum[] (türkis, eine Einstellung, keine Aufgabe) legt den Punkt des Schiffs fest, von dem aus alles gemessen wird: Das Schiff dreht sich um ihn (Tasten Q und E, Drehen in Fahrtrichtung, der Autopilot, Kollisionen, Magnete), und er ist der Punkt, der zu einem Ziel fliegt. Setze das Modul irgendwohin in die Liste; gibt es mehrere, zählt das erste des zuerst gebauten Steuerblocks.\n\n[accent]Kern oder Lager.[] Wähle in der Liste oder per Tippen auf der Karte, welches. Es funktioniert nur, wenn das Schiff zwei oder mehr Kerne und Lager hat; bei einem ist die Schaltfläche aus, und die Karte sagt, dass zwei nötig sind.\n\n[accent]Mittelpunkt der Felder[] (Standard). Die mittlere Position aller Felder, die die Blöcke belegen; ein großer Block zählt mit jedem seiner Felder. Er wandert, wenn Blöcke hinzukommen oder verloren gehen.\n\n[accent]Gewählter Block.[] Ein beliebiger Block des Schiffs; tippe ihn auf der Karte an (standardmäßig der Steuerblock selbst).\n\n[accent]Wie es funktioniert.[] Der Punkt wird beim Abheben festgelegt. Ändert er sich später (ein Block kommt hinzu oder geht verloren, das Modul wird geändert oder entfernt), bleiben die Blöcke, wo sie in der Welt sind, und nur der Punkt wandert, sodass das Schiff nicht springt. Bei Lande- und Abhebe-Animationen ändert sich der Punkt nicht. Ohne Zentrum-Modul oder wenn das Modul nicht arbeiten kann (kein solcher Block, nur ein Kern), dreht sich das Schiff um seinen Hauptkern oder sein Hauptlager. Der Versatz des gewählten Blocks bleibt erhalten, wenn das Schiff gedreht landet. Wird nicht genutzt, solange das Schiff am Boden steht.
ycb.guide.modjoin.title = Schiffe durch Magnete verbinden
ycb.guide.modjoin.text = Zwei Module helfen Schiffen, sich zu treffen und mit Magneten zu verbinden (siehe den Block Magnet).\n\n[accent]Verbindungspunkt[] (rot, eine Aufgabe des Autopiloten). Wähle einen Punkt auf der Karte und eine [accent]Ausrichtung[] in Grad (0 = so, wie das Schiff gebaut wurde, gegen den Uhrzeigersinn). Das Schiff fliegt zum Punkt, dreht sich in die Ausrichtung und bleibt dort, bis Magnete es mit einem anderen Schiff verbinden. Nach der Verbindung ist das Modul fertig, und das Schiff nimmt das nächste; trennen sich die Schiffe, fliegt es zum Punkt zurück. Solange Magnete es ziehen, hält es nicht dagegen, sonst könnten sich die Schiffe nie treffen.\n\n[accent]Verbinden beim Drucken[] (orange, ohne Einstellungen, vom Entwurfsdrucker gelesen). Ein vom Drucker gedrucktes Schiff fliegt zu dem Punkt, an den der Drucker es geschickt hat, steht dort mit genau der Ausrichtung, mit der es gedruckt wurde, und bewegt sich nicht. Verschiebt es etwas, kehrt es mit genau dieser Ausrichtung zum Punkt zurück, bis Magnete es mit einem anderen Schiff verbinden. Die Module des Autopiloten laufen währenddessen nicht. Ein Befehl des Spielers oder das Steuern von Hand beendet das Warten. Das Warten wird mit dem Spiel gespeichert.\n\nZusammen mit Magneten lässt der Drucker so die Teile eines großen Schiffs drucken, die sich in der Luft selbst zusammensetzen.
ycb.guide.modmisc.title = Prozessoren, Vorladung, Flüssigkeitsladung
ycb.guide.modmisc.text = [accent]Prozessoren[] (grün, eine Einstellung, keine Aufgabe). Wähle ein Ereignis: Das Schiff [accent]landet[], [accent]hebt ab[] oder [accent]wird beschädigt[]; wähle eine Aktion: einschalten, ausschalten oder umschalten; und füge Prozessoren des Schiffs mit der Schaltfläche „+ Prozessor“ zur Liste hinzu. Die Aktion ist dieselbe wie der eigene Befehl „control enabled“ des Prozessors. Landen und Abheben zählen jedes Mal, auch beim Betreten oder Verlassen des Baumodus. Schaden wird einige Male pro Sekunde geprüft und wirkt höchstens zweimal pro Sekunde. Im Baumodus wird Schaden nicht beobachtet. Mehrere Module sind mehrere Aktionen.\n\nProzessoren können noch mehr ausschalten: den Magneten (keine Anziehung, kein Energieverbrauch), den Entwurfsdrucker (das Drucken stoppt), den Schiffssteuerungsblock (seine Module und Regeln arbeiten nicht) und jeden Booster (kein Schub, kein Treibstoff- oder Energieverbrauch; sind alle aus, geht das Schiff in eine Notlandung).\n\n[accent]Vorladung von Gegenständen[] (orange, vom Drucker gelesen). Die aufgelisteten Gegenstände erscheinen im Lager eines vom Entwurfsdrucker gedruckten Schiffs (zuerst im Kern). Sie werden zum Preis addiert: Der Drucker nimmt sie ebenfalls. Was nicht hineinpasst, bleibt im Drucker. Bewirkt nichts bei einem von Hand gebauten Schiff.\n\n[accent]Flüssigkeitsladung[] (orange, vom Drucker gelesen). Die Tanks eines gedruckten Schiffs werden mit der gewählten Flüssigkeit bis zum gewählten Anteil ihres Fassungsvermögens gefüllt. Der Drucker gießt sie aus seinen eigenen Tanks (führe Leitungen zu ihm) und wartet, bis er genug hat.
ycb.guide.fly.title = Im Flug: Blöcke, Bohrer, Türme
ycb.guide.fly.text = [accent]Alles arbeitet.[] Förderbänder bewegen Gegenstände, Brücken und Kabel behalten ihre Verbindungen, Entlader, Lager, Generatoren, Fabriken und Türme arbeiten wie gewohnt. Ein gelandetes Schiff ist wieder Teil der Karte und arbeitet dort auf die gewöhnliche Weise.\n\n[accent]Bohrer[] fördern, was im Moment unter dem Schiff liegt: Berührt der Rand des Bohrers ein Erz, fördert er es. Das Erz wechselt im Flug, während sich das Schiff bewegt, sodass ein Bohrer überall platziert und über ein Erz getragen werden kann (siehe Freies Platzieren). [accent]Pumpen[] nehmen Flüssigkeit aus dem Wasser, das sie berühren, und geben sie an benachbarte Tanks und Leitungen weiter. Eine Leitung, die im leeren Raum endet, leckt auf den Boden unter dem Schiff. Thermische Generatoren, Kultivierer und Wasser-Extraktoren lesen den Boden unter dem fliegenden Schiff.\n\n[accent]Türme wirken wie ein Geschütz.[] Wählt das Schiff ein Ziel (oder du schießt selbst), drehen sich alle Geschütze dorthin und feuern gemeinsam. Jeder Turm hat seine eigene Munition und Drehgeschwindigkeit. Das Zielen führt das Ziel vor und rechnet die Geschwindigkeit des Schiffs ein.\n\n[accent]Geschosse behalten die Geschwindigkeit des Schiffs.[] Wie die Geschosse einer Einheit bekommen die Geschosse seiner Geschütze die Geschwindigkeit des Schiffs dazu (nicht Laser, Blitze und anderes, das im Spiel keine Geschwindigkeit erbt). Ein fliegendes Schiff zählt als Luftziel: Nur-Luft-Geschosse (Flak) können es treffen, Nur-Boden-Geschosse (Artillerie, Flammen) nicht; Phasenwände reflektieren Geschosse.\n\n[accent]Aussehen.[] Jeder Block wirft einen Schatten. Ein beschädigter Block zeigt Risse, je mehr, desto dunkler. Ein fliegendes Schiff wird über der Dunkelheit des Kartenrands und dicken Wänden gezeichnet und wird dort nicht dunkler.
ycb.guide.collide.title = Kollisionen und Gewicht
ycb.guide.collide.text = Jedes belegte Feld wiegt 1, also ist ein Schiff aus 100 Blöcken 100-mal schwerer als ein einzelner Block.\n\nBerühren sich zwei Schiffe, tauschen sie [accent]Impuls[] (Gewicht x Geschwindigkeit) aus wie Billardkugeln: Der Gesamtimpuls bleibt, aber ein Teil der Bewegungsenergie geht verloren (der Rückprall ist weder ganz hart noch ganz weich, 0,25). Sie werden im umgekehrten Verhältnis ihrer Gewichte auseinandergestoßen, sodass sich das schwere Schiff kaum bewegt und das leichte davonfliegt.\n\nBeispiel: 100 Blöcke mit 1 Feld pro Sekunde tragen den Impuls 100, ein Block mit 10 Feldern pro Sekunde nur 10, also fährt das große Schiff weiter, und das kleine wird zurückgeworfen.\n\nDie Triebwerke arbeiten während des Kontakts weiter: Ein leichtes Schiff, das gegen ein schweres drückt, bewegt es nicht, und ein schweres Schiff kann ein leichtes vor sich her tragen. Harte Treffer schlagen Funken. Das Schiff des Spielers hat keinen Vorrang: Nur das Gewicht entscheidet.\n\nSchiffe kollidieren nicht, während sie landen oder abheben. Im Baumodus halten die Blöcke der Welt ein Schiff auf wie gewöhnliche Blöcke; im Flug spielt das Gelände keine Rolle.\n\nSchwerere Schiffe drehen auch langsamer (siehe Schub, Geschwindigkeit und Gewicht).
ycb.guide.damage.title = Schaden, fallende Blöcke, Abstürze
ycb.guide.damage.text = [accent]Schaden.[] Gegnerische Geschosse treffen bestimmte Blöcke des Schiffs (Panzerung zählt). Wird ein Block zerstört, der andere hielt, fällt alles, was sich vom Rumpf gelöst hat. Werden alle Kerne und Lager zerstört, wird das ganze Schiff zerstört, und die restlichen Blöcke fallen.\n\n[accent]Fallende Blöcke.[] Jede Gruppe, die sich gelöst hat, wird zu Trümmern: Sie behält Geschwindigkeit und Drehung des Schiffs in diesem Moment, spielt die Landeanimation 1,5-mal schneller ab (ohne Rauch und Staub) und schlägt auf. Jeder Block fügt den [accent]Gegnern[] darunter so viel Schaden zu, wie er Lebenspunkte hat (eine Einheit stirbt, wenn sie mindestens ihre Lebenspunkte erhält). Dann werden alle Blöcke der Trümmer mit der üblichen Explosion zerstört: Treibstoff und Brennbares entzünden sich, Batterien platzen, Flüssigkeiten laufen aus. Verbündete werden nicht verletzt. Der Baumodus lässt nichts fallen: Dort werden lose Blöcke nur rot.\n\n[accent]Landen auf Gegnern.[] Setzt ein Schiff auf (jede Landung, auch G), kämpft jede gegnerische Bodeneinheit (auch laufende), die von einem Block berührt wird, gegen die Blöcke, die sie berührt. Haben die Blöcke zusammen mehr Lebenspunkte als die Einheit (Lebenspunkte + Schild), stirbt die Einheit, und die Blöcke verlieren zusammen 25 % der Lebenspunkte der Einheit (aber kein Block sinkt unter 1). Sonst verliert die Einheit so viele Lebenspunkte, wie die Blöcke hatten, und die Blöcke [accent]zerbrechen[] (explodieren wie jeder zerstörte Block). Zerbricht ein Kern oder Lager, übernimmt ein anderes Lager des Schiffs seinen Platz; bleibt keines übrig, zerfällt das Schiff in gewöhnliche Blöcke. Einheiten deines eigenen Teams und neutrale werden nicht verletzt, nur an den nächsten freien Platz verschoben.\n\n[accent]Absturz.[] Ein Schiff ohne arbeitendes Triebwerk wählt keinen Ort: Es fällt genau dorthin, wohin seine Geschwindigkeit es trägt. Jedes Gebäude, das es trifft, wird mit den gesamten Lebenspunkten der fallenden Blöcke verglichen. Mehr Lebenspunkte: Das Gebäude wird zerstört und ersetzt, und die Blöcke verlieren 25 % seiner Lebenspunkte. Weniger oder gleich: Die Blöcke zerbrechen, und das Gebäude erhält Schaden in Höhe ihrer Lebenspunkte. Blöcke, die auf etwas fallen, worauf man nicht bauen kann (eine Kartenwand, tiefes Wasser, jenseits des Rands), zerbrechen. [accent]Abwurfzone.[] Beginnt eine Welle, zerstört das Spiel alles von dir in der Nähe der Boden-Spawns (der rote Kreis). Ein fliegendes Schiff ist darüber nicht sicher: Jeder Block, der in diesem Moment im Kreis liegt, wird abgerissen und fällt wie jeder Block, der seinen Halt verloren hat (ein Notsturz). Was die abgerissenen Blöcke hielten, fällt mit ihnen; wird der Rumpf abgerissen, geht das ganze Schiff nieder. Schiffe des Wellenteams werden nicht berührt.
ycb.guide.fire.title = Feuer und Explosionen
ycb.guide.fire.text = Ein fliegendes Schiff hat seine eigenen Feuer und Explosionen, die mit dem Boden darunter verbunden sind. Ein gelandetes Schiff liegt auf der Karte, dort wirkt das spieleigene Feuer.\n\n[accent]Feuer.[] Auf jedem brennenden Feld eines Blocks brennt ein Feuer.\n- Es entsteht durch Brandgeschosse, durch einen zerstörten Block mit Brennbarem darin (Kohle, Öl, Sporen ...), und das Feuer des Bodens unter den Blöcken geht beim Abheben auf das Schiff über (und bei der Landung zurück auf den Boden).\n- Alle halbe Sekunde trifft es seinen Block (2,5 Schaden x Stärke des Feuers, Panzerung zählt nicht). Ohne Brennstoff lebt es etwa 17 Sekunden.\n- Solange der Block Brennbares enthält, wächst das Feuer (bis zu x4 Schaden) und dauert länger; ohne es erlischt es.\n- Es breitet sich auf Nachbarblöcke aus, und alle 0,75 Sekunden kann es nach unten fallen: Liegt darunter ein Bodenblock, beginnt dort ein echtes Feuer.\n- Ein Block mit Wasser oder einer anderen löschenden Flüssigkeit (10 Einheiten oder mehr) löscht sein Feuer schnell. Wellen-Türme auf einem Schiff löschen dessen Feuer nicht von selbst.\nEin Schiff hält bis zu 400 Feuer; sie werden nicht gespeichert.\n\n[accent]Explosionen.[] Ein sterbender Block explodiert nach den Zahlen des Spiels: der Explosivität, Entflammbarkeit und Ladung dessen, was darin ist.\n- Die Explosionen treffen die Blöcke aller fliegenden Schiffe im Radius, auch die eigenen. Am Rand beträgt der Schaden 40 %. Panzerung zählt.\n- [accent]Batterien[] (und jeder Block mit Ladung) entladen sich: Schaden = Ladung / 25, höchstens 600; Blöcke, die Energie brauchen, erhalten x1,5.\n- Ein [accent]Thorium-Reaktor[] (und ein Impuls-Reaktor) sprengt alles ringsum mit seinem eigenen Radius und Schaden (19 Felder und 5000 beim Thorium). Er explodiert nur, wenn er geladen ist: Brennstoff 5 oder mehr oder Hitze 0,5 oder mehr, und wenn die Regeln Reaktorexplosionen erlauben.\n- Ein zerstörter Schiffsblock löst trotzdem die Explosion des Spiels auf dem Boden darunter aus (Blöcke zerbrechen, Feuer, Blitze). Ein Bodenblock, der stirbt, trifft die Schiffe darüber auf dieselbe Weise.\nExplosionen verketten sich mit einer Verzögerung von einigen Ticks, wie die Wellen des Spiels. Die Regeln Feuer, Schaden von Explosionen und Reaktorexplosionen werden beachtet.
ycb.guide.units.title = Projektoren und Einheitenfabriken
ycb.guide.units.text = [accent]Reparateure und Projektoren.[] Ein Reparateur, ein Reparaturprojektor und ein Beschleunigungs-Projektor auf einem fliegenden Schiff wirken auf die Blöcke [accent]dieses Schiffs[], nicht auf die echten Blöcke darunter: Reparateure heilen beschädigte Blöcke, der Beschleunigungs-Projektor beschleunigt Blöcke. Der Kraftfeld-Projektor erzeugt sein Feld um das Schiff, gezeichnet wie das des Spiels selbst. Ein Prozessor kann einen Projektor ausschalten. Auf einem gelandeten Schiff stehen die Blöcke auf der Karte und arbeiten auf die gewöhnliche Weise.\n\n[accent]Einheitenfabriken.[] Eine Einheitenfabrik (und ein Rekonstruktor) auf einem fliegenden Schiff behält eine fertige Einheit nur, wenn der Block davor sie annimmt: ein Nutzlast-Förderband, ein Verteiler, ein Massenbeschleuniger und so weiter, oder ein Rekonstruktor, der genau diese Einheit aufrüsten kann. Sonst:\n- eine [accent]Luft[]-Einheit fliegt heraus (auch wenn ein Block davor steht: Sie bleibt nicht mehr für immer drin);\n- eine [accent]Boden-, Läufer- oder Marine[]-Einheit fällt auf den echten Boden unter dem Schiff: an den nächsten Ort, an dem sie stehen kann (bis zu 5 Felder vom Punkt), mit einer Staubwolke und einem Teil der Geschwindigkeit des Schiffs. Eine Marineeinheit, die nicht ins Wasser fällt, stirbt, wie im Spiel.\nEin Rekonstruktor am Ende einer Kette lässt die Einheit auf dieselbe Weise heraus, wenn er sie nicht aufrüsten kann. Das Einheitenlimit wird beachtet: Am Limit wartet die Einheit in der Fabrik.
ycb.guide.planets.title = Andere Planeten und Mods
ycb.guide.planets.text = [accent]Jeder Block der Mod ist auf jedem Planeten verfügbar[], auch auf Erekir und den Planeten anderer Mods. Sie sind immer freigeschaltet (nichts zu erforschen), werden im Reiter Einheiten gezeigt (der Schiffssteuerungsblock in Logik) und lassen sich überall platzieren, auch im Weltraum und unter Wasser.\n\n[accent]Rezepte.[] Auf Serpulo werden die klassischen Rezepte benutzt. Auf jedem anderen Planeten wird ein Block aus den ersten Ressourcen der Liste des Planeten gemacht; je älter der Block, desto mehr davon braucht er:\n- Raketen-Booster: 2 Ressourcen, 20 und 10\n- Landeplatz: 2 Ressourcen, 20 und 20\n- Energie-Booster: 3 Ressourcen, 100, 50 und 30\n- Schiffssteuerung: 3 Ressourcen, 50, 300 und 120\n- Treibstoff-Booster: 4 Ressourcen, 300, 400, 100 und 200\nHat der Planet weniger Ressourcen, werden alle benutzt. Der Entwurfsdrucker nutzt die letzte Ressource des Planeten (statt Spannungslegierung und Phasengewebe) und die ersten zwei (statt Graphit und Plastanium).\n\n[accent]Die Ressourcenliste eines Planeten[] folgt der Reihenfolge, in der der Planet sie liefert: sein Forschungsbaum, Stufe für Stufe (nur Gegenstände); dann die anderen für diesen Planeten gemachten Ressourcen in der Reihenfolge, in der die Mod sie deklariert hat; nur wenn der Planet keine hat, die anderen Ressourcen.\n\n[accent]Treibstoff.[] Auf Serpulo brennen Kohle, Sporen-Pods und Pyratit. Jeder Gegenstand einer anderen Mod mit Entflammbarkeit 0,3 oder mehr ist ebenfalls ein Treibstoff, mit dem Schub 10 x Entflammbarkeit (höchstens 20). Wo nichts brennt (Erekir), werden die flüchtigsten Ressourcen des Planeten zum Treibstoff. Flüssigkeits-Boost geben weiterhin nur Wasser und Kryoflüssigkeit.\n\nDie Rezepte werden neu berechnet, wenn eine Welt oder ein Sektor geladen wird und wenn sich der Planet des Spiels ändert.
ycb.guide.multi.title = Mehrspieler
ycb.guide.multi.text = Die Mod funktioniert im Einzelspieler, für den Host und auf einem dedizierten Server. [accent]Die Mod, in derselben Version, wird auf dem Server und auf jedem Client benötigt.[]\n\n[accent]Wie es funktioniert.[] Der Server erledigt die gesamte Arbeit der Schiffe: Flug, Landen und Abheben, Schaden, Feuer, Autopilot, Befehle. Ein Client führt keine Schifflogik aus; er hält eine Kopie jedes Schiffs und zeichnet es. Flug, die Abhebe- und Landeanimationen mit Staub, Turmausrichtung, arbeitende Triebwerke, Schaden, Feuer, Schüsse und Explosionen werden synchronisiert.\n\n[accent]Ein Client kann[] ein Schiff steuern (Y, Shift+Y oder Strg + Klick), ihm Befehle des Befehlsmodus geben (bewegen, Landen, Abheben) und G und Y benutzen. Nur der Host (der Server selbst) kann den Schiffssteuerungsblock und den Entwurfsdrucker einrichten.\n\n[accent]Der Baumodus ist lokal.[] G ist nur für dich an: Das Schiff, das du wählst (das, in dem du sitzt, sonst das unter dem Cursor, sonst das nächste), landet, die anderen fliegen weiter. Die [accent]violette Maske[] ist die Schiffsebene; die Felder mit der Maske sehen alle Spieler, und ein Schiff, das gerade jemand bearbeitet, hat eine hellere, blinkende Maske. Blöcke, die du in G platzierst, sehen für andere violett aus, bis du den Modus verlässt. Das Verlassen von G hebt nur die Schiffe ab, die keine Bearbeiter mehr haben; ein gelandetes (geparktes) Schiff bleibt am Boden.\n\n[accent]Speichern.[] Schiffe werden in einem eigenen Block der Spielstanddatei gespeichert, sodass auch große Basen ohne den Fehler „encoded string too long“ gespeichert werden. Alte Spielstände werden ebenfalls geladen.
ycb.guide.settings.title = Einstellungen, Grenzen und Tipps
ycb.guide.settings.text = [accent]Einstellungen[] (Einstellungen, die Seite der Mod):\n- Schub eines Raketen-Boosters: standardmäßig 45 Felder pro Sekunde pro Feld des Schiffs. Die Geschwindigkeit jedes Schiffs hängt davon ab.\n- Das Flugschiff in Fahrtrichtung drehen: standardmäßig an.\n- Die Schaltfläche der YCB-Anleitung.\n\n[accent]Grenzen.[]\n- Ein Schiff ist höchstens etwa 110 Blöcke breit.\n- Blöcke im Bau bewegen sich nicht: Stelle sie vor dem Abheben fertig.\n- Freies Platzieren funktioniert nur im Baumodus und nur für Blöcke, deren Gelände das Spiel prüft (Bohrer, Pumpen, Thermische Generatoren und dergleichen). Der Kern muss mindestens einen Gegenstand jeder benötigten Art enthalten.\n- Gegenstände in einem Lager, das abgetrennt und beim Verlassen des Baumodus entfernt wurde, gehen verloren.\n- Bodengegner finden den Weg zu Kernen über die Karte: Solange ein Kern fliegt, finden sie ihn so nicht. Jeder Gegner, der ein Schiff sieht und auf Luft schießt, kann es angreifen.\n- Der Autopilot weicht den Befehlen des Befehlsmodus. Eine Landung durch ein Modul braucht Platz unter dem ganzen Schiff. Bei einer Landung oder einem Abheben lässt sich das Schiff nicht steuern, und Befehle wirken nicht.\n- Booster werden beim Drehen nicht gespiegelt.\n- Gegner zielen auf die Mitte eines fliegenden Schiffs, nicht auf einzelne Blöcke. Laser, Blitze und Energiefelder (Navanax, Aegires) schaden seinen Blöcken nicht, und ein gegnerischer Parallax kann es nicht ziehen.\n- Plasmabohrer und Klippenbohrer bauen keine Wände ab, solange das Schiff fliegt.\n\n[accent]Tipps.[]\n- Kopiere ein Schiff im Baumodus als Entwurf: Der Drucker kann es drucken, und die Module seines Steuerblocks kommen mit.\n- Setze Landeplätze in die Nähe deiner Bohrer und gib dem Schiff ein Modul Landung für Ressourcen: Es holt und entlädt von selbst.\n- Mehrere Magnete an einem Schiff ziehen es stärker; setze sie auf die Seite, die dem Partner zugewandt ist.\n- Hebt ein Schiff nicht ab, schau oben am Bildschirm nach dem Booster-Hinweis und prüfe Treibstoff und Energie.
