block.your-custom-battleship-rocket-booster.name = Raketen-Booster
block.your-custom-battleship-rocket-booster.description = Das Basistriebwerk eines Flugschiffs. Nur im Baumodus für Flugschiffe platzierbar. Schub = 1. Die Geschwindigkeit des Flugschiffs ist der Gesamtschub aller Booster mal der Leistung eines Raketen-Boosters, geteilt durch die Anzahl der Felder, die das Flugschiff belegt. Das Rezept hängt vom Planeten ab: auf Serpulo das klassische, auf jedem anderen Planeten besteht es aus den ersten 2 Ressourcen des Planeten.
block.your-custom-battleship-energy-booster.name = Energie-Booster
block.your-custom-battleship-energy-booster.description = Ein 2x2-Triebwerk mit dem Schub von 6 Raketen-Boostern. Verbraucht 90 Energieeinheiten pro Sekunde, solange das Flugschiff gesteuert wird; bei Energiemangel sinkt der Schub. Flüssigkeits-Boost (optional): Wasser verdoppelt den Schub (x2 = 12 Raketen-Booster), Kryoflüssigkeit ergibt x2,5 (15); er verbraucht 10 Flüssigkeitseinheiten pro 10 Sekunden Betrieb. Nur im Baumodus für Flugschiffe platzierbar. Das Rezept hängt vom Planeten ab: auf Serpulo das klassische, auf jedem anderen Planeten besteht es aus den ersten 3 Ressourcen des Planeten.
block.your-custom-battleship-fuel-booster.name = Treibstoff-Booster
block.your-custom-battleship-fuel-booster.description = Ein 3x3-Triebwerk, das pro 8 Sekunden Betrieb einen Gegenstand verbrennt. Kohle ergibt den Schub von 14 Raketen-Boostern, Sporen-Pods 15, Pyratit 17,3. Flüssigkeits-Boost (optional): Wasser ergibt x1,25, Kryoflüssigkeit x3 (42 / 45 / 52 Raketen-Booster); pro verbranntem Gegenstand werden 20 Flüssigkeitseinheiten verbraucht. Versorge ihn mit Förderbändern oder Entladern; Treibstoff lässt sich auch mit einem Entlader herausholen; ohne Treibstoff arbeitet er nicht. Nur im Baumodus für Flugschiffe platzierbar. Auf anderen Planeten und mit anderen Mods ist jede brennbare Ressource ein Treibstoff (Schub = 4 + 10 x ihre Entflammbarkeit); wo nichts brennt, sind es die flüchtigsten Ressourcen. Das Rezept hängt vom Planeten ab: auf Serpulo das klassische, auf jedem anderen Planeten besteht es aus den ersten 4 Ressourcen des Planeten.
