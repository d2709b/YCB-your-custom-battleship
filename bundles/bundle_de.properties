block.your-custom-battleship-ship-builder.name = Entwurfsdrucker
block.your-custom-battleship-ship-builder.description = Ein 16x16-Drucker für Schiffe. Drücke den Stift unter dem Block und wähle einen Schiffsentwurf: Aufgelistet werden nur Entwürfe bis 16x16 Felder mit einem Kern oder Lager, deren Blöcke sich alle berühren. Drehe den Block (R), bevor du ihn platzierst: Die Pfeile am Boden zeigen, wo das fertige Schiff ihn verlässt (immer auf der Seite, zu der der Drucker zeigt; das Schiff behält die Ausrichtung, die mit der Richtungstaste gewählt wurde). Er druckt wie eine Einheitenfabrik: Er braucht die Gegenstände des Entwurfs (die Baukosten aller Blöcke) + 100 Phasengewebe, 3000 Energieeinheiten pro Sekunde und 240 Kryoflüssigkeit pro Sekunde; das Drucken dauert das 1,5-Fache der Zeit, die ein Spieler zum Bauen aller Blöcke braucht. Die drei Schornsteine brennen während des Druckens. Das fertige Schiff fliegt ein Stück nach vorn und folgt dann den Befehlen seines Schiffssteuerungsblocks. Kann nicht im Baumodus für Flugschiffe platziert werden und wird nie Teil eines Schiffs. Das Rezept hängt vom Planeten ab: auf Serpulo Spannungslegierung, Graphit und Plastanium; auf einem anderen Planeten die letzte Ressource des Planeten nach ID (statt Spannungslegierung und Phasengewebe) und seine ersten zwei Ressourcen (statt Graphit und Plastanium). Er fasst jede Art von Flüssigkeit. Ein Schiffssteuerungsblock im Entwurf kann eine Vorladung von Gegenständen (sie werden zum Preis addiert und erscheinen im Lager des neuen Schiffs) und eine Flüssigkeitsladung anfordern (sie wird aus den Tanks des Druckers in die Tanks des neuen Schiffs gefüllt).
