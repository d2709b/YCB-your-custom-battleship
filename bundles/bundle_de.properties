block.your-custom-battleship-ship-control.name = Schiffssteuerung
mb.ship.nothing = Die Karte hat keine Erze oder Flüssigkeiten
block.your-custom-battleship-ship-control.description = Sagt dem Flugschiff mit Logikmodulen, was es tun soll. Sie laufen nacheinander von oben nach unten und dann im Kreis wieder vom ersten an; ein Modul behält das Schiff, bis es fertig ist. Ressource: ein Erz oder eine Flüssigkeit bis zu einem Füllprozentsatz holen (ein Erz, das ein Schiff genommen hat, ist für die anderen gesperrt). Ruhepunkt: über einem Punkt schweben oder auf einem Landeplatz landen und dort bleiben, solange die aufgelisteten Ressourcen ihre Prozentwerte halten, oder für einen Timer; eine Liste von Orten wird der Reihe nach probiert, der erste freie wird genutzt. Landung für Ressourcen: auf dem ersten freien Landeplatz einer Liste landen und bleiben, bis die aufgelisteten Ressourcen ihre Prozentwerte erreichen, dann abheben. Der Stift öffnet das Panel. Nur im Baumodus für Flugschiffe platzierbar; mehrere können auf einem Flugschiff sitzen. Das Rezept hängt vom Planeten ab: auf Serpulo das klassische, auf jedem anderen Planeten besteht es aus den ersten 3 Ressourcen des Planeten. Ein Steuerblock kann auch eine Vorladung von Gegenständen und eine Flüssigkeitsladung enthalten: Ein vom Entwurfsdrucker gedrucktes Schiff erhält diese Gegenstände in seinem Lager (sie werden zum Preis addiert) und seine Tanks werden mit der Flüssigkeit gefüllt.
block.your-custom-battleship-landing-spot.name = Landeplatz
block.your-custom-battleship-landing-spot.description = Ein schlichter Block am Boden. Ein Flugschiff mit einem Landemodul fliegt darauf zu und landet darauf: Eines seiner Lager deckt den Platz ab, der Platz wird nicht zerstört (er ist nur bedeckt, solange das Flugschiff dort steht). Das Flugschiff hebt wieder ab, wenn seine Module fertig sind. Außerhalb des Baumodus platzierbar. Das Rezept hängt vom Planeten ab: auf Serpulo das klassische, auf jedem anderen Planeten besteht es aus den ersten 2 Ressourcen des Planeten.
block.your-custom-battleship-magnet.name = Magnet
block.your-custom-battleship-magnet.description = Ein Ein-Feld-Block mit einer Vorderseite (rot) und einer Rückseite (blau); drehbar. Verbraucht 10 Energieeinheiten / Sekunde. Ein Magnet eines Flugschiffs zieht die Magnete eines ANDEREN Flugschiffs deines Teams an, die höchstens 5 Felder entfernt und andersherum ausgerichtet sind (die Front des einen sieht auf den anderen Magneten und die Front des anderen sieht in dieselbe Richtung: Front zu Rückseite). Die Anziehung ist so stark wie 3 Raketen-Booster, mit der Entfernung schwächer, und sie gibt Geschwindigkeit wie Triebwerke: Ein großes Flugschiff bewegt sich kaum, ein kleines kommt schnell; die Flugschiffe drehen sich außerdem, um nebeneinander zu stehen. Wenn zwei Magnete aufeinandertreffen, werden die Flugschiffe zu EINEM Flugschiff: ein Gewicht, der Schub aller Triebwerke. Gleiche Pole stoßen die Flugschiffe stattdessen voneinander ab: Wenn die Fronten einander ansehen (rot zu rot) oder die Rückseiten (blau zu blau), stößt der Magnet sein Flugschiff mit derselben Kraft weg. Magnete desselben Flugschiffs tun einander nichts. Wenn die Energie der Magnete ausfällt, lassen die Flugschiffe einander los; ein Teil, der kein Triebwerk mehr hat, geht mit einer Fallanimation nieder, behält seine Geschwindigkeit, und seine Blöcke bleiben als gewöhnliche Blöcke am Boden. Nur im Baumodus für Flugschiffe platzierbar. Das Rezept hängt vom Planeten ab: auf Serpulo das klassische, auf jedem anderen Planeten besteht es aus den ersten 3 Ressourcen des Planeten. Magnete am Boden wirken auch auf Flugschiffe (siehe Supermagnet).
block.your-custom-battleship-super-magnet.name = Supermagnet
block.your-custom-battleship-super-magnet.description = Ein Zwei-mal-zwei-Block mit einer Vorderseite (rot) und einer Rückseite (blau); drehbar. Verbraucht 500 Energieeinheiten / Sekunde. Arbeitet wie der Magnet, aber mit einer Reichweite von 25 Feldern und einer Anziehung von 100 Raketen-Boostern (ein angezogenes Schiff erreicht bis zu 12 Felder pro Sekunde), und er arbeitet mit gewöhnlichen Magneten und Supermagneten gleichermaßen (ein Paar arbeitet mit der stärkeren Anziehung und der größeren Reichweite von beiden). Auch ein Magnet mit Energie am BODEN ist nicht untätig: Er zieht ein Flugschiff deines Teams, das andersherum ausgerichtete Magnete hat, ZU sich heran (das Schiff fliegt zum Magneten, dreht sich, der Schatten schrumpft wie bei einer Landung, und das Schiff landet Seite an Seite mit dem Magneten, wie bei einer Verbindung), wenn das Schiff schwebt und stillsteht, und stößt Schiffe weg, deren Magnete gleich ausgerichtet sind. Ein Schiff in der Anziehung kann sie nur verlassen, und ein gelandetes Schiff kann nur abheben, wenn der Schub seiner Triebwerke größer ist als die Anziehung der Magnete. Das Rezept hängt vom Planeten ab: auf Serpulo 100 Spannungslegierung, 200 Graphit und 200 Blei, auf jedem anderen Planeten besteht es aus den ersten 3 Ressourcen des Planeten.
mb.ship.title = Schiffssteuerung
mb.ship.hint = Die Module laufen nacheinander von oben nach unten, nach dem letzten wieder vom ersten an (im Kreis). Ein Modul behält das Schiff, bis es fertig ist oder nicht arbeiten kann; dann bekommt das nächste Modul das Schiff. Befehle des RTS-Panels haben Vorrang vor allen Modulen. Ein Erz, ein Landeplatz oder ein Punkt, den ein Schiff belegt hat, ist für die anderen Schiffe gesperrt.
