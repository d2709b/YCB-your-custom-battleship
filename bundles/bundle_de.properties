mb.hud.build = Baumodus für Flugschiffe. Blöcke, die du platzierst, schließen sich dem Flugschiff an; Blöcke, die nicht mit dem Rumpf verbunden sind, werden rot markiert und beim Verlassen entfernt. Y verschiebt den Block unter dem Cursor zwischen der Weltebene (blau) und der Flugschiff-Ebene; halte Y und ziehe ein Quadrat auf, um alle Blöcke darin zu verschieben (Start auf einem Weltblock: sie schließen sich dem Flugschiff an, Start auf einem Flugschiffblock: sie verlassen es). Der grüne Pfeil auf einem Kern / Lager ist die Front des Flugschiffs: R dreht ihn (Shift+R in die andere Richtung). Bohrer, Pumpen, Thermische Generatoren und andere an den Boden gebundene Blöcke können hier überall platziert werden.
