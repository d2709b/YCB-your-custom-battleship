block.your-custom-battleship-ship-control.name = 飞船控制
mb.ship.nothing = 地图上没有矿石或液体
block.your-custom-battleship-ship-control.description = 通过逻辑模块告诉飞船该做什么。模块自上而下依次运行，然后再从第一个开始循环；模块会一直占用飞船，直到完成。资源：获取矿石或液体，直至达到设定的填充百分比（已被一艘飞船选中的矿石，对其他飞船不可用）。待机点：悬停在某个点位上空，或降落在着陆点上，并在所列资源保持在各自百分比以上期间停留，或按计时器停留；地点列表按顺序尝试，使用第一个空闲的。资源着陆：降落到列表中第一个空闲的着陆点，停留到所列资源达到各自的百分比，然后起飞。铅笔按钮用于打开面板。只能在飞船建造模式中放置；一艘飞船上可以放置多个。配方取决于星球：在塞普罗上使用经典配方，在其他任何星球上由该星球的前 3 种资源制成。控制方块还可以设置物品预装和液体装载：由蓝图打印机打印的飞船，其存储中会获得这些物品（计入价格），其储罐也会被灌入该液体。
block.your-custom-battleship-landing-spot.name = 着陆点
block.your-custom-battleship-landing-spot.description = 地面上的普通方块。带有着陆模块的飞船会飞到它上面并降落：飞船的一个存储方块会覆盖这个着陆点，着陆点不会被摧毁（只是在飞船停在上面时被覆盖）。飞船的模块完成后会再次起飞。可在建造模式之外放置。配方取决于星球：在塞普罗上使用经典配方，在其他任何星球上由该星球的前 2 种资源制成。
block.your-custom-battleship-magnet.name = 磁铁
block.your-custom-battleship-magnet.description = 1 格大小的方块，有前端（红）和后端（蓝）；可旋转。消耗 10 电力/秒。一艘飞船的磁铁会吸引你队伍中另一艘飞船上、5 格范围内且朝向相反的磁铁（一个磁铁的前端朝向另一个磁铁，而另一个磁铁的前端也朝向同一方向：前端对后端）。吸力相当于 3 个火箭推进器，距离越远越弱，并且像引擎一样提供速度：大飞船几乎不动，小飞船则很快靠近；飞船还会转动，并排停靠。两个磁铁相遇时，两艘飞船会合并为一艘飞船：重量合为一体，推力为所有引擎之和。同极则相反，会把飞船推开：当两个前端相对（红对红）或两个后端相对（蓝对蓝）时，磁铁会以同样的力把自己的飞船推开。同一艘飞船上的磁铁之间互不影响。磁铁断电后，飞船会彼此松开；不再有引擎的那部分会带着坠落动画落下，保持其速度，其方块作为普通方块留在地面上。只能在飞船建造模式中放置。配方取决于星球：在塞普罗上使用经典配方，在其他任何星球上由该星球的前 3 种资源制成。地面上的磁铁对飞船同样有效（见超级磁铁）。
block.your-custom-battleship-super-magnet.name = 超级磁铁
block.your-custom-battleship-super-magnet.description = 2x2 的方块，有前端（红）和后端（蓝）；可旋转。消耗 500 电力/秒。作用与磁铁相同，但范围为 25 格，吸力相当于 100 个火箭推进器（被吸引的飞船速度最高可达 12 格/秒），并且可与普通磁铁和超级磁铁互相配合（一对磁铁以两者中较强的吸力和较远的范围工作）。放置在地面上的通电磁铁也不会闲置：如果飞船悬停且静止，它会把你队伍中磁铁朝向相反的飞船吸向自己（飞船飞向磁铁并转向，阴影像着陆时一样缩小，然后飞船与该磁铁面对面着陆，如同合并），并推开磁铁朝向相同的飞船。处于吸力中的飞船要脱离吸力、已着陆的飞船要起飞，都只有在其引擎推力大于磁铁吸力时才能做到。配方取决于星球：在塞普罗上为 100 巨浪合金、200 石墨和 200 铅，在其他任何星球上由该星球的前 3 种资源制成。
