block.your-custom-battleship-rocket-booster.name = 火箭推进器
block.your-custom-battleship-rocket-booster.description = 飞船的基础引擎。只能在飞船建造模式中放置。推力 = 1。飞船速度等于所有推进器的总推力乘以单个火箭推进器的推力，再除以飞船占用的格数。配方取决于星球：在塞普罗上使用经典配方，在其他任何星球上由该星球的前 2 种资源制成。
block.your-custom-battleship-energy-booster.name = 能量推进器
block.your-custom-battleship-energy-booster.description = 2x2 引擎，推力相当于 6 个火箭推进器。飞船行驶期间每秒消耗 90 电力；电力不足时推力会下降。液体强化（可选）：水使推力翻倍（x2 = 12 个火箭推进器），冷冻液为 x2.5（15）；每工作 10 秒消耗 10 单位液体。只能在飞船建造模式中放置。配方取决于星球：在塞普罗上使用经典配方，在其他任何星球上由该星球的前 3 种资源制成。
block.your-custom-battleship-fuel-booster.name = 燃料推进器
block.your-custom-battleship-fuel-booster.description = 3x3 引擎，每工作 8 秒燃烧 1 个物品。煤炭提供相当于 14 个火箭推进器的推力，孢子荚 15，硫化物 17.3。液体强化（可选）：水为 x1.25，冷冻液为 x3（42 / 45 / 52 个火箭推进器）；每燃烧 1 个物品消耗 20 单位液体。可用传送带或装卸器供给燃料，也可用装卸器取出燃料；没有燃料时无法工作。只能在飞船建造模式中放置。在其他星球和其他模组中，任何可燃资源都可作燃料（推力 = 4 + 10 x 其燃烧性）；如果没有可燃资源，则以最易挥发的资源为燃料。配方取决于星球：在塞普罗上使用经典配方，在其他任何星球上由该星球的前 4 种资源制成。
