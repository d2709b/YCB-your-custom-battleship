block.your-custom-battleship-ship-builder.description = 16x16 的飞船打印机。点击方块下方的铅笔按钮并选择一个飞船蓝图：只列出不超过 16x16 格、含有核心或存储方块且所有方块彼此相连的蓝图。放置前先旋转方块（R）：地面上的箭头表示打印完成的飞船离开的方向（始终是打印机所面向的一侧；飞船保持用方向按钮选定的航向）。它像单位工厂一样打印：需要蓝图所需的物品（建造每个方块的花费）+ 100 相织布、每秒 3000 电力和每秒 240 冷冻液；打印用时是玩家建造其全部方块所需时间的 1.5 倍。打印时，三个烟囱会燃起火焰。打印完成的飞船会向前飞出一小段，然后听从其飞船控制方块的指令。不能在飞船建造模式中放置，也永远不会成为飞船的一部分。配方取决于星球：在塞普罗上为巨浪合金、石墨和塑钢；在其他星球上，使用该星球按 ID 排序的最后一种资源（代替巨浪合金和相织布）和前两种资源（代替石墨和塑钢）。它可容纳每一种液体。蓝图中的飞船控制方块可以要求物品预装（计入价格，出现在新飞船的存储中）和液体装载（从打印机的储罐灌入新飞船的储罐）。
