ycb.guide.theme.world = 世界与设置
ycb.guide.idea.title = 什么是飞船
ycb.guide.idea.text = 飞船是由方块构成的单位。它的船体是[accent]核心[]或[accent]存储方块/容器[]。所有连接到船体的方块（边与边相接，也可以通过其他方块相连）都会成为飞船的一部分。\n\n飞行时，飞船不在格子网格上：世界中的传送带、电线和炮塔看不到它，也不会接触它。它只与其他飞船、敌人和子弹发生交互。它可以朝[accent]任意角度[]移动和转向，而不是一格一格地移动，并且它的每个方块在飞行中都保持工作：传送带运送物品，钻头采矿，工厂生产，发电机供电，炮塔射击。每个方块都会在地面上投下阴影，就像飞行单位一样。\n\n只有你亲手做成飞船的，才是飞船。放在地图上的普通核心不是飞船，除非你在建造模式（[accent]G[]）下对它按 [accent]Y[]，或在那里建造一个船体。\n\n飞船需要[accent]推进器[]（引擎）：没有推进器，它就无法飞行。速度 = 推进器总推力 x 单个火箭推进器的推力 / 飞船的方块数，所以飞船越重，速度越慢。
ycb.guide.first.title = 你的第一艘飞船，一步一步来
ycb.guide.first.text = [accent]1.[] 在地面上放置一个核心或存储方块/容器（或使用你已有的）。\n[accent]2.[] 按 [accent]G[]（手机上：建造按钮）。建造模式开启：显示网格，所有不属于飞船的东西都会被涂成蓝色（世界层）。\n[accent]3.[] 指向核心/存储方块并按 [accent]Y[]（手机上：先点“移动方块”按钮，再点击该方块）。它会变成飞船，并在上面出现一个绿色箭头，即船头。\n[accent]4.[] 在它旁边建造方块：你放置的每个接触飞船的方块都会立即加入飞船。已经放在地面上的方块可用 [accent]Y[] 加入（按住 Y 并拖出方形区域，可一次移动很多个）。\n[accent]5.[] 至少给它装上一个推进器，一个火箭推进器就足够起步。没有推进器时，屏幕顶部会闪烁提示“需要推进器（引擎）！”。\n[accent]6.[] 给需要供应的东西供应：能量推进器要供电，燃料推进器要煤炭/孢子荚/硫化物，炮塔要弹药。\n[accent]7.[] 再次按 [accent]G[]：飞船起飞。按 [accent]Y[]（光标不要放在方块上）进入飞船，并用 [accent]WASD[] 飞行。[accent]Shift+Y[] 让飞船着陆。\n\n未连接到船体的方块会标红，并在你离开建造模式时被移除（会返还一部分资源）。
ycb.guide.layers.title = 层：世界层与飞船层
ycb.guide.layers.text = 每个方块都位于两个层之一。[accent]世界层[]就是普通地图：其方块在建造模式中会被涂成蓝色。[accent]飞船层[]存放飞船的方块（它们在建造模式中带有紫色遮罩）。\n\n[accent]Y[] 会把光标下的方块移到另一层；该方块必须接触飞船。按住 [accent]Y[] 并拖出一个方形区域（类似用 F / B 框选）：区域内的所有方块会同时移动。你起拖的那个方块决定方向：\n- 从世界层方块开始：区域内的世界层方块加入飞船（整座建筑会一次性加入，从飞船向外一链一链地加入）；\n- 从飞船方块开始：区域内的飞船方块离开飞船，变成普通方块（仅靠它们支撑的方块会变红）；\n- 从空格子开始：世界层方块加入；如果没有世界层方块，则飞船方块离开。\n其他队伍的方块和建造中的方块不受影响。选框会显示将要发生的变化：飞船层的颜色表示加入，浅蓝色表示离开。\n\n没有连接到任何东西的核心或存储方块在加入时会成为一艘新飞船。自带核心或存储方块的一组方块是独立的飞船：它不会被移除，而是自行起飞。\n\n在手机上，“移动方块”按钮代替 Y 键：点击一个方块或拖出一个方形区域。
ycb.guide.pc.title = 电脑按键
ycb.guide.pc.text = 电脑上没有按钮面板：一切都靠按键。\n\n[accent]G[] - 开启/关闭建造模式。你驾驶的飞船（否则是离光标最近的那艘）会降落到网格上，朝向上方，并逐格移动。再按一次：起飞。\n[accent]Y[]（建造模式外）- 光标下属于你队伍的方块会切换图层；在其他位置则进入/离开飞船。[accent]V[] 也可离开飞船。\n[accent]Shift+Y[]（建造模式外）- 让飞船着陆，或在已着陆时再次升空（与“着陆/起飞”指令相同）。\n[accent]Y[]（建造模式中）- 在图层之间移动光标下的方块；按住并拖出方形区域可一次移动多个方块。\n[accent]R[]（建造模式中）- 将飞船的船头箭头旋转 90 度（[accent]Shift+R[] 反向）。对于游戏自身可旋转的方块（传送带），R 则旋转该方块。\n[accent]WASD[] - 飞行。默认飞船会转向飞行方向（可在设置中更改）。\n[accent]Q / E[] - 手动将飞船旋转到任意角度。\n[accent]鼠标左键[]（按住）- 所有炮塔转向光标并一同开火。\n[accent]Ctrl + 鼠标左键[] 点击飞船 - 控制它，就像控制任何单位一样。
ycb.guide.phone.title = 手机操作
ycb.guide.phone.text = 在手机上，带按钮的面板位于屏幕左侧。面板上方的箭头可隐藏和显示按钮。\n\n面板上有：建造模式（相当于 G）、进入/离开飞船（相当于 Y）、让飞船着陆/起飞（相当于 Shift+Y）。在建造模式中还会出现两个按钮：[accent]移动方块[]（相当于 Y）和[accent]转动船头[]（相当于 R）。对已着陆的飞船，按钮下方的箭头可逐格移动它。\n\n飞行中的飞船会跟随[accent]屏幕中心[]：用手指拖动地图，飞船就会飞向中心，把船头转向它，平稳减速并停在那里。触碰飞船不会进入飞船，请使用进入按钮。\n\n[accent]移动方块[]：按一次开启（按钮亮起）。点击方块会把它送到另一个图层；拖出的方形区域会移动其中所有方块（起始方块决定方向，与 Y 相同）。开启期间地图不会滚动。再按一次按钮即可结束。\n\n[accent]转动船头[]：将屏幕中心的飞船（否则是你所在的飞船，再否则是最近的已着陆飞船）逆时针旋转 90 度。点四次即转满一圈。
ycb.guide.build.title = 建造模式 (G)
ycb.guide.build.text = 建造模式是创建和修改飞船的地方。\n\n- 飞船降落到网格上，朝向上方，你可以逐格移动它（每秒 8 格）。网格开启，世界层显示为蓝色。\n- 你放置的、接触飞船的方块会立即加入飞船。失去与船体连接的方块会标红，并在退出该模式时被移除（部分资源会返还）。带有自己核心或存储方块的一组方块不会被移除：它会成为一艘独立的飞船。\n- [accent]船头。[] 飞船的每个核心/存储方块都会显示一个绿色箭头，即船头。[accent]R[] 可旋转它（飞船的所有船体同时旋转）。开启“转向行驶方向”驾驶时，飞船会转动，使箭头一侧朝前。没有目标的炮塔朝向船头。退出该模式后，飞船会在原位置起飞；只改变被视为船头的一侧。\n- [accent]自由放置。[] 钻头、泵、热能发电机、抽水机以及其他依赖地面的方块可以放在任何地方：不需要矿石、水或热量。像平常一样选择方块并点击（手机上点按）；花费和耗时都相同。核心中必须至少有该方块所需的每种物品各一个。对粘贴的蓝图同样有效（它们的虚影是白色的）。\n- [accent]粘贴蓝图。[] 方块按任意顺序完工。尚未接触任何东西的已完工方块会以红色等待；一旦某条链接到核心/存储方块，整个蓝图就会成为一艘飞船。\n- 建造中的方块不会移动：请在起飞前完成它们。\n- 推进器和磁铁也可以在建造模式之外放置：它们是地面方块，直到 Y 或建造模式使它们成为飞船的一部分。\n- 如果飞船没有推进器，顶部会显示闪烁的提示。
ycb.guide.landing.title = 着陆与起飞
ycb.guide.landing.text = [accent]Shift+Y[]（电脑）或着陆按钮（手机）可在不进入建造模式的情况下，让你驾驶的飞船或最近的飞船着陆。再按一次可让飞船升空。正在建造模式中编辑的飞船交给 G 处理。\n\n[accent]动画。[] 飞船缓缓下降：它的影子在下方滑动，船头转向上方并滑到精确的格子上；触地时会扬起尘土，就像核心降落在行星上一样（数量和大小取决于飞船的重量和宽度）。起飞则是相反的过程，尘土逐渐扬起。期间飞船无法操控，也不会与其他飞船碰撞。大约需要 1.3 到 8 秒，又重又慢的飞船耗时最长。建造模式 (G) 会立即着陆和升空，没有动画。\n\n如果整艘飞船下方没有空位，它就不会着陆而是继续飞行。着陆的飞船会整体转向最近的一侧（上、右、下、左）：它的方块、炮塔和船头箭头一起转动。\n\n[accent]指令。[] 在命令模式 (RTS) 中，指令面板有[accent]着陆[]和[accent]起飞[]。已着陆的飞船收到移动或攻击指令时，会先升空再出发。玩家的指令优先于自动驾驶。\n\n指令下方的[accent]姿态栏[]中有[accent]禁用飞船控制方块[]（带叉的网格）。开启时，所有选中飞船的飞船控制方块都不发送信号：不运行任何模块，不切换任何处理器，磁铁不会连接任何东西。飞船会停在原地，直到你给它下达指令；钻头和泵的规则依然有效。[accent]采矿[]（适用于带钻头的飞船）的工作方式与独影和幻型相同：勾选指令下的矿石（或自动）。飞船会飞向它存量最少的矿石中最近的空闲矿脉，把钻头放在上面并停留，直到它的存储方块装满；然后悬停在原地。自动不包括沙。它不依赖控制方块。\n\n[accent]着陆点[]方块：带有着陆模块的飞船会自行降落到它上面（见“方块”和“自动驾驶模块”主题）。\n\n[accent]紧急着陆。[] 如果没有任何引擎工作超过半秒（完全没有、没有燃料、没有电力、被关闭），飞船就会坠落：保持其速度，不再转向，并在速度带它去的地方着陆。着陆处的东西会与它的方块交战（见“伤害、坠落的方块与撞击”）。
ycb.guide.thrust.title = 推力、速度与重量
ycb.guide.thrust.text = 推力以[accent]火箭推进器[]计算：一个火箭推进器 = 1。\n\n飞船的[accent]速度[] = 推进器总推力 x 一个火箭推进器的推力（默认每格飞船每秒 45 格，见设置）/ 飞船占据的格数。重量翻倍 = 速度减半。\n\n[accent]转向。[] 更重的飞船转得也更慢：转向速度除以 (1 + 重量 / 60)。60 个方块的飞船转得比微型飞船慢一倍，180 个方块的慢四倍；没有飞船的转向速度低于每秒 6 度。\n\n飞船在空中时引擎一直在工作。飞船[accent]移动[]时，它们耗尽全部电力、燃料和液体；仅[accent]悬停[]（停着或正在下降）时消耗[accent]一半[]，黄色圆圈的闪烁速度减半，喷出的烟也减半；[accent]起飞[]时喷出的烟加倍。已着陆飞船的引擎处于关闭状态。被处理器关闭的推进器不产生推力。没有任何引擎工作时，飞船会紧急着陆。\n\n工作中的推进器在中间显示闪烁的黄色圆圈，并像钻头一样喷烟：火箭推进器每秒一次，能量推进器两次，燃料推进器三次（针对移动中的飞船；悬停和起飞见上文）。\n\n最大的飞船宽约 110 个方块。
ycb.guide.rocket.title = 火箭推进器
ycb.guide.rocket.text = 基础引擎。1x1，推力 1。无需任何条件即可工作。\n\nSerpulo 上的配方：20 铜、10 铅、5 石墨。在其他行星上，由该行星的前 2 种资源制成（见“其他行星与模组”）。\n\n由于不需要燃料和电力，少量火箭推进器是让小型飞船飞起来的最简单方法。大型飞船需要很多个，或更强的引擎：能量推进器（6 个火箭推进器）和燃料推进器（仅靠燃料就相当于 14 到 17 个火箭推进器）。\n\n可在任何模式下放置。在建造模式之外它是普通的地面方块；Y 或建造模式 (G) 会使它成为飞船的一部分。可用处理器关闭（control enabled）。
ycb.guide.energy.title = 能量推进器
ycb.guide.energy.text = 2x2 引擎，推力相当于 [accent]6 个火箭推进器[]。\n\n[accent]电力：[] 飞船移动或起飞时每秒 90 电力单位，仅悬停时 45。电力不足时推力按比例下降；没有电力则无法工作。用飞船上的电池或发电机为它供电。\n\n[accent]液体增幅（可选）。[] 用导管给它输送水或冷冻液：水使推力翻倍（x2 = 12 个火箭推进器），冷冻液为 x2.5（15）。每工作 10 秒消耗 10 单位液体（飞船仅悬停时减半），储罐容量 20，一次只能装一种液体。没有液体时仍可工作，只是更弱。\n\n（电脑上）指向它，面板会显示引擎缺少什么：缺少的电力或液体会用红色划掉，下方写出当前推力。飞行中的飞船会在光标旁显示此面板。\n\n它会随电力亮起。Serpulo 上的配方：100 铜、50 铅、30 硅、20 塑钢。在其他行星上：该行星的前 3 种资源。
ycb.guide.fuel.title = 燃料推进器
ycb.guide.fuel.text = 3x3 引擎，燃烧燃料：每工作 8 秒消耗一个物品（飞船仅悬停时每 16 秒一个）。\n\n[accent]燃料与推力：[] 煤炭 14 个火箭推进器，孢子荚 15，硫化物 17.3。每种最多存放 20 个物品；有多种时，最弱的先烧。用传送带或装卸器给它供料；装卸器也能把燃料从中取出。没有燃料就无法工作。\n\n[accent]液体增幅（可选）：[] 水 x1.25，冷冻液 x3（煤炭 42，孢子荚 45，硫化物 52）。每燃烧一个物品消耗 20 单位液体；储罐容量 120。\n\n[accent]在其他行星和其他模组中[]，任何可燃物品都是燃料，推力为 4 + 10 x 其易燃性（最高 20）。在没有可燃物的地方，使用该行星上最易挥发的资源。\n\nSerpulo 上的配方：300 铜、400 铅、100 石墨、100 塑钢、200 钛。在其他行星上：该行星的前 4 种资源。
ycb.guide.control.title = 飞船控制
ycb.guide.control.text = 飞船的自动驾驶。[accent]逻辑[]标签页中的 2x2 方块。Serpulo 上的配方：50 铜、300 铅、120 硅。\n\n在建造模式中放置它（与推进器相同）；一艘飞船上可以有多个。点击方块上的[accent]铅笔[]：会打开全屏面板，你可以在其中添加[accent]模块[]。模块在“自动驾驶模块”主题中有说明。\n\n自动驾驶只操控飞行中的飞船，以及通过其某个模块着陆的飞船。你自己让它着陆的飞船（G、Shift+Y、着陆按钮）不受管。命令模式的指令（移动、攻击、着陆、起飞）优先于所有模块，手动驾驶飞船时自动驾驶会暂停。\n\n方块的设置（模块、百分比、点位、着陆点列表、计时器）会随飞船、随游戏存档、随蓝图一起保存：复制和粘贴会保留它们。\n\n处理器可以关闭该方块（control enabled）：此时它的模块和规则都不工作。\n\n在别人的服务器上，只有主机（服务器本身）可以设置该方块。
ycb.guide.spot.title = 着陆点
ycb.guide.spot.text = 地面上一个普通的 1x1 方块。Serpulo 上的配方：20 铜、20 铅。请在建造模式[accent]之外[]放置。\n\n单独放着它什么也不做。带有着陆模块的飞船（“资源着陆”，或“着陆”模式的待机点）会飞到它上面着陆：飞船的某个存储方块（核心或容器）必须覆盖这个点。着陆点不会被摧毁：只是在飞船停在那里时被盖住，飞船起飞后恢复。飞船其余部分周围需要有空地；如果有东西挡路，飞船不会着陆而是继续飞行。\n\n上面有飞船、或有飞船正飞向它的着陆点视为已被占用：你队伍的其他飞船会使用其列表中的下一个空闲着陆点。\n\n如果你手动把飞船从着陆点上抬起（起飞指令或驾驶它），它的着陆模块会暂停，在你修改该模块之前不会再把飞船放回去。
ycb.guide.magnet.title = 磁铁
ycb.guide.magnet.text = 1x1 可旋转方块，有正面（红色）和背面（蓝色）。每秒消耗 10 电力单位。Serpulo 上的配方：40 铜、30 硅、20 钛。两种模式下都可放置（在建造模式之外它是地面方块，直到 Y 或 G 使其成为飞船的一部分）。\n\n[accent]吸引。[] 一艘飞船的磁铁会吸引 5 格范围内你队伍[accent]另一艘[]飞船上朝向相反的磁铁（一个的正面朝向另一个磁铁，另一个的正面朝向同一方向：正面对背面）。吸力相当于 3 个火箭推进器，并随距离减弱，在 5 格处降为零。它像引擎一样提供速度（吸力 x 推进器功率 / 飞船格数），因此大飞船几乎不动，小飞船很快就会靠近（不超过每秒 6 格）。每个磁铁各吸引一次：有十个磁铁的飞船所受吸力是十倍。飞船也会转动，各自在重量允许的范围内转动，直到磁铁朝向同一方向，并并排靠在一起。\n\n[accent]连接。[] 当两个配对磁铁相距约 1.5 格、朝向相差在 10 度以内，且方块可以拼合而不重叠时，较轻的飞船会进入较重的飞船：它们成为[accent]一艘飞船[]，只有一个重量，拥有所有引擎的推力。驾驶被并入飞船的人会驾驶整艘飞船。如果方块会重叠，飞船就只是相互抵靠。\n\n[accent]脱离。[] 如果磁铁断电 1/3 秒或其中一个被摧毁，连接就会断开。未与主体相连的方块组会分离成各自的飞船，保持相同的速度。没有引擎的部分会坠落（保持其速度），它的方块作为普通方块留在地面上。\n\n[accent]同极相斥。[] 两个相对（红对红）或背对背（蓝对蓝）的磁铁会以相同的力把各自的飞船推开。它们只推：不转动，也不连接。同一艘飞船的磁铁彼此之间没有作用。\n\n[accent]在地面上。[] 站在地面上且有电的磁铁也会作用于你队伍中带有磁铁的飞行飞船：异极把飞船吸向磁铁并使其与它面对面着陆，同极则把它推开。详见“超级磁铁”主题。
ycb.guide.supermagnet.title = 超级磁铁
ycb.guide.supermagnet.text = 2x2 可旋转方块，有正面（红色）和背面（蓝色）：磁铁的强力兄弟。Serpulo 上的配方：100 巨浪合金、200 石墨、200 铅（在其他行星上为该行星的前 3 种资源）。每秒消耗 500 电力单位。范围 25 格，吸力相当于 100 个火箭推进器（磁铁：5 格和 3 个火箭推进器），即范围 5 倍、吸力 33 倍。被它吸引的飞船速度最高为每秒 12 格（磁铁：6）。\n\n[accent]与其他磁铁。[] 它与超级磁铁和普通磁铁的工作方式相同，规则也相同（异极相吸、同极相斥、飞船连接、脱离：见磁铁）。一对不同的磁铁以两者中更强的吸力和更远的范围工作，电力以获得较少的那个为准。\n\n[accent]在地面上。[] 站在地面上的磁铁（普通磁铁也一样，已着陆飞船上的也一样）并非闲置。它会按相同的极性规则，作用于其范围内你队伍[accent]飞行中[]飞船的磁铁。[accent]同极相斥[]，把飞船推开。[accent]异极把飞船吸向磁铁[]：飞船飞向磁铁，转动直到它的磁铁朝向同一方向，影子像着陆时一样平滑缩小，被完全吸过来后，它的磁铁会与地面上的磁铁[accent]面对面[]着陆（1x1 对 2x2 时靠在它两个格子中的一个上；如果那个位置被占用，就沿着面滑动或使用另一个格子；如果完全没有空位，飞船就留在空中）。作用于飞船的所有磁铁的吸力会叠加，它会停靠到有空位的最强一对上；吸力越强，飞船来得越快。\n\n[accent]何时吸引。[] 只吸引悬停且静止的飞船：没有人驾驶，没有指令或自动驾驶让它去任何地方。吸引一旦开始，飞船就无法操控。只有当它引擎的推力[accent]大于[]作用于它的磁铁的吸力时，它才能脱离吸引（升空后继续飞行），被磁铁吸引着陆的飞船才能起飞。如果磁铁断电或被摧毁，飞船会自行升空。
ycb.guide.builder.title = 蓝图打印机
ycb.guide.builder.text = 一台 [accent]16x16[] 的飞船打印机，须在建造模式之外建造。它绝不会成为飞船的一部分。方块本身的建造时间：6 分钟。Serpulo 上的配方：1000 巨浪合金、2000 石墨、1500 塑钢。\n\n[accent]选择飞船。[] 点击方块下方的铅笔：列表会显示飞船蓝图。蓝图要成为飞船，需满足：不超过 16x16 格，有核心或存储方块，所有方块相互接触，且不含打印机。制作方法：在建造模式 (G) 中把一艘飞船复制为蓝图。不是飞船的蓝图会列在底部并说明原因。\n\n[accent]方向。[] 第二个按钮（铅笔之后）设定打印出的飞船[accent]朝向[]：右、上（与蓝图相同）、左或下。每台新打印机初始使用它自己朝向的一侧（不会复制另一台打印机的设置）。无论你选择什么朝向，飞船总是[accent]驶向[]打印机所朝的一侧（放置前用 R 旋转打印机，地面上的箭头指示出口），并保持所选朝向。\n\n[accent]打印[]类似单位工厂。它需要蓝图所需的物品（每个方块的价格）+ 100 相织布、每秒 3000 电力单位和 240 冷冻液，耗时是玩家建造所有方块所需时间的 1.5 倍。它可容纳每一种液体，最多可取一艘飞船所需量的两倍。橙色轮廓显示进度，打印时三根烟囱会冒烟。\n\n[accent]新飞船[]以所选朝向出现在方块上方的空中，由打印机运往它所朝的一侧，然后遵循它自己的飞船控制方块的模块。[accent]首次飞行。[] 第三个按钮（两个向上的箭头）会打开两个滑块：飞船被运送的方块数（0 到 50，默认 10）和速度（每秒 1 到 10 个方块，默认 2）。飞船会严格按该速度被运送，与其重量或引擎无关。方块数为 0 时，它只是悬停在打印机上方（此时速度为 0，且无法更改）。每个滑块下方是其硫化物价格，两者之间有一个 x：飞船要多花 [accent]方块数 x 速度[] 的硫化物（默认 20）。没有可用引擎的飞船会在运送结束后坠落。“物品预装”“液体装载”和“打印时会合”模块由打印机读取。
ycb.guide.mods.title = 模块如何运作
ycb.guide.mods.text = 飞船控制方块会[accent]从上到下依次[]运行它的模块，然后再从第一个开始（循环）。\n\n模块会一直占用飞船，直到完成或无法工作；然后由下一个接手。当前无事可做的模块（没有钻头、资源都被占用、资源已满）会被跳过。一艘飞船上有多个控制方块时，先建的先运行。命令模式的指令优先于所有模块。\n\n[accent]颜色[]与处理器指令的颜色一致：[#ff6060]红色[] - 获取资源和会合；[#5aa0ff]蓝色[] - 待机；[#ffa040]橙色[] - 打印出的飞船所获得的内容；[#b280ff]紫色[] - 规则；[#5fe070]绿色[] - 处理器；[#40d8d0]青色[] - 旋转中心。每张卡片都用文字显示其状态（等待、取货、飞往点位、完成、暂停……）。\n\n模块通过列表下方的按钮添加，可以移动或删除。如果你手动把飞船从着陆点抬起，该着陆模块会暂停，直到你修改它。被某艘飞船占用的矿石、点位或着陆点，在它是该飞船目标期间对其他飞船关闭。
ycb.guide.modres.title = 资源与资源着陆
ycb.guide.modres.text = [accent]资源[]（红色）。选择地图上存在的矿石、沙子或液体，以及填充百分比（默认 50%，0 到 100）。物品按飞船存储方块（核心、容器）的剩余空间计算，液体按它的储罐和液体容器计算（没有储罐则无法使用液体）。飞船需要能开采该矿石的钻头，或一台泵。\n\n[accent]一个提示还不够。[] 飞船在矿脉上停留 2 秒后，会统计它的钻头（泵）实际采集矿石的格数，并与一条矿脉所允许的最大值比较：它所有钻头和泵对该资源的格数，但不超过矿脉本身所有的（小矿脉按实际计）。如果不到一半，飞船会移到另一个位置，在那里停留 2 秒后再次统计，总共最多 5 个位置（含第一个）。如果没有位置达到一半，它就回到最好的那个并停留。它只尝试钻头覆盖面积会超过目前最好位置的地点，所以可能不到几次就停下。这适用于“资源”模块和“采矿”指令。\n\n飞船会飞向离它的钻头或泵最近的矿脉（而不是离它的中心最近），平稳减速并在那里完全停住：没有推力，不转向，不消耗燃料或电力。如果有东西把它推出一格以上，它会回来。达到百分比后，模块把飞船交给下一个。每条命令之后，都会从飞船当前位置重新选择最近的矿脉。\n\n[accent]每艘飞船有自己的矿石。[] 一艘飞船选中的矿脉，在它是该飞船目标期间，对你队伍的其他飞船关闭（周围有一个圆圈，以免两艘飞船叠在一起）。如果最近的已被占用，就使用下一个空闲的；如果全被占用，卡片会显示“所有矿石/地点都被其他飞船占用”，飞船继续循环。\n\n[accent]资源着陆[]（红色）。一个着陆点列表（使用第一个空闲的）和资源（物品和液体），各带一个百分比。飞船飞往第一个空闲着陆点，着陆并停留，直到每种所列资源都达到其百分比（用传送带、装卸器或手动填充）。然后起飞，并把飞船交给下一个模块。它还会选择着陆的朝向：保持现状、正面朝上/下/左/右，或任何能容纳的朝向。
ycb.guide.modrest.title = 待机点
ycb.guide.modrest.text = [accent]待机点[]（蓝色）指定飞船如何、在哪里待机。\n\n[accent]飞船[]悬停在一个点位上空，或降落在着陆点上。用按钮选择。列表中是地图上的点位（悬停）或着陆点（着陆）；按顺序尝试，使用第一个空闲的，箭头可更改顺序。如果另一艘飞船悬停在那里，或飞往那里时靠得太近以至于两艘飞船会相碰，该点位就被占用。如果没有空闲的，卡片会说明，飞船继续前进。\n\n[accent]当每种所列资源都至少保持在……时待机[] 一个资源列表，每项带一个百分比。其中任何一个低于其百分比时，待机结束，飞船转到下一个模块。如果某种所列资源已经偏低，待机不会开始（飞船会立刻离开）。\n\n[accent]待机计时器（可选）。[] 一个按钮将其开启，一个输入框设置秒数（默认 30，最多 3600）。待机在资源或计时器两者中先到的那个时结束。既没有列表也没有计时器时，待机永不结束。\n\n如果没有其他模块需要这艘飞船，它就停留在待机点。
ycb.guide.modrule.title = 钻头与泵的规则
ycb.guide.modrule.text = [accent]规则[]（紫色）指定飞船的钻头和泵可以采集哪些资源。它不是自动驾驶的任务：可放在列表中的任意位置，顺序无关。\n\n[accent]目标。[] “所有钻头和泵”（默认），或单个方块。从列表中选择（其名称和相对控制方块的偏移）或在地图上点击它。该偏移在飞行中和地面上相同，因此飞船着陆或起飞时规则不会失效。如果该方块不存在了，卡片会显示“未找到方块”。\n\n[accent]模式。[] 白名单：方块只采集所列资源。黑名单：采集除所列资源之外的一切。规则的资源范围：对钻头是它能开采的所有矿石和沙子，对泵是液体；对“全部”则是飞船上任何钻头或泵能采集的一切。\n\n[accent]工作方式。[] 钻头“看不见”被禁止的矿石：下方有两种矿石且其中一种被允许时，即使被禁止的更多，它也会采集被允许的。泵以同样方式选择液体。自动驾驶遵守规则：它只用允许采集该资源的钻头或泵来取得资源；如果全部被禁止，模块会显示“被规则禁止”。\n\n[accent]细节。[] 空列表不会改变任何东西。同一方块的多条规则会全部生效：资源必须通过每一条。白名单只限制它所指的那一类：矿石列表不会妨碍泵，含水和铜的列表则两者都限制。规则在飞船飞行时生效；在地面上钻头是普通方块。
ycb.guide.modcenter.title = 旋转中心
ycb.guide.modcenter.text = [accent]中心[]（青色，是设置而不是任务）设定飞船上一切测量所依据的点：飞船绕它旋转（Q 和 E 键、转向航向、自动驾驶、碰撞、磁铁），它也是飞向目标的那个点。可把该模块放在列表中的任意位置；如果有多个，以先建造的控制方块的第一个为准。\n\n[accent]核心或存储方块。[] 在列表中选择，或在地图上点击。只有飞船有两个或更多核心和存储方块时才有效；只有一个时按钮关闭，卡片会说明需要两个。\n\n[accent]各格平均位置[]（默认）。方块占用的所有格子的平均位置；大方块的每个格子都计入。方块增加或丢失时它会移动。\n\n[accent]所选方块。[] 飞船上的任意方块；在地图上点击它（默认是控制方块本身）。\n\n[accent]工作方式。[] 该点在起飞时确定。之后若发生变化（方块增加或丢失、模块被更改或删除），方块在世界中的位置保持不变，只有该点移动，因此飞船不会跳动。着陆和升空动画期间该点不会变化。没有“中心”模块，或模块无法工作时（没有该方块、只有一个核心），飞船绕其主核心或存储方块旋转。飞船转向着陆时，所选方块的偏移会被保留。飞船停在地面时不使用。
ycb.guide.modjoin.title = 用磁铁连接飞船
ycb.guide.modjoin.text = 两个模块帮助飞船相遇并用磁铁连接（见磁铁方块）。\n\n[accent]会合点[]（红色，自动驾驶的任务）。在地图上选择一个点位和一个以度为单位的[accent]航向[]（0 = 飞船建造时的朝向，逆时针）。飞船飞到该点，转向该航向，并停留到磁铁把它与另一艘飞船连接。连接之后模块完成，飞船接手下一个；如果飞船分开了，它会飞回该点。磁铁吸引它时，它不会抵抗，否则飞船永远无法相遇。\n\n[accent]打印时会合[]（橙色，无设置，由蓝图打印机读取）。由打印机打印出的飞船会飞到打印机把它送往的点位，以打印时的确切航向停在那里，不再移动。如果有什么东西移动了它，它会以确切航向回到该点，直到磁铁把它与另一艘飞船连接。其间自动驾驶的模块不运行。玩家的指令或手动驾驶会结束等待。该等待会随游戏一起保存。\n\n与磁铁配合，这让打印机能够打印大型飞船的各个部分，它们在空中自行组装。
ycb.guide.modmisc.title = 处理器、预装、液体装载
ycb.guide.modmisc.text = [accent]处理器[]（绿色，是设置而不是任务）。选择一个事件：飞船[accent]着陆[]、[accent]起飞[]或[accent]受到伤害[]；选择一个动作：开启、关闭或切换；然后用“+ 处理器”按钮把飞船的处理器加入列表。该动作与处理器自己的指令“control enabled”相同。着陆和起飞每次都会计入，进入或离开建造模式时也一样。伤害每秒检查数次，最多每秒触发两次。建造模式中不监视伤害。多个模块就是多个动作。\n\n处理器还能关闭更多东西：磁铁（无吸力，不耗电）、蓝图打印机（打印停止）、飞船控制方块（其模块和规则不工作）以及每个推进器（无推力，不消耗燃料或电力；全部关闭时飞船会紧急着陆）。\n\n[accent]物品预装[]（橙色，由打印机读取）。所列物品会出现在由蓝图打印机打印出的飞船的存储方块中（优先放入核心）。它们会计入价格：打印机也会消耗它们。放不下的留在打印机里。对手工建造的飞船不起作用。\n\n[accent]液体装载[]（橙色，由打印机读取）。打印出的飞船的储罐会被所选液体按所选的容量比例填满。打印机从它自己的储罐中倒出（给它接上导管），并等到足够为止。
ycb.guide.fly.title = 飞行中：方块、钻头、炮塔
ycb.guide.fly.text = [accent]一切都能工作。[] 传送带运送物品，桥和电线保持连接，装卸器、存储方块、发电机、工厂和炮塔照常工作。着陆的飞船重新成为地图的一部分，在那里按常规方式工作。\n\n[accent]钻头[]开采飞船当前下方的东西：如果钻头的边缘接触到矿石，就会开采它。飞船移动时矿石会即时切换，因此钻头可以放在任何地方（见自由放置）并被带到矿石上方。[accent]泵[]从它们接触的水中抽取液体，并传给相邻的储罐和导管。末端对着空地的导管会把液体漏到飞船下方的地面上。热能发电机、培养机和抽水机读取飞行中飞船下方的地面。\n\n[accent]炮塔如同一门炮。[] 当飞船选定目标（或你自己射击）时，所有炮都会转向它并一同开火。每个炮塔有自己的弹药和转速。瞄准会预判目标，并计入飞船的速度。\n\n[accent]子弹保留飞船的速度。[] 就像单位的子弹一样，飞船火炮的子弹会叠加飞船的速度（激光、闪电以及游戏中不继承速度的其他类型除外）。飞行中的飞船算作空中目标：仅对空的子弹（高射炮弹）可以击中它，仅对地的子弹（火炮、火焰）不能；相织布墙会反弹子弹。\n\n[accent]外观。[] 每个方块都会投下影子。受损的方块会显示裂纹，越严重越深。飞行中的飞船绘制在地图边缘的黑暗和厚墙之上，在那里不会变暗。
ycb.guide.collide.title = 碰撞与重量
ycb.guide.collide.text = 每个被占用的格子重 1，所以一艘 100 个方块的飞船比单个方块重 100 倍。\n\n两艘飞船接触时，会像台球一样交换[accent]动量[]（重量 x 速度）：总动量保持不变，但一部分动能会损失（反弹既不是完全硬也不是完全软，系数 0.25）。它们按重量的反比被推开，所以重的飞船几乎不动，轻的飞船被弹飞。\n\n例子：100 个方块以每秒 1 格的速度，动量为 100，一个方块以每秒 10 格，动量只有 10，因此大飞船继续前进，小飞船被弹回。\n\n接触期间引擎仍在工作：轻的飞船顶着重的飞船无法推动它，而重的飞船可以带着轻的飞船前进。猛烈撞击会迸出火花。玩家的飞船没有优先权：只有重量起决定作用。\n\n飞船在着陆或起飞时不会碰撞。在建造模式中，世界里的方块会像普通方块一样挡住飞船；飞行时地形无关紧要。\n\n更重的飞船转向也更慢（见推力、速度与重量）。
ycb.guide.damage.title = 伤害、坠落的方块与撞击
ycb.guide.damage.text = [accent]伤害。[] 敌方子弹会击中飞船上的具体方块（计入护甲）。当一个支撑着其他方块的方块被摧毁时，所有脱离船体的东西都会坠落。如果所有核心和存储方块都被摧毁，整艘飞船就被摧毁，其余方块坠落。\n\n[accent]坠落的方块。[] 每个脱离的方块组都会变成残骸：保持脱离时飞船的速度和转向，以快 1.5 倍的速度播放着陆动画（没有烟和尘土）并触地。每个方块会对其下方的[accent]敌人[]造成等同于自身生命值的伤害（单位受到至少等于其生命值的伤害时死亡）。然后残骸的所有方块以通常的爆炸方式被摧毁：燃料和易燃物会燃烧，电池会爆裂，液体会洒出。友军不受伤害。建造模式中不会掉落任何东西：那里游离的方块只会变红。\n\n[accent]降落到敌人身上。[] 当飞船降落时（任何着陆，包括 G），每个被方块碰到的敌方地面单位（包括步行单位）都会与碰到它的方块交战。如果这些方块的总生命值多于该单位（生命值 + 护盾），单位死亡，方块们合计损失该单位生命值的 25%（但任何方块都不会低于 1）。否则单位损失的生命值等于方块所拥有的，而方块[accent]碎裂[]（像任何被摧毁的方块一样爆炸）。如果核心或存储方块碎裂，飞船的另一个存储方块会接替它；如果一个都不剩，飞船就散成普通方块。你自己队伍的单位和中立单位不受伤害，只是被挤到最近的空位。\n\n[accent]撞击。[] 没有可用引擎的飞船不会选择地点：它恰好坠落在速度带它去的地方。它撞到的每个建筑，都会与坠落方块的总生命值比较。生命值更多：建筑被摧毁并被取代，方块损失其生命值的 25%。更少或相等：方块碎裂，建筑受到等同于方块生命值的伤害。落在无法建造之处（地图墙、深水、边缘之外）的方块会碎裂。[accent]出怪区。[] 波次开始时，游戏会摧毁你在地面出怪点（红色圆圈）附近的一切。飞行中的飞船在其上方也不安全：此刻位于圆圈内的每个方块都会被撕下，并像任何失去支撑的方块一样坠落（紧急坠落）。被撕下的方块所支撑的东西会随之坠落；如果船体被撕下，整艘飞船都会降落。波次队伍的飞船不受影响。
ycb.guide.fire.title = 火焰与爆炸
ycb.guide.fire.text = 飞行中的飞船有自己的火焰和爆炸，与它下方的地面相联系。着陆的飞船在地图上，那里使用游戏自身的火焰。\n\n[accent]火焰。[] 方块上每个燃烧的格子都有一团火。\n- 它由燃烧弹、内含易燃物（煤炭、石油、孢子……）的被摧毁方块引发，方块下方地面上的火在起飞时会传给飞船（着陆时再传回地面）。\n- 每半秒它会伤害所在的方块（2.5 点伤害 x 火的强度，不计护甲）。没有燃料时大约持续 17 秒。\n- 方块内含易燃物时，火会增强（最高 x4 伤害）并持续更久；没有则会熄灭。\n- 它会蔓延到相邻方块，每 0.75 秒还可能向下掉落：如果下方有地面方块，那里会燃起真正的火。\n- 带有水或其他灭火液体（10 单位或更多）的方块会很快扑灭自己的火。飞船上的波浪炮塔不会自动扑灭它的火。\n一艘飞船最多容纳 400 团火；它们不会被保存。\n\n[accent]爆炸。[] 垂死的方块会按游戏的数值爆炸：取决于内部物品的爆炸性、易燃性和电荷。\n- 冲击波会打击半径内所有飞行飞船的方块，包括它自己的。边缘处伤害为 40%。计入护甲。\n- [accent]电池[]（以及任何带电荷的方块）会放电：伤害 = 电荷 / 25，最高 600；需要电力的方块受到 x1.5。\n- [accent]钍反应堆[]（以及冲击反应堆）会以自己的半径和伤害炸毁周围一切（钍为 19 格和 5000）。只有在带电状态下才会爆炸：燃料 5 或以上，或热量 0.5 或以上，并且规则允许反应堆爆炸。\n- 被摧毁的飞船方块仍会在下方地面上触发游戏自己的爆炸（方块碎裂、火焰、闪电）。死亡的地面方块也会以同样方式打击它上方的飞船。\n爆炸会延迟若干刻连锁发生，就像游戏自己的冲击波一样。会遵守火焰、爆炸伤害和反应堆爆炸的规则。
ycb.guide.units.title = 投影器与单位工厂
ycb.guide.units.text = [accent]修理器和投影器。[] 飞行中飞船上的修理器、修理投影和超速投影作用于[accent]这艘飞船[]的方块，而不是下方的真实方块：修理器治疗受损方块，超速投影加速方块。力墙投影在飞船周围形成它的力场，绘制方式与游戏自带的相同。处理器可以关闭投影器。在着陆的飞船上，方块位于地图上，按常规方式工作。\n\n[accent]单位工厂。[] 飞行中飞船上的单位工厂（和重构工厂）只有在前方的方块接收时才会保留造好的单位：载荷传送带、路由器、质量驱动器等，或能升级这个单位的重构工厂。否则：\n- [accent]空中[]单位会飞出（前方有方块时也一样：它不会再永远留在里面）；\n- [accent]地面、多足或海军[]单位会落到飞船下方的真实地面上：落到它能站立的最近位置（距该点最多 5 格），伴随一阵尘土和飞船的一部分速度。海军单位落在非水面上会死亡，与游戏中一样。\n链条末端的重构工厂在没有可升级之处时，也以同样方式放出单位。单位上限仍然有效：达到上限时单位会在工厂里等待。
ycb.guide.planets.title = 其他行星与模组
ycb.guide.planets.text = [accent]模组的每个方块在每颗行星上都可用[]，包括 Erekir 和其他模组的行星。它们始终已解锁（无需研究），显示在单位标签页（飞船控制方块在逻辑标签页），并且可以放在任何地方，包括太空和水下。\n\n[accent]配方。[] 在 Serpulo 上使用经典配方。在任何其他行星上，方块由该行星资源列表中靠前的资源制成；方块越老，用得越多：\n- 火箭推进器：2 种资源，20 和 10\n- 着陆点：2 种资源，20 和 20\n- 能量推进器：3 种资源，100、50 和 30\n- 飞船控制：3 种资源，50、300 和 120\n- 燃料推进器：4 种资源，300、400、100 和 200\n如果行星的资源更少，就全部使用。蓝图打印机使用该行星的最后一种资源（代替巨浪合金和相织布）和前两种（代替石墨和塑钢）。\n\n[accent]行星的资源列表[]按行星给出的顺序排列：先是它的研究树，逐级排列（仅物品）；然后是为该行星制作的其他资源，按模组声明的顺序；只有行星没有这些时，才使用其他资源。\n\n[accent]燃料。[] 在 Serpulo 上，煤炭、孢子荚和硫化物可燃烧。其他模组中任何易燃性为 0.3 或以上的物品也是燃料，推力为 10 x 易燃性（最高 20）。在没有可燃物的地方（Erekir），该行星上最易挥发的资源会成为燃料。液体增幅仍只由水和冷冻液提供。\n\n每当加载世界或区域，以及游戏的行星改变时，配方都会重新计算。
ycb.guide.multi.title = 多人游戏
ycb.guide.multi.text = 该模组可用于单人游戏、主机玩家和专用服务器。[accent]服务器和每个客户端都需要安装同一版本的模组。[]\n\n[accent]工作方式。[] 服务器完成飞船的全部工作：飞行、着陆和起飞、伤害、火焰、自动驾驶、指令。客户端不运行飞船逻辑；它保存每艘飞船的副本并绘制它。飞行、带尘土的起飞和着陆动画、炮塔瞄准、引擎运转、伤害、火焰、射击和爆炸都会同步。\n\n[accent]客户端可以[]驾驶飞船（Y、Shift+Y 或 Ctrl + 点击），给它下达命令模式的指令（移动、着陆、起飞），并使用 G 和 Y。只有主机（服务器本身）可以设置飞船控制方块和蓝图打印机。\n\n[accent]建造模式是本地的。[] G 只对你开启：你选中的飞船（你所在的那艘，否则是光标下的，再否则是最近的）会着陆，其他的继续飞行。[accent]紫色遮罩[]是飞船层；所有玩家都能看到带遮罩的格子，而有人正在编辑的飞船遮罩更亮且闪烁。你在 G 中放置的方块在别人看来是紫色的，直到你退出。退出 G 只会升空已没有编辑者的飞船；已着陆（停放）的飞船留在地面上。\n\n[accent]保存。[] 飞船保存在存档文件中它们自己的一个数据块里，因此即使是大型基地也能保存而不出现“encoded string too long”错误。旧存档同样可以加载。
ycb.guide.settings.title = 设置、限制与技巧
ycb.guide.settings.text = [accent]设置[]（设置中该模组的页面）：\n- 一个火箭推进器的推力：默认每格飞船每秒 45 格。每艘飞船的速度都取决于它。\n- 让飞行中的飞船转向行驶方向：默认开启。\n- YCB 指南按钮。\n\n[accent]限制。[]\n- 一艘飞船宽度最多约 110 个方块。\n- 建造中的方块不会移动：请在起飞前完成它们。\n- 自由放置只在建造模式中有效，且只适用于游戏会检查地形的方块（钻头、泵、热能发电机等）。核心中必须至少有每种所需物品各一个。\n- 退出建造模式时被切断并移除的存储方块中的物品会丢失。\n- 地面敌人通过地图寻找通往核心的路：核心飞行时，它们无法这样找到它。任何看到飞船并能对空射击的敌人都可以攻击它。\n- 自动驾驶让位于命令模式的指令。通过模块着陆需要整艘飞船下方都有空位。着陆或起飞期间无法操控飞船，指令也无效。\n- 推进器在转向时不会镜像。\n- 敌人瞄准飞行中飞船的中心，而不是单个方块。激光、闪电和能量场（龙王、玄武）不会伤害它的方块，敌方的差扰也无法牵引它。\n- 飞船飞行时，等离子钻机和墙壁粉碎机不会开采墙壁。\n\n[accent]技巧。[]\n- 在建造模式中把飞船复制为蓝图：打印机可以打印它，其控制方块的模块也会随之带上。\n- 在你的钻头附近放置着陆点，并给飞船一个“资源着陆”模块：它会自己取货和卸货。\n- 一艘飞船上的多个磁铁吸力更强；把它们放在面向对方的一侧。\n- 如果飞船无法起飞，请查看屏幕顶部的推进器提示，并检查燃料和电力。
