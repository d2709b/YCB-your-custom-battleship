block.your-custom-battleship-ship-builder.name = Schematic Builder
block.your-custom-battleship-ship-builder.description = A 16x16 printer of ships. Press the pencil under the block and pick a ship schematic: only schematics up to 16x16 tiles with a core or storage whose blocks all touch each other are listed. Rotate the block (R) before it is placed: the arrows on the floor show where the finished ship leaves (always the side the builder faces; the ship keeps the heading chosen with the direction button). It prints like a unit factory: it needs the items of the schematic (the cost of building every block) + 100 phase fabric, 3000 power units per second and 240 cryofluid per second; printing takes 1.5 times the time a player needs to build all its blocks. The three chimneys burn while it prints. The finished ship flies a little way forward and then follows the orders of its ship control block. Cannot be placed in the flying ship build mode and never becomes a part of a ship. The recipe depends on the planet: on Serpulo surge alloy, graphite and plastanium; on another planet the last resource of the planet by id (instead of surge alloy and phase fabric) and its first two resources (instead of graphite and plastanium). It holds every kind of liquid. A ship control block of the schematic may ask for a preload of items (added to the price, they appear in the storage of the new ship) and a liquid load (poured from the builder's tanks into the tanks of the new ship).
