ycb.guide.idea.title = What is a flying ship
ycb.guide.idea.text = A flying ship is a unit built from blocks. Its hull is a [accent]core[] or a [accent]storage / container[]. Every block attached to the hull (side to side, also through other blocks) becomes a part of the ship.\n\nWhile it flies, the ship is not on the tile grid: conveyors, wires and turrets of the world do not see it and do not touch it. It interacts only with other ships, enemies and bullets. It moves and turns to [accent]any angle[], not cell by cell, and every block of it keeps working in flight: conveyors move items, drills mine, factories produce, generators give power, turrets shoot. Every block casts a shadow on the ground, like a flying unit.\n\nOnly what you made a ship is a ship. An ordinary core standing on the map is not one until you press [accent]Y[] on it in the build mode ([accent]G[]) or build a hull there.\n\nA ship needs [accent]boosters[] (engines): without them it does not fly. Speed = total thrust of the boosters x power of one rocket booster / number of blocks of the ship, so the heavier the ship, the slower it is.
ycb.guide.first.title = Your first ship, step by step
ycb.guide.first.text = [accent]1.[] Place a core or a storage / container on the ground (or use one you already have).\n[accent]2.[] Press [accent]G[] (on a phone: the build button). The build mode is on: the grid is shown and everything that is not a part of a ship is painted blue (the world layer).\n[accent]3.[] Point at the core / storage and press [accent]Y[] (on a phone: the Move blocks button, then tap it). It becomes a ship, and a green arrow, its front, appears on it.\n[accent]4.[] Build blocks next to it: every block you place that touches the ship joins it at once. Blocks that already stand on the ground join with [accent]Y[] (hold Y and drag a square to move many at once).\n[accent]5.[] Put at least one booster on it, a rocket booster is enough to start. Without boosters a blinking hint "Boosters (engines) are needed!" is shown at the top of the screen.\n[accent]6.[] Feed what needs feeding: power for energy boosters, coal / spore pods / pyratite for fuel boosters, ammo for turrets.\n[accent]7.[] Press [accent]G[] again: the ship takes off. Press [accent]Y[] (with the cursor away from blocks) to enter it and fly with [accent]WASD[]. [accent]Shift+Y[] lands it.\n\nBlocks that are not attached to the hull are marked red and are removed when you leave the build mode (part of the resources comes back).
ycb.guide.layers.title = Layers: world and ship
ycb.guide.layers.text = Every block is on one of two layers. The [accent]world layer[] is the ordinary map: its blocks are painted blue in the build mode. The [accent]ship layer[] holds the blocks of ships (they carry a violet mask in the build mode).\n\n[accent]Y[] moves the block under the cursor to the other layer; the block has to touch the ship. Hold [accent]Y[] and drag a square (like the selection with F / B): all blocks in the square move at once. The block you start on sets the direction:\n- start on a world block: the world blocks in the square join the ship (a whole building joins at once, chain by chain from the ship outwards);\n- start on a ship block: the ship blocks in the square leave the ship and become ordinary blocks (blocks that were held only by them turn red);\n- start on an empty tile: world blocks join; if there are none, ship blocks leave.\nBlocks of other teams and blocks under construction are not touched. The frame shows what will change: the colour of the ship layer joins, light blue leaves.\n\nA core or storage that is not attached to anything becomes a new ship when it joins. A group of blocks with a core or storage of its own is a separate ship: it is not removed, it takes off on its own.\n\nOn a phone the Move blocks button takes the place of the Y key: tap a block or drag a square.
ycb.guide.pc.title = Keys on PC
ycb.guide.pc.text = There is no button panel on PC: everything is on the keys.\n\n[accent]G[] - build mode on / off. The ship you drive (else the one nearest to the cursor) lands on the grid, faces up and moves cell by cell. Press again: it takes off.\n[accent]Y[] outside the build mode - a block of your team under the cursor changes its layer; anywhere else you enter / leave a ship. [accent]V[] also leaves a ship.\n[accent]Shift+Y[] outside the build mode - land the ship, or lift it again if it is landed (the same as the Land / Take off orders).\n[accent]Y[] in the build mode - move the block under the cursor between the layers; hold it and drag a square to move many blocks.\n[accent]R[] in the build mode - turn the front arrow of the ship by 90 degrees ([accent]Shift+R[] the other way). On a block that the game can rotate itself (a conveyor) R turns the block instead.\n[accent]WASD[] - fly. By default the ship turns towards the direction of flight (a setting).\n[accent]Q / E[] - turn the ship by hand to any angle.\n[accent]Left mouse button[] (hold) - all turrets turn to the cursor and fire together.\n[accent]Ctrl + left mouse button[] on a ship - take control of it, like of any unit.
ycb.guide.phone.title = Phone controls
ycb.guide.phone.text = On a phone the panel with the buttons is on the left of the screen. The arrow on top of it hides and shows the buttons.\n\nThe panel has: the build mode (like G), enter / leave a ship (like Y), park / lift the ship (like Shift+Y). In the build mode two more appear: [accent]Move blocks[] (like Y) and [accent]Turn the front[] (like R). For a landed ship the arrows under the buttons move it cell by cell.\n\nA flying ship follows the [accent]centre of the screen[]: drag the map with a finger and the ship flies after the centre, turns its front to it, slows down smoothly and stops there. Touching a ship does not enter it, use the enter button.\n\n[accent]Move blocks[]: press it once to switch on (it is lit). A tap on a block sends it to the other layer; a dragged square moves all the blocks in it (the block you start on sets the direction, as with Y). While it is on the map does not scroll. Press the button again to finish.\n\n[accent]Turn the front[]: turns the ship in the centre of the screen (else the one you are in, else the nearest landed one) by 90 degrees counter-clockwise. Four taps are a full circle.
ycb.guide.build.title = Build mode (G)
ycb.guide.build.text = The build mode is where you make and change ships.\n\n- The ship lands on the grid, faces up and you move it cell by cell (8 cells per second). The grid is on, the world layer is blue.\n- Blocks you place that touch the ship join it at once. A block that lost its hold on the hull is marked red and is removed when you leave the mode (resources partly come back). A group of blocks with a core or storage of its own is not removed: it becomes a ship of its own.\n- [accent]Front.[] Every core / storage of a ship shows a green arrow, the front. [accent]R[] turns it (all hulls of the ship at once). When you drive with "turn towards the direction" on, the ship turns so that the arrow side looks forward. Turrets with no target look to the front. After the mode the ship takes off in the same position; only the side that counts as the front changes.\n- [accent]Free placement.[] Drills, pumps, thermal generators, water extractors and other blocks tied to the ground can be placed anywhere: no ore, water or heat is needed. Choose the block and click (tap on a phone) as usual; it costs the same and takes the same time. The core must hold at least one of every item the block needs. Works for pasted schematics too (their ghosts are white).\n- [accent]Pasting a schematic.[] The blocks are finished in any order. Finished blocks that touch nothing yet wait in red; as soon as a chain reaches a core / storage, the whole schematic becomes one ship.\n- Blocks under construction do not move: finish them before take-off.\n- Boosters and magnets can also be placed outside the build mode: they are ground blocks until Y or the build mode makes them a part of the ship.\n- If a ship has no boosters, a blinking hint is shown at the top.
ycb.guide.landing.title = Landing and take-off
ycb.guide.landing.text = [accent]Shift+Y[] (PC) or the Park button (phone) lands the ship you drive, or the nearest one, without the build mode. Press it again to lift the ship. A ship that is being edited in the build mode is left to G.\n\n[accent]The animation.[] The ship comes down slowly: its shadow slides under it, it turns front up and slides to the exact cells; at the touchdown clouds of dust come out, like from a core landing on a planet (their number and size depend on the weight and width of the ship). Take-off is the same backwards, the dust comes gradually. The ship cannot be steered meanwhile, and it does not collide with other ships. It takes from about 1.3 to 8 seconds, a heavy and slow ship takes longest. The build mode (G) lands and lifts at once, without the animation.\n\nIf there is no free place under the whole ship, it does not land and keeps flying. A ship that lands turns as a whole to the nearest side (up, right, down, left): its blocks, turrets and front arrow turn with it.\n\n[accent]Orders.[] In the command mode (RTS) the command panel has [accent]Land[] and [accent]Take off[]. A landed ship given a move or attack order first rises, then goes. The orders of the player come before the autopilot.\n\n[accent]The row of stances[] under the orders has [accent]Disable the ship control block[] (the grid crossed out). While it is on, the ship control blocks of all the selected ships send no signals: no modules run, no processors are switched, nothing is joined by magnets. The ship stays where it is until you order it somewhere; the rules for drills and pumps stay. [accent]Mine[] (for ships that have a drill) works like for mono and poly: tick the ores under the order (or Auto). The ship flies to the nearest free vein of the ore it has least of, puts its drill on it and stays until its storages are full; then it hangs where it is. Auto leaves out sand. It does not depend on the control blocks.\n\n[accent]Landing spot[] block: a ship with a landing module lands on it by itself (see the Blocks and Autopilot themes).\n\n[accent]Emergency landing.[] If no engine works for more than half a second (none at all, no fuel, no power, switched off), the ship falls: it keeps its speed, steers nowhere and lands where the speed carries it. What it lands on fights its blocks (see Damage, falling blocks and crashes).
ycb.guide.thrust.title = Thrust, speed and weight
ycb.guide.thrust.text = Thrust is counted in [accent]rocket boosters[]: one rocket booster = 1.\n\n[accent]Speed[] of a ship = total thrust of its boosters x the thrust of one rocket booster (45 tiles per second per tile of the ship by default, see Settings) / the number of tiles the ship occupies. Twice as heavy = twice as slow.\n\n[accent]Turning.[] A heavier ship also turns slower: the turn rate is divided by (1 + weight / 60). A ship of 60 blocks turns twice as slowly as a tiny one, 180 blocks four times; no ship turns slower than 6 degrees per second.\n\nThe engines work all the time the ship is in the air. While it [accent]moves[] they use all their power, fuel and liquid; while it only [accent]hovers[] (stands, or comes down) they use [accent]half[], the yellow circle blinks twice as slowly and they puff half as much smoke; while it [accent]takes off[] they puff twice as much. The engines of a landed ship are off. A booster that you switched off with a processor gives no thrust. When none of the engines works, the ship comes down in an emergency landing.\n\nA working booster shows a blinking yellow circle in the middle and puffs smoke like a drill: the rocket booster once a second, the energy booster twice, the fuel booster three times (a ship that moves; see above for hovering and take-off).\n\nThe biggest ship is about 110 blocks across.
ycb.guide.rocket.title = Rocket Booster
ycb.guide.rocket.text = The basic engine. 1x1, thrust 1. It needs nothing to work.\n\nRecipe on Serpulo: 20 copper, 10 lead, 5 graphite. On other planets it is made of the first 2 resources of the planet (see Other planets and mods).\n\nBecause it needs no fuel and no power, a few rocket boosters are the simplest way to make a small ship fly. For a big ship you need many of them or the stronger engines: the energy booster (6 rocket boosters) and the fuel booster (14 to 17 rocket boosters on fuel alone).\n\nIt can be placed in any mode. Outside the build mode it is an ordinary ground block; Y or the build mode (G) makes it a part of the ship. It can be switched off with a processor (control enabled).
ycb.guide.energy.title = Energy Booster
ycb.guide.energy.text = A 2x2 engine with the thrust of [accent]6 rocket boosters[].\n\n[accent]Power:[] 90 power units per second while the ship moves or takes off, 45 while it only hovers. With a lack of power the thrust drops in proportion; with no power it does not work. Give it power from batteries or generators of the ship.\n\n[accent]Liquid boost (optional).[] Feed it water or cryofluid with conduits: water doubles the thrust (x2 = 12 rocket boosters), cryofluid gives x2.5 (15). It uses 10 liquid units per 10 seconds of work (half of that while the ship only hovers), and the tank holds 20, one liquid at a time. Without the liquid it still works, only weaker.\n\nPoint at it (PC) and the panel shows what the engine lacks: the missing power or liquid is crossed out in red, and the current thrust is written below. A flying ship shows this panel next to the cursor.\n\nIt lights up with its power. Recipe on Serpulo: 100 copper, 50 lead, 30 silicon, 20 plastanium. On other planets: the first 3 resources of the planet.
ycb.guide.fuel.title = Fuel Booster
ycb.guide.fuel.text = A 3x3 engine that burns fuel: one item per 8 seconds of work (one per 16 seconds while the ship only hovers).\n\n[accent]Fuel and thrust:[] coal 14 rocket boosters, spore pods 15, pyratite 17.3. It holds up to 20 items of each kind; when it has several kinds, the weakest burns first. Feed it with conveyors or unloaders; an unloader can also take fuel out of it. Without fuel it does not work.\n\n[accent]Liquid boost (optional):[] water x1.25, cryofluid x3 (coal 42, spore pods 45, pyratite 52). 20 liquid units are used per burnt item; the tank holds 120.\n\n[accent]On other planets and with other mods[] any flammable item is a fuel, with thrust 4 + 10 x its flammability (at most 20). Where nothing burns, the most volatile resources of the planet are used.\n\nRecipe on Serpulo: 300 copper, 400 lead, 100 graphite, 100 plastanium, 200 titanium. On other planets: the first 4 resources of the planet.
ycb.guide.control.title = Ship Control
ycb.guide.control.text = The autopilot of a ship. A 2x2 block in the [accent]Logic[] tab. Recipe on Serpulo: 50 copper, 300 lead, 120 silicon.\n\nPlace it in the build mode (like the boosters); several can sit on one ship. Press the [accent]pencil[] on the block: a full-screen panel opens where you add [accent]modules[]. The modules are described in the theme "Autopilot modules".\n\nThe autopilot steers only a flying ship and a ship that landed by one of its modules. A ship that you landed yourself (G, Shift+Y, the Park button) is left alone. The orders of the command mode (move, attack, land, take off) come before all modules, and driving the ship by hand stops the autopilot while you drive.\n\nThe settings of the block (modules, percents, points, lists of spots, timers) are saved with the ship, with the save of the game, and with schematics: copying and pasting keeps them.\n\nA processor can switch the block off (control enabled): its modules and rules do not work then.\n\nOn someone else's server only the host (the server itself) can set the block up.
ycb.guide.spot.title = Landing Spot
ycb.guide.spot.text = A plain 1x1 block on the ground. Recipe on Serpulo: 20 copper, 20 lead. Place it [accent]outside[] the build mode.\n\nAlone it does nothing. A ship with a landing module (Landing for resources, or Rest point in the "lands" mode) flies onto it and lands: one of the storages of the ship (the core or a container) has to cover the spot. The spot is not destroyed: it is only covered while the ship stands there and comes back when the ship takes off. The rest of the ship needs free ground around it; if something is in the way the ship does not land and flies on.\n\nA spot with a ship on it, or with a ship flying to it, is taken: other ships of your team use the next free spot of their list.\n\nIf you lift a ship from its spot by hand (the Take off order or driving it), its landing module is paused and does not put the ship back until you change the module.
ycb.guide.magnet.title = Magnet
ycb.guide.magnet.text = A 1x1 rotatable block with a front (red) and a back (blue). It uses 10 power units per second. Recipe on Serpulo: 40 copper, 30 silicon, 20 titanium. Can be placed in both modes (outside the build mode it is a ground block until Y or G makes it a part of a ship).\n\n[accent]Pull.[] A magnet of one ship pulls the magnets of [accent]another[] ship of your team within 5 tiles that are turned the other way (the front of one looks at the other magnet and the front of the other looks the same way: front to back). The pull is as strong as 3 rocket boosters and gets weaker with the distance, to zero at 5 tiles. It gives speed the way engines do (pull x booster power / tiles of the ship), so a big ship hardly moves, a small one comes quickly (not faster than 6 tiles per second). Every magnet pulls once: a ship with ten magnets is pulled ten times as hard. The ships also turn, each as far as its weight allows, until the magnets look the same way, and come side by side.\n\n[accent]Joining.[] When two partner magnets are about 1.5 tiles apart, look the same way within 10 degrees and the blocks can be put together without overlapping, the lighter ship enters the heavier one: they become [accent]ONE ship[], with one weight and the thrust of all engines. Whoever drove the entered ship drives the whole one. If blocks would overlap, the ships just stand against each other.\n\n[accent]Letting go.[] If the magnets lose power for 1/3 of a second or one is destroyed, the bond breaks. The groups of blocks that are not tied to the main one separate into ships of their own with the same speed. A part with no engine left falls (it keeps its speed) and its blocks stay on the ground as ordinary blocks.\n\n[accent]Like poles push.[] Two magnets that look at each other (red to red) or turn their backs (blue to blue) push their ships apart with the same force. They only push: no turning and no joining. Magnets of the same ship do nothing to each other.\n\n[accent]On the ground.[] A powered magnet that stands on the ground also works on flying ships of your team that have magnets: unlike poles draw the ship to the magnet and land it face to face with it, like poles push it away. Read about it in the Super magnet theme.
ycb.guide.supermagnet.title = Super magnet
ycb.guide.supermagnet.text = A 2x2 rotatable block with a front (red) and a back (blue): the strong brother of the Magnet. Recipe on Serpulo: 100 surge alloy, 200 graphite, 200 lead (on another planet the first 3 resources of the planet). It uses 500 power units per second. Range 25 tiles, pull as strong as 100 rocket boosters (the Magnet: 5 tiles and 3 rocket boosters), so 5 times the range and 33 times the pull. A ship pulled by it goes up to 12 tiles per second (the Magnet: 6).\n\n[accent]With other magnets.[] It works with super magnets and with plain magnets alike, by the same rules (unlike poles pull, like poles push, joining of the ships, letting go: see the Magnet). A pair of different magnets works with the stronger pull and the longer range of the two, and with the power of the one that gets less.\n\n[accent]On the ground.[] A magnet that stands on the ground (a plain one too, also one of a landed ship) is not idle. It works on the magnets of the [accent]flying[] ships of your team in its range, by the same rules of the poles. [accent]Like poles push[] the ship away. [accent]Unlike poles draw it to the magnet[]: the ship flies to the magnet, turns until its magnet looks the same way, its shadow shrinks smoothly like in a landing, and when it has been drawn all the way it lands with its magnet [accent]face to face[] with the magnet on the ground (a 1x1 against a 2x2 sits against one of its two cells; if that place is taken it slides along the face or takes the other cell; if there is no room at all, the ship stays up). The pull of all the magnets that act on the ship adds up and the strongest pair with room is the one it docks to; the stronger the pull, the faster the ship comes.\n\n[accent]When it pulls.[] Only a ship that hovers and stands still: nobody drives it, no order or autopilot sends it anywhere. Once the pull has begun the ship cannot be steered. It can leave the pull (it rises and flies on), and a ship that was landed by it can take off, only when the thrust of its engines is [accent]greater[] than the pull of the magnets that act on it. If the magnets lose power or are destroyed, the ship rises by itself.
ycb.guide.builder.title = Schematic Builder
ycb.guide.builder.text = A [accent]16x16[] printer of ships, built outside the build mode. It never becomes a part of a ship. Build time of the block itself: 6 minutes. Recipe on Serpulo: 1000 surge alloy, 2000 graphite, 1500 plastanium.\n\n[accent]Choosing a ship.[] Press the pencil under the block: the list shows the ship schematics. A schematic is a ship if it is up to 16x16 tiles, has a core or storage, all its blocks touch each other, and it holds no builder. To make one: copy a ship in the build mode (G) as a schematic. Schematics that are not ships are listed at the bottom with the reason.\n\n[accent]Direction.[] The second button (after the pencil) sets which way the printed ship [accent]faces[]: right, up (as in the schematic), left or down. Every new builder starts with the side it faces itself (it does not copy the setting of another builder). The ship always [accent]leaves[] to the side the builder faces (turn the builder with R before placing, the arrows on the floor show the exit), whatever heading you choose, and it keeps the chosen heading.\n\n[accent]Printing[] is like a unit factory. It needs the items of the schematic (the price of every block) + 100 phase fabric, 3000 power units and 240 cryofluid per second, and takes 1.5 times as long as a player needs to build all the blocks. It holds every kind of liquid and takes up to twice what one ship needs. An orange silhouette shows the progress, and the three chimneys burn while it prints.\n\n[accent]The new ship[] appears in the air above the block with the chosen heading, is carried by the builder to the side it faces and then follows the modules of its ship control block. [accent]First flight.[] The third button (two arrows up) opens two sliders: the number of blocks the ship is carried (0 to 50, 10 by default) and the speed (1 to 10 blocks a second, 2 by default). The ship is carried at exactly that speed, whatever its weight or its engines. With 0 blocks it just hangs over the builder (the speed is then 0 and cannot be changed). Under each slider is its price in pyratite, with an x between them: the ship costs [accent]blocks x speed[] pyratite more (20 by default). A ship with no working engine falls when the carrying is over. The modules Preload of items, Liquid load and Join at crafting are read by the builder.
ycb.guide.mods.title = How modules work
ycb.guide.mods.text = The Ship Control block runs its modules [accent]one after another from the top down, then again from the first[] (a circle).\n\nA module keeps the ship until it is done or cannot work; then the next one gets it. A module that can do nothing now (no drill, everything taken, the resource is already full) is skipped. With several control blocks on a ship, the one built first goes first. The orders of the command mode come before all modules.\n\n[accent]Colours[] are those of the instructions of a processor: [#ff6060]red[] - getting resources and joining; [#5aa0ff]blue[] - rest; [#ffa040]orange[] - what a printed ship gets; [#b280ff]purple[] - rules; [#5fe070]green[] - processors; [#40d8d0]teal[] - the center of rotation. Every card shows its status in words (waiting, fetching, flying to the point, done, paused...).\n\nModules are added with the buttons under the list and can be moved or removed. If you lift the ship from a landing spot by hand, that landing module is paused until you change it. An ore, a point or a landing spot that one ship has taken is closed to the other ships while it is its target.
ycb.guide.modres.title = Resource and Landing for resources
ycb.guide.modres.text = [accent]Resource[] (red). Choose an ore, sand or a liquid that is on the map and a fill percent (50% by default, 0 to 100). Items are counted against the room of the storages of the ship (core, containers), liquids against its tanks and liquid containers (with no tank the liquid is not available). The ship needs a drill that can mine that ore, or a pump.\n\n[accent]A tip is not enough.[] After the ship has stood 2 seconds at its vein, it counts the tiles its drills (pumps) really take the ore from, and compares them with the most that one vein allows: the tiles of all its drills and pumps for that resource, but not more than the vein has (a small vein is counted as it is). If it is less than half, the ship moves to another place, stands there 2 seconds and counts again, at most 5 places in all (the first one included). If no place reaches half, it goes back to the best one and stays there. It tries only places where its drills would cover more than the best one so far, so it may stop after fewer tries. This holds for the Resource module and for the order Mine.\n\nThe ship flies to the vein nearest to its drill or pump (not to its centre), slows down smoothly and stops dead there: no thrust, no turning, no fuel or energy spent. If something pushes it more than a cell away, it comes back. When the percent is reached, the module gives the ship to the next one. After every command the nearest vein is chosen again from where the ship is now.\n\n[accent]Every ship has its own ore.[] A vein that a ship chose is closed to the other ships of your team (a circle around it, so that two ships do not end up on each other) while it is its target. If the nearest is taken, the next free one is used; if all are taken the card says "All ores / places are taken by other ships" and the ship goes on in the circle.\n\n[accent]Landing for resources[] (red). A list of landing spots (the first free one is used) and the resources, items and liquids, each with a percent. The ship flies to the first free spot, lands and stays until every listed resource reaches its percent (fill it by conveyor, unloader or by hand). Then it takes off and gives the ship to the next module. It also chooses the side to land on: as it is, front up / down / left / right, or any that fits.
ycb.guide.modrest.title = Rest point
ycb.guide.modrest.text = [accent]Rest point[] (blue) says how and where the ship rests.\n\n[accent]The ship[] hovers over a point, or lands on a landing spot. Choose with the button. The list holds points on the map (hover) or landing spots (land); they are tried in order, the first free one is used, the arrows change the order. A point is taken if another ship hangs there or flies to it so close that the ships would touch. If none is free the card says so and the ship goes on.\n\n[accent]Rest while every listed resource holds at least...[] A list of resources with a percent each. When any of them falls below its percent, the rest ends and the ship goes to the next module. The rest does not start while a listed resource is already low (the ship would leave at once).\n\n[accent]Rest timer (optional).[] A button switches it on and a field sets the seconds (30 by default, up to 3600). The rest ends by whichever comes first, the resource or the timer. With neither a list nor a timer the rest never ends.\n\nIf no other module wants the ship, it stays at the rest point.
ycb.guide.modrule.title = Rules for drills and pumps
ycb.guide.modrule.text = [accent]Rule[] (purple) says which resources the drills and pumps of the ship may take. It is not a task of the autopilot: put it anywhere in the list, the order does not matter.\n\n[accent]Target.[] "All drills and pumps" (the default), or one block. Choose it from the list (its name and the offset from the control block) or tap it on the map. The offset is the same in flight and on the ground, so the rule does not break when the ship lands or takes off. If the block is gone, the card says "Block not found".\n\n[accent]Mode.[] Whitelist: the block takes only the listed resources. Blacklist: it takes everything except the listed ones. Resources of a rule: for a drill the ores and sand it can mine at all, for a pump the liquids; for "all" everything that any drill or pump of the ship can take.\n\n[accent]How it works.[] The drill "does not see" a forbidden ore: with two ores under it and one allowed, it takes the allowed one even if there is more of the forbidden one. A pump chooses its liquid the same way. The autopilot respects the rules: it fetches a resource only with a drill or pump that may take it; if all are forbidden the module says "Forbidden by a rule".\n\n[accent]Details.[] An empty list changes nothing. Several rules for one block all apply: a resource has to pass each of them. A whitelist limits only the kind it names: a list of ores does not hinder pumps, a list with water and copper limits both. The rules work while the ship flies; on the ground the drills are ordinary blocks.
ycb.guide.modcenter.title = Center of rotation
ycb.guide.modcenter.text = [accent]Center[] (teal, a setting, not a task) sets the point of the ship that everything is measured from: the ship turns around it (keys Q and E, turning toward the heading, the autopilot, collisions, magnets) and it is the point that flies to a target. Put the module anywhere in the list; if there are several, the first one of the control block built first counts.\n\n[accent]Core or storage.[] Choose which one in the list or by a tap on the map. It works only if the ship has two or more cores and storages; with one the button is off and the card says that two are needed.\n\n[accent]Mean of cells[] (the default). The mean position of all the cells that the blocks occupy; a big block counts with every cell of it. It moves when blocks are added or lost.\n\n[accent]Chosen block.[] Any block of the ship; tap it on the map (the control block itself by default).\n\n[accent]How it works.[] The point is set at takeoff. When it changes later (a block is added or lost, the module is changed or removed), the blocks stay where they are in the world and only the point moves, so the ship does not jump. During landing and lift animations the point does not change. Without a Center module, or when the module cannot work (no such block, one core only), the ship turns around its main core or storage. The offset of the chosen block is kept when the ship lands turned. Not used while the ship stands on the ground.
ycb.guide.modjoin.title = Joining ships by magnets
ycb.guide.modjoin.text = Two modules help ships meet and join with magnets (see the Magnet block).\n\n[accent]Join point[] (red, a task of the autopilot). Choose a point on the map and a [accent]heading[] in degrees (0 = the way the ship was built, counter-clockwise). The ship flies to the point, turns to the heading and stays there until magnets join it with another ship. After the joining the module is done and the ship takes the next one; if the ships part, it flies back to the point. While magnets pull it, it does not hold back, otherwise the ships could never meet.\n\n[accent]Join at crafting[] (orange, no settings, read by the Schematic Builder). A ship printed by the builder flies to the point where the builder sent it, stands there with exactly the heading it was printed with and does not move. If something moves it, it comes back to the point with the exact heading, until magnets join it with another ship. The modules of the autopilot do not run meanwhile. An order of the player or driving it by hand ends the waiting. The waiting is saved with the game.\n\nTogether with magnets, this lets the builder print the parts of a big ship that assemble themselves in the air.
ycb.guide.modmisc.title = Processors, preload, liquid load
ycb.guide.modmisc.text = [accent]Processors[] (green, a setting, not a task). Choose an event: the ship [accent]lands[], [accent]takes off[] or [accent]is damaged[]; choose an action: turn on, turn off or switch; and add processors of the ship to the list with the "+ Processor" button. The action is the same as the processor's own command "control enabled". Landing and take-off count every time, also on entering or leaving the build mode. Damage is checked a few times a second and works at most twice a second. In the build mode damage is not watched. Several modules are several actions.\n\nProcessors can switch off more than that: the magnet (no pull, no power use), the schematic builder (printing stops), the ship control block (its modules and rules do not work) and every booster (no thrust, no fuel or energy use; if all are off the ship comes down in an emergency landing).\n\n[accent]Preload of items[] (orange, read by the builder). The listed items appear in the storage of a ship printed by the schematic builder (the core first). They are added to the price: the builder takes them too. What does not fit stays in the builder. It does nothing for a ship built by hand.\n\n[accent]Liquid load[] (orange, read by the builder). The tanks of a printed ship are filled with the chosen liquid to the chosen part of their room. The builder pours it from its own tanks (bring conduits to it) and waits until it has enough.
ycb.guide.fly.title = In flight: blocks, drills, turrets
ycb.guide.fly.text = [accent]Everything works.[] Conveyors move items, bridges and wires keep their links, unloaders, storages, generators, factories and turrets work as usual. A landed ship is part of the map again and works the ordinary way there.\n\n[accent]Drills[] mine what is under the ship at the moment: if the edge of the drill touches an ore, it mines it. The ore switches on the fly while the ship moves, so a drill can be placed anywhere (see Free placement) and carried over an ore. [accent]Pumps[] take liquid from the water they touch and pass it to neighbouring tanks and conduits. A conduit that ends in empty space leaks onto the ground below the ship. Thermal generators, cultivators and water extractors read the floor under the flying ship.\n\n[accent]Turrets act as one gun.[] When the ship picks a target (or you shoot yourself), all guns turn to it and fire together. Each turret has its own ammo and turn speed. Aiming leads the target and counts the speed of the ship.\n\n[accent]Bullets keep the speed of the ship.[] Like the bullets of a unit, the bullets of its guns get the speed of the ship added (not lasers, lightning and others that do not inherit speed in the game). A flying ship counts as an air target: air-only bullets (flak) can hit it, ground-only bullets (artillery, flames) cannot; phase walls reflect bullets.\n\n[accent]Looks.[] Every block casts a shadow. A damaged block shows cracks, the more the darker. A flying ship is drawn above the darkness of the map edge and thick walls, and does not darken there.
ycb.guide.collide.title = Collisions and weight
ycb.guide.collide.text = Every occupied cell weighs 1, so a ship of 100 blocks is 100 times heavier than a single block.\n\nWhen two ships touch, they exchange [accent]momentum[] (weight x speed) like billiard balls: the total momentum stays, but part of the kinetic energy is lost (the bounce is neither perfectly hard nor perfectly soft, 0.25). They are pushed apart in inverse proportion to their weights, so the heavy ship hardly moves and the light one flies off.\n\nExample: 100 blocks at 1 tile per second carry momentum 100, one block at 10 tiles per second only 10, so the big ship goes on and the small one is thrown back.\n\nThe engines keep working during the contact: a light ship pushing against a heavy one does not move it, and a heavy ship can carry a light one in front of it. Hard hits strike sparks. The ship of the player has no priority: only the weight decides.\n\nShips do not collide while they land or take off. In the build mode the blocks of the world stop a ship like ordinary blocks; in flight the terrain does not matter.\n\nHeavier ships also turn slower (see Thrust, speed and weight).
ycb.guide.damage.title = Damage, falling blocks, crashes
ycb.guide.damage.text = [accent]Damage.[] Enemy bullets hit particular blocks of the ship (armor counts). When a block that held others is destroyed, everything that came off the hull falls. If all cores and storages are destroyed, the whole ship is destroyed and the rest of its blocks fall.\n\n[accent]Falling blocks.[] Each group that came off becomes debris: it keeps the speed and turn of the ship at that moment, plays the landing animation 1.5 times faster (no smoke or dust) and touches down. Each block deals its health to the [accent]enemies[] under it (a unit dies when it gets at least its health). Then all the blocks of the debris are destroyed with the usual explosion: fuel and flammables ignite, batteries burst, liquids spill. Allies are not hurt. The build mode does not drop anything: there loose blocks just turn red.\n\n[accent]Landing on enemies.[] When a ship comes down (any landing, also G), each enemy ground unit (walking too) touched by a block fights the blocks it touches. If the blocks have more health in total than the unit (health + shield), the unit dies and the blocks lose 25% of the unit's health together (but no block goes below 1). Otherwise the unit loses as much health as the blocks had and the blocks [accent]break[] (explode like any destroyed block). If a core or storage breaks, another storage of the ship takes its place; if none is left, the ship falls apart into ordinary blocks. Units of your own team and neutral ones are not hurt, just moved out to the nearest free place.\n\n[accent]Crash.[] A ship with no working engine does not choose a place: it falls exactly where its speed carries it. Each building it hits is compared with the total health of the falling blocks. More health: the building is destroyed and replaced, and the blocks lose 25% of its health. Less or equal: the blocks break and the building takes damage equal to their health. Blocks that fall on what cannot be built on (a map wall, deep water, beyond the edge) break. [accent]Drop zone.[] When a wave starts, the game destroys everything of yours near the ground spawns (the red circle). A flying ship is not safe above it: every block that is inside the circle at that moment is torn off and falls like any block that lost its hold (an emergency fall). What the torn off blocks held falls with them; if the hull is torn off, the whole ship comes down. Ships of the wave team are not touched.
ycb.guide.fire.title = Fire and explosions
ycb.guide.fire.text = A flying ship has its own fires and explosions, linked to the ground below it. A landed ship is on the map, there the game's own fire works.\n\n[accent]Fire.[] One fire burns on each burning cell of a block.\n- It starts from incendiary bullets, from a destroyed block with flammables inside (coal, oil, spores...), and the fire of the ground under the blocks passes to the ship at take-off (and back to the ground at landing).\n- Every half second it hits its block (2.5 damage x the strength of the fire, armor does not count). Without fuel it lives about 17 seconds.\n- While the block holds flammables the fire grows (up to x4 damage) and lasts longer; without them it fades.\n- It spreads to neighbouring blocks, and every 0.75 seconds it may drop down: if a ground block is below, a real fire starts there.\n- A block with water or another extinguishing liquid (10 units or more) puts its fire out fast. Wave turrets on a ship do not put out its fires by themselves.\nA ship holds up to 400 fires; they are not saved.\n\n[accent]Explosions.[] A dying block explodes by the numbers of the game: the explosiveness, flammability and charge of what is inside.\n- The blasts hit the blocks of all flying ships in the radius, its own too. At the edge the damage is 40%. Armor counts.\n- [accent]Batteries[] (and any block with charge) discharge: damage = charge / 25, at most 600; blocks that need power take x1.5.\n- A [accent]thorium reactor[] (and an impulse reactor) blasts everything around by its own radius and damage (19 tiles and 5000 for thorium). It explodes only when charged: fuel 5 or more or heat 0.5 or more, and if the rules allow reactor explosions.\n- A destroyed ship block still triggers the game's blast on the ground below (blocks break, fires, lightning). A ground block that dies hits the ships above it in the same way.\nExplosions chain with a delay of some ticks, as the game's waves do. The rules fire, damage of explosions and reactor explosions are respected.
ycb.guide.units.title = Projectors and unit factories
ycb.guide.units.text = [accent]Menders and projectors.[] A mender, a mend projector and an overdrive projector on a flying ship work on the blocks of [accent]that ship[], not on the real blocks below it: menders heal damaged blocks, the overdrive projector speeds blocks up. The force projector makes its field around the ship, drawn like the game's own. A processor can switch a projector off. On a landed ship the blocks stand on the map and work the ordinary way.\n\n[accent]Unit factories.[] A unit factory (and a reconstructor) on a flying ship keeps a finished unit only if the block in front takes it: a payload conveyor, a router, a mass driver and so on, or a reconstructor that can upgrade this very unit. Otherwise:\n- an [accent]air[] unit flies out (also when a block stands in front: it no longer stays inside for ever);\n- a [accent]ground, legged or naval[] unit falls onto the real ground under the ship: to the nearest place where it can stand (up to 5 tiles from the point), with a puff of dust and part of the speed of the ship. A naval unit that falls not on water dies, as in the game.\nA reconstructor at the end of a chain lets the unit out the same way when it has nowhere to upgrade it. The unit cap is respected: at the cap the unit waits in the factory.
ycb.guide.planets.title = Other planets and mods
ycb.guide.planets.text = [accent]Every block of the mod is available on every planet[], also on Erekir and the planets of other mods. They are always unlocked (nothing to research), shown in the Units tab (the ship control block in Logic) and can be placed anywhere, also in space and under water.\n\n[accent]Recipes.[] On Serpulo the classic recipes are used. On any other planet a block is made of the first resources of the planet's list; the older the block, the more of them it takes:\n- Rocket Booster: 2 resources, 20 and 10\n- Landing Spot: 2 resources, 20 and 20\n- Energy Booster: 3 resources, 100, 50 and 30\n- Ship Control: 3 resources, 50, 300 and 120\n- Fuel Booster: 4 resources, 300, 400, 100 and 200\nIf the planet has fewer resources, all of them are used. The Schematic Builder uses the last resource of the planet (instead of surge alloy and phase fabric) and the first two (instead of graphite and plastanium).\n\n[accent]The list of resources of a planet[] goes in the order the planet gives them: its research tree, level by level (only items); then the other resources made for this planet in the order the mod declared them; only if the planet has none, the other resources.\n\n[accent]Fuel.[] On Serpulo coal, spore pods and pyratite burn. Any item of another mod with flammability 0.3 or more is also a fuel, with thrust 10 x flammability (at most 20). Where nothing burns (Erekir), the most volatile resources of the planet become the fuel. Liquid boost is still given by water and cryofluid only.\n\nThe recipes are counted again when a world or sector is loaded and when the planet of the game changes.
ycb.guide.multi.title = Multiplayer
ycb.guide.multi.text = The mod works in single player, for the host, and on a dedicated server. [accent]The mod, of the same version, is needed on the server and on every client.[]\n\n[accent]How it works.[] The server does all the work of the ships: flight, landing and take-off, damage, fire, autopilot, orders. A client does not run ship logic; it keeps a copy of every ship and draws it. Flight, the take-off and landing animations with dust, turret aim, working engines, damage, fire, shots and explosions are synchronised.\n\n[accent]A client can[] drive a ship (Y, Shift+Y or Ctrl + click), give it orders of the command mode (move, Land, Take off), and use G and Y. Only the host (the server itself) can set up the Ship Control block and the Schematic Builder.\n\n[accent]The build mode is local.[] G is on only for you: the ship you pick (the one you sit in, else the one under the cursor, else the nearest) lands, the others keep flying. The [accent]violet mask[] is the ship layer; the cells with the mask are seen by all players, and a ship that someone is editing now has a brighter, blinking mask. Blocks that you place in G look violet to others until you leave. Leaving G lifts only the ships that have no editors left; a landed (parked) ship stays on the ground.\n\n[accent]Saving.[] Ships are saved in a block of the save file of their own, so even big bases save without the "encoded string too long" error. Old saves load too.
ycb.guide.settings.title = Settings, limits and tips
ycb.guide.settings.text = [accent]Settings[] (Settings, the mod's page):\n- Thrust of one rocket booster: 45 tiles per second per tile of the ship by default. The speed of every ship depends on it.\n- Turn the flying ship towards the driving direction: on by default.\n- The YCB guide button.\n\n[accent]Limits.[]\n- A ship is at most about 110 blocks across.\n- Blocks under construction do not move: finish them before take-off.\n- Free placement works only in the build mode and only for blocks the game checks the terrain of (drills, pumps, thermal generators and the like). The core must hold at least one item of every kind needed.\n- Items in a storage that was cut off and removed when you left the build mode are lost.\n- Ground enemies find the way to cores by the map: while a core flies, they do not find it that way. Any enemy that sees a ship and shoots at air can attack it.\n- The autopilot gives way to the orders of the command mode. A landing by a module needs room under the whole ship. During a landing or take-off the ship cannot be steered and orders do not work.\n- Boosters are not mirrored when turned.\n- Enemies aim at the centre of a flying ship, not at single blocks. Lasers, lightning and energy fields (Navanax, Aegires) do not hurt its blocks, and an enemy Parallax cannot pull it.\n- Plasma bores and cliff crushers do not mine walls while the ship flies.\n\n[accent]Tips.[]\n- Copy a ship in the build mode as a schematic: the builder can print it, and the modules of its control block come with it.\n- Put landing spots near your drills and give the ship a Landing for resources module: it fetches and unloads on its own.\n- Several magnets on a ship pull it harder; put them on the side that faces the partner.\n- If a ship will not take off, look at the top of the screen for the booster hint and check fuel and power.
