block.your-custom-battleship-ship-control.name = Ship Control
mb.ship.nothing = The map has no ores or liquids
block.your-custom-battleship-ship-control.description = Tells the flying ship what to do with logic modules. They run one after another from the top down and then in a circle from the first one again; a module keeps the ship until it is done. Resource: fetch an ore or a liquid up to a fill percentage (an ore that one ship has taken is closed to the others). Rest point: hover over a point or land on a landing spot and stay there while the listed resources hold their percentages, or for a timer; a list of places is tried in order, the first free one is used. Landing for resources: land on the first free landing spot of a list and stay until the listed resources reach their percentages, then take off. The pencil opens the panel. Placeable only in the flying ship build mode; several can sit on one flying ship. The recipe depends on the planet: on Serpulo the classic one, on any other planet it is made of the first 3 resources of the planet. A control block can also hold a preload of items and a liquid load: a ship printed by the schematic builder gets these items in its storage (they are added to the price) and its tanks filled with the liquid.
block.your-custom-battleship-landing-spot.name = Landing Spot
block.your-custom-battleship-landing-spot.description = A plain block on the ground. A flying ship with a landing module flies onto it and lands on it: one of its storages covers the spot, the spot is not destroyed (it is only covered while the flying ship stands there). The flying ship takes off again when its modules are done. Placeable outside the build mode. The recipe depends on the planet: on Serpulo the classic one, on any other planet it is made of the first 2 resources of the planet.
block.your-custom-battleship-magnet.name = Magnet
block.your-custom-battleship-magnet.description = A one-tile block with a front (red) and a back (blue); rotatable. Uses 10 power units / second. A magnet of one flying ship pulls the magnets of ANOTHER flying ship of your team that are within 5 tiles and turned the other way (the front of one looks at the other magnet and the front of the other looks the same way: front to back). The pull is as strong as 3 rocket boosters, weaker the farther away, and it gives speed the way engines do: a big flying ship hardly moves, a small one comes quickly; the flying ships also turn to stand side by side. When two magnets meet the flying ships become ONE flying ship: one weight, the thrust of all engines. Like poles push the flying ships apart instead: when the fronts look at each other (red to red) or the backs do (blue to blue), the magnet pushes its flying ship away with the same force. Magnets of the same flying ship do nothing to each other. When the power of the magnets goes out the flying ships let go of each other; a part that has no engine left comes down with a fall animation, keeping its speed, and its blocks stay on the ground as ordinary blocks. Placeable only in the flying ship build mode. The recipe depends on the planet: on Serpulo the classic one, on any other planet it is made of the first 3 resources of the planet. Magnets on the ground work on flying ships too (see the Super Magnet).
block.your-custom-battleship-super-magnet.name = Super Magnet
block.your-custom-battleship-super-magnet.description = A two-by-two block with a front (red) and a back (blue); rotatable. Uses 500 power units / second. Works like the Magnet, but with a range of 25 tiles and a pull of 100 rocket boosters (a pulled ship goes up to 12 tiles per second), and it works with plain magnets and super magnets alike (a pair works with the stronger pull and the longer range of the two). A powered magnet on the GROUND is not idle either: it draws a flying ship of your team that has magnets turned the other way TO itself (the ship flies to the magnet, turns, the shadow shrinks like in a landing, and the ship lands face to face with the magnet, like a joining) if the ship hovers and stands still, and pushes away ships whose magnets are turned the same way. A ship in the pull can leave it, and a landed ship can take off, only when the thrust of its engines is greater than the pull of the magnets. The recipe depends on the planet: on Serpulo 100 surge alloy, 200 graphite and 200 lead, on any other planet it is made of the first 3 resources of the planet.
