block.your-custom-battleship-rocket-booster.name = Rocket Booster
block.your-custom-battleship-rocket-booster.description = The basic engine of a flying ship. Only placeable in the flying ship build mode. Thrust = 1. The flying ship speed is the total thrust of all boosters times the power of one rocket booster, divided by the number of tiles the flying ship occupies. The recipe depends on the planet: on Serpulo the classic one, on any other planet it is made of the first 2 resources of the planet.
block.your-custom-battleship-energy-booster.name = Energy Booster
block.your-custom-battleship-energy-booster.description = A 2x2 engine with the thrust of 6 rocket boosters. Uses 90 power units per second while the flying ship is driven; with a lack of power the thrust drops. Liquid boost (optional): water doubles the thrust (x2 = 12 rocket boosters), cryofluid gives x2.5 (15); it uses 10 liquid units per 10 seconds of work. Only placeable in the flying ship build mode. The recipe depends on the planet: on Serpulo the classic one, on any other planet it is made of the first 3 resources of the planet.
block.your-custom-battleship-fuel-booster.name = Fuel Booster
block.your-custom-battleship-fuel-booster.description = A 3x3 engine that burns one item per 8 seconds of work. Coal gives the thrust of 14 rocket boosters, spore pods 15, pyratite 17.3. Liquid boost (optional): water gives x1.25, cryofluid x3 (42 / 45 / 52 rocket boosters); 20 liquid units are used per burnt item. Feed it with conveyors or unloaders, fuel can be taken out with an unloader too; without fuel it does not work. Only placeable in the flying ship build mode. On other planets and with other mods any flammable resource is a fuel (thrust = 4 + 10 x its flammability); where nothing burns, the most volatile resources are. The recipe depends on the planet: on Serpulo the classic one, on any other planet it is made of the first 4 resources of the planet.
