block.your-custom-battleship-rocket-booster.name = Propulsor de cohete
block.your-custom-battleship-rocket-booster.description = El motor básico de una nave voladora. Solo se puede colocar en el modo de construcción de naves voladoras. Empuje = 1. La velocidad de la nave voladora es el empuje total de todos los propulsores multiplicado por la fuerza de un propulsor de cohete, dividido entre el número de casillas que ocupa la nave voladora. La receta depende del planeta: en Serpulo es la clásica; en cualquier otro planeta se fabrica con los 2 primeros recursos del planeta.
block.your-custom-battleship-energy-booster.name = Propulsor de energía
block.your-custom-battleship-energy-booster.description = Un motor de 2x2 con el empuje de 6 propulsores de cohete. Consume 90 unidades de energía por segundo mientras se pilota la nave voladora; si falta energía, el empuje disminuye. Potenciación con líquido (opcional): el agua duplica el empuje (x2 = 12 propulsores de cohete), el líquido criogénico da x2.5 (15); consume 10 unidades de líquido cada 10 segundos de funcionamiento. Solo se puede colocar en el modo de construcción de naves voladoras. La receta depende del planeta: en Serpulo es la clásica; en cualquier otro planeta se fabrica con los 3 primeros recursos del planeta.
block.your-custom-battleship-fuel-booster.name = Propulsor de combustible
block.your-custom-battleship-fuel-booster.description = Un motor de 3x3 que quema un objeto cada 8 segundos de funcionamiento. El carbón da el empuje de 14 propulsores de cohete, las vainas de esporas 15, la pirotita 17.3. Potenciación con líquido (opcional): el agua da x1.25, el líquido criogénico x3 (42 / 45 / 52 propulsores de cohete); se usan 20 unidades de líquido por cada objeto quemado. Aliméntalo con cintas transportadoras o descargadores; el combustible también se puede sacar con un descargador; sin combustible no funciona. Solo se puede colocar en el modo de construcción de naves voladoras. En otros planetas y con otros mods, cualquier recurso inflamable es combustible (empuje = 4 + 10 x su inflamabilidad); donde nada arde, lo son los recursos más volátiles. La receta depende del planeta: en Serpulo es la clásica; en cualquier otro planeta se fabrica con los 4 primeros recursos del planeta.
