block.your-custom-battleship-ship-builder.name = Constructor de esquemas
block.your-custom-battleship-ship-builder.description = Una impresora de naves de 16x16. Pulsa el lápiz bajo el bloque y elige un esquema de nave: solo se listan los esquemas de hasta 16x16 casillas con un núcleo o almacén y cuyos bloques se tocan todos entre sí. Gira el bloque (R) antes de colocarlo: las flechas del suelo indican por dónde sale la nave terminada (siempre el lado hacia el que mira el constructor; la nave mantiene el rumbo elegido con el botón de dirección). Imprime como una fábrica de unidades: necesita los objetos del esquema (el coste de construir cada bloque) + 100 de tejido de fase, 3000 unidades de energía por segundo y 240 de líquido criogénico por segundo; imprimir tarda 1.5 veces el tiempo que necesita un jugador para construir todos sus bloques. Las tres chimeneas arden mientras imprime. La nave terminada vuela un poco hacia delante y luego sigue las órdenes de su bloque de control de nave. No se puede colocar en el modo de construcción de naves voladoras y nunca pasa a formar parte de una nave. La receta depende del planeta: en Serpulo aleación eléctrica, grafito y plastanio; en otro planeta, el último recurso del planeta por id (en lugar de aleación eléctrica y tejido de fase) y sus dos primeros recursos (en lugar de grafito y plastanio). Contiene todo tipo de líquido. Un bloque de control de nave del esquema puede pedir una precarga de objetos (se suma al precio, aparecen en el almacén de la nueva nave) y una carga de líquido (se vierte desde los tanques del constructor a los tanques de la nueva nave).
