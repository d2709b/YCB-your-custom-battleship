block.your-custom-battleship-ship-control.name = Control de nave
mb.ship.nothing = El mapa no tiene minerales ni líquidos
block.your-custom-battleship-ship-control.description = Indica a la nave voladora qué hacer mediante módulos lógicos. Se ejecutan uno tras otro de arriba abajo y luego en círculo, volviendo al primero; un módulo mantiene la nave hasta que termina. Recurso: obtiene un mineral o un líquido hasta un porcentaje de llenado (un mineral que ha tomado una nave queda cerrado para las demás). Punto de reposo: se mantiene sobre un punto o aterriza en una zona de aterrizaje y permanece allí mientras los recursos indicados conserven sus porcentajes, o durante un temporizador; una lista de lugares se prueba en orden y se usa el primero que esté libre. Aterrizaje para recursos: aterriza en la primera zona de aterrizaje libre de una lista y permanece hasta que los recursos indicados alcanzan sus porcentajes; entonces despega. El lápiz abre el panel. Solo se puede colocar en el modo de construcción de naves voladoras; puede haber varios en una misma nave voladora. La receta depende del planeta: en Serpulo es la clásica; en cualquier otro planeta se fabrica con los 3 primeros recursos del planeta. Un bloque de control también puede contener una precarga de objetos y una carga de líquido: una nave impresa por el constructor de esquemas recibe esos objetos en su almacén (se suman al precio) y sus tanques se llenan con el líquido.
block.your-custom-battleship-landing-spot.name = Zona de aterrizaje
block.your-custom-battleship-landing-spot.description = Un bloque simple sobre el suelo. Una nave voladora con un módulo de aterrizaje vuela hasta él y aterriza encima: uno de sus almacenes cubre la zona, que no se destruye (solo queda cubierta mientras la nave voladora está allí). La nave voladora despega de nuevo cuando terminan sus módulos. Se puede colocar fuera del modo de construcción. La receta depende del planeta: en Serpulo es la clásica; en cualquier otro planeta se fabrica con los 2 primeros recursos del planeta.
block.your-custom-battleship-magnet.name = Imán
block.your-custom-battleship-magnet.description = Un bloque de una casilla con un frente (rojo) y una parte trasera (azul); se puede rotar. Consume 10 unidades de energía / segundo. Un imán de una nave voladora atrae los imanes de OTRA nave voladora de tu equipo que estén a menos de 5 casillas y orientados en sentido contrario (el frente de uno mira al otro imán y el frente del otro mira en la misma dirección: frente con parte trasera). La atracción es tan fuerte como 3 propulsores de cohete, más débil cuanto mayor es la distancia, y da velocidad igual que los motores: una nave voladora grande apenas se mueve, una pequeña llega enseguida; además, las naves voladoras giran para quedar lado a lado. Cuando dos imanes se encuentran, las naves voladoras se convierten en UNA sola nave voladora: un solo peso, el empuje de todos los motores. Los polos iguales, en cambio, separan las naves voladoras: cuando los frentes se miran entre sí (rojo con rojo) o las partes traseras (azul con azul), el imán aleja a su nave voladora con la misma fuerza. Los imanes de una misma nave voladora no se afectan entre sí. Cuando los imanes se quedan sin energía, las naves voladoras se sueltan; una parte que se queda sin motor cae con una animación de caída, conservando su velocidad, y sus bloques quedan en el suelo como bloques normales. Solo se puede colocar en el modo de construcción de naves voladoras. La receta depende del planeta: en Serpulo es la clásica; en cualquier otro planeta se fabrica con los 3 primeros recursos del planeta. Los imanes en el suelo también actúan sobre las naves voladoras (ver Superimán).
block.your-custom-battleship-super-magnet.name = Superimán
block.your-custom-battleship-super-magnet.description = Un bloque de dos por dos con un frente (rojo) y una parte trasera (azul); se puede rotar. Consume 500 unidades de energía / segundo. Funciona como el Imán, pero con un alcance de 25 casillas y una atracción de 100 propulsores de cohete (una nave atraída alcanza hasta 12 casillas por segundo), y funciona tanto con imanes normales como con superimanes (una pareja funciona con la atracción más fuerte y el alcance más largo de los dos). Un imán con energía en el SUELO tampoco está inactivo: atrae HACIA sí a una nave voladora de tu equipo que tenga imanes orientados en sentido contrario (la nave vuela hasta el imán, gira, la sombra se encoge como en un aterrizaje, y la nave aterriza cara a cara con el imán, como en una unión) si la nave se mantiene en el aire sin moverse, y aleja a las naves cuyos imanes están orientados en el mismo sentido. Una nave bajo atracción puede salir de ella, y una nave aterrizada puede despegar, solo cuando el empuje de sus motores es mayor que la atracción de los imanes. La receta depende del planeta: en Serpulo 100 de aleación eléctrica, 200 de grafito y 200 de plomo; en cualquier otro planeta se fabrica con los 3 primeros recursos del planeta.
