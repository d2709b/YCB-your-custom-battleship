ycb.guide.theme.world = Mundo y ajustes
ycb.guide.idea.title = Qué es una nave voladora
ycb.guide.idea.text = Una nave voladora es una unidad hecha de bloques. Su casco es un [accent]núcleo[] o un [accent]almacén / contenedor[]. Todo bloque unido al casco (lado con lado, también a través de otros bloques) pasa a formar parte de la nave.\n\nMientras vuela, la nave no está en la cuadrícula de casillas: las cintas transportadoras, los cables y las torretas del mundo no la ven y no la tocan. Solo interactúa con otras naves, enemigos y balas. Se mueve y gira a [accent]cualquier ángulo[], no casilla a casilla, y cada uno de sus bloques sigue funcionando en vuelo: las cintas transportadoras mueven objetos, los taladros minan, las fábricas producen, los generadores dan energía, las torretas disparan. Cada bloque proyecta una sombra sobre el suelo, como una unidad voladora.\n\nSolo es una nave lo que tú conviertes en nave. Un núcleo normal en el mapa no lo es hasta que pulsas [accent]Y[] sobre él en el modo de construcción ([accent]G[]) o construyes un casco allí.\n\nUna nave necesita [accent]propulsores[] (motores): sin ellos no vuela. Velocidad = empuje total de los propulsores x fuerza de un propulsor de cohete / número de bloques de la nave, así que cuanto más pesada es la nave, más lenta es.
ycb.guide.first.title = Tu primera nave, paso a paso
ycb.guide.first.text = [accent]1.[] Coloca un núcleo o un almacén / contenedor en el suelo (o usa uno que ya tengas).\n[accent]2.[] Pulsa [accent]G[] (en el móvil: el botón de construcción). El modo de construcción se activa: se muestra la cuadrícula y todo lo que no forma parte de una nave se pinta de azul (la capa del mundo).\n[accent]3.[] Apunta al núcleo / almacén y pulsa [accent]Y[] (en el móvil: el botón Mover bloques y luego tócalo). Se convierte en una nave y aparece sobre él una flecha verde, su frente.\n[accent]4.[] Construye bloques junto a él: cada bloque que colocas y que toca la nave se une a ella al instante. Los bloques que ya están en el suelo se unen con [accent]Y[] (mantén Y y arrastra un cuadrado para mover muchos a la vez).\n[accent]5.[] Pon en ella al menos un propulsor; un propulsor de cohete basta para empezar. Sin propulsores, arriba en la pantalla se muestra un aviso parpadeante "¡Se necesitan propulsores (motores)!".\n[accent]6.[] Alimenta lo que necesite alimentación: energía para los propulsores de energía, carbón / vainas de esporas / pirotita para los propulsores de combustible, munición para las torretas.\n[accent]7.[] Pulsa [accent]G[] otra vez: la nave despega. Pulsa [accent]Y[] (con el cursor lejos de los bloques) para entrar en ella y volar con [accent]WASD[]. [accent]Shift+Y[] la hace aterrizar.\n\nLos bloques que no están unidos al casco se marcan en rojo y se eliminan al salir del modo de construcción (parte de los recursos se recupera).
ycb.guide.layers.title = Capas: mundo y nave
ycb.guide.layers.text = Cada bloque está en una de dos capas. La [accent]capa del mundo[] es el mapa normal: sus bloques se pintan de azul en el modo de construcción. La [accent]capa de la nave[] contiene los bloques de las naves (llevan una máscara violeta en el modo de construcción).\n\n[accent]Y[] mueve el bloque bajo el cursor a la otra capa; el bloque tiene que tocar la nave. Mantén [accent]Y[] y arrastra un cuadrado (como la selección con F / B): todos los bloques del cuadrado se mueven a la vez. El bloque en el que empiezas determina la dirección:\n- empezar sobre un bloque del mundo: los bloques del mundo del cuadrado se unen a la nave (un edificio entero se une de golpe, cadena a cadena desde la nave hacia fuera);\n- empezar sobre un bloque de la nave: los bloques de la nave del cuadrado la abandonan y se convierten en bloques normales (los bloques que solo se sostenían gracias a ellos se vuelven rojos);\n- empezar sobre una casilla vacía: los bloques del mundo se unen; si no hay ninguno, los bloques de la nave se van.\nLos bloques de otros equipos y los bloques en construcción no se tocan. El marco muestra lo que va a cambiar: el color de la capa de la nave significa que se unen, el azul claro que se van.\n\nUn núcleo o almacén que no está unido a nada se convierte en una nueva nave cuando se une. Un grupo de bloques con un núcleo o almacén propio es una nave aparte: no se elimina, despega por su cuenta.\n\nEn el móvil, el botón Mover bloques ocupa el lugar de la tecla Y: toca un bloque o arrastra un cuadrado.
ycb.guide.pc.title = Teclas en PC
ycb.guide.pc.text = En PC no hay panel de botones: todo se hace con las teclas.\n\n[accent]G[] - activa / desactiva el modo de construcción. La nave que pilotas (si no, la más cercana al cursor) aterriza en la cuadrícula, queda mirando hacia arriba y se mueve casilla a casilla. Púlsala de nuevo: despega.\n[accent]Y[] fuera del modo de construcción - un bloque de tu equipo bajo el cursor cambia de capa; en cualquier otro sitio entras en una nave / sales de ella. [accent]V[] también sale de una nave.\n[accent]Shift+Y[] fuera del modo de construcción - hace aterrizar la nave, o la hace despegar de nuevo si está aterrizada (igual que las órdenes Aterrizar / Despegar).\n[accent]Y[] en el modo de construcción - mueve el bloque bajo el cursor entre las capas; mantenla y arrastra un cuadrado para mover muchos bloques.\n[accent]R[] en el modo de construcción - gira 90 grados la flecha del frente de la nave ([accent]Shift+R[] en sentido contrario). En un bloque que el juego puede rotar por sí mismo (una cinta transportadora), R gira el bloque en su lugar.\n[accent]WASD[] - volar. Por defecto, la nave gira hacia la dirección de vuelo (es un ajuste).\n[accent]Q / E[] - gira la nave a mano a cualquier ángulo.\n[accent]Botón izquierdo del ratón[] (mantenido) - todas las torretas giran hacia el cursor y disparan a la vez.\n[accent]Ctrl + botón izquierdo del ratón[] sobre una nave - toma el control de ella, como de cualquier unidad.
ycb.guide.phone.title = Controles en el móvil
ycb.guide.phone.text = En el móvil, el panel con los botones está a la izquierda de la pantalla. La flecha de su parte superior oculta y muestra los botones.\n\nEl panel tiene: el modo de construcción (como G), entrar / salir de una nave (como Y), aterrizar / despegar la nave (como Shift+Y). En el modo de construcción aparecen dos más: [accent]Mover bloques[] (como Y) y [accent]Girar frente[] (como R). Para una nave aterrizada, las flechas bajo los botones la mueven casilla a casilla.\n\nUna nave voladora sigue el [accent]centro de la pantalla[]: arrastra el mapa con un dedo y la nave vuela tras el centro, gira su frente hacia él, frena suavemente y se detiene allí. Tocar una nave no entra en ella, usa el botón de entrar.\n\n[accent]Mover bloques[]: púlsalo una vez para activarlo (se ilumina). Un toque sobre un bloque lo envía a la otra capa; un cuadrado arrastrado mueve todos los bloques que contiene (el bloque en el que empiezas determina la dirección, como con Y). Mientras está activado, el mapa no se desplaza. Pulsa el botón de nuevo para terminar.\n\n[accent]Girar frente[]: gira la nave que está en el centro de la pantalla (si no, aquella en la que estás; si no, la aterrizada más cercana) 90 grados en sentido antihorario. Cuatro toques son un giro completo.
ycb.guide.build.title = Modo de construcción (G)
ycb.guide.build.text = El modo de construcción es donde se crean y modifican las naves.\n\n- La nave aterriza en la cuadrícula, mira hacia arriba y se mueve celda a celda (8 celdas por segundo). La cuadrícula está activada y la capa del mundo se ve azul.\n- Los bloques que colocas y que tocan la nave se unen a ella al instante. Un bloque que perdió su unión con el casco se marca en rojo y se elimina al salir del modo (parte de los recursos se devuelve). Un grupo de bloques con un núcleo o almacén propio no se elimina: se convierte en una nave aparte.\n- [accent]Frente.[] Cada núcleo / almacén de una nave muestra una flecha verde, el frente. [accent]R[] lo gira (todos los cascos de la nave a la vez). Cuando conduces con «girar hacia la dirección» activado, la nave gira de modo que el lado de la flecha mire hacia delante. Las torretas sin objetivo miran al frente. Tras el modo, la nave despega en la misma posición; solo cambia el lado que cuenta como frente.\n- [accent]Colocación libre.[] Los taladros, bombas, generadores térmicos, extractores de agua y otros bloques ligados al suelo se pueden colocar en cualquier sitio: no hace falta mineral, agua ni calor. Elige el bloque y haz clic (toca en un teléfono) como de costumbre; cuesta lo mismo y tarda lo mismo. El núcleo debe tener al menos una unidad de cada objeto que necesita el bloque. También funciona con esquemas pegados (sus fantasmas son blancos).\n- [accent]Pegar un esquema.[] Los bloques se terminan en cualquier orden. Los bloques terminados que aún no tocan nada esperan en rojo; en cuanto una cadena llega a un núcleo / almacén, todo el esquema se convierte en una sola nave.\n- Los bloques en construcción no se mueven: termínalos antes de despegar.\n- Los propulsores y los imanes también se pueden colocar fuera del modo de construcción: son bloques de suelo hasta que Y o el modo de construcción los convierte en parte de la nave.\n- Si una nave no tiene propulsores, se muestra una pista parpadeante en la parte superior.
ycb.guide.landing.title = Aterrizaje y despegue
ycb.guide.landing.text = [accent]Shift+Y[] (PC) o el botón Aparcar (teléfono) aterriza la nave que conduces, o la más cercana, sin el modo de construcción. Púlsalo de nuevo para levantar la nave. Una nave que se edita en el modo de construcción se deja a G.\n\n[accent]La animación.[] La nave desciende despacio: su sombra se desliza bajo ella, gira con el frente hacia arriba y se desliza hasta las celdas exactas; al tocar el suelo salen nubes de polvo, como en el aterrizaje de un núcleo en un planeta (su número y tamaño dependen del peso y el ancho de la nave). El despegue es igual al revés, y el polvo sale poco a poco. Mientras tanto la nave no se puede dirigir y no choca con otras naves. Dura de 1,3 a 8 segundos aproximadamente; una nave pesada y lenta tarda más. El modo de construcción (G) aterriza y levanta al instante, sin animación.\n\nSi no hay sitio libre bajo toda la nave, no aterriza y sigue volando. Una nave que aterriza gira entera hacia el lado más cercano (arriba, derecha, abajo, izquierda): sus bloques, torretas y la flecha del frente giran con ella.\n\n[accent]Órdenes.[] En el modo de mando (RTS) el panel de mando tiene [accent]Aterrizar[] y [accent]Despegar[]. Una nave aterrizada a la que se da una orden de movimiento o ataque primero se eleva y luego va. Las órdenes del jugador tienen prioridad sobre el piloto automático.\n\n[accent]La fila de posturas[] bajo las órdenes tiene [accent]Desactivar el bloque de control de nave[] (la cuadrícula tachada). Mientras está activada, los bloques de control de nave de todas las naves seleccionadas no envían señales: no se ejecuta ningún módulo, no se activa ningún procesador, los imanes no unen nada. La nave se queda donde está hasta que le des una orden; las reglas de taladros y bombas se mantienen. [accent]Minar[] (para naves con taladro) funciona como con mono y poly: marca los minerales bajo la orden (o Auto). La nave vuela a la veta libre más cercana del mineral que menos tiene, pone su taladro en ella y se queda hasta que sus almacenes están llenos; luego queda suspendida donde está. Auto no incluye la arena. No depende de los bloques de control.\n\nBloque [accent]Zona de aterrizaje[]: una nave con un módulo de aterrizaje aterriza en él por sí sola (véanse los temas Bloques y Piloto automático).\n\n[accent]Aterrizaje de emergencia.[] Si ningún motor funciona durante más de medio segundo (ninguno, sin combustible, sin energía, apagados), la nave cae: conserva su velocidad, no se dirige a ningún sitio y aterriza donde la lleve la velocidad. Lo que haya debajo lucha contra sus bloques (véase Daño, bloques que caen y choques).
ycb.guide.thrust.title = Empuje, velocidad y peso
ycb.guide.thrust.text = El empuje se cuenta en [accent]propulsores de cohete[]: un propulsor de cohete = 1.\n\n[accent]La velocidad[] de una nave = empuje total de sus propulsores x el empuje de un propulsor de cohete (45 casillas por segundo por casilla de la nave por defecto, véanse Ajustes) / el número de casillas que ocupa la nave. El doble de pesada = el doble de lenta.\n\n[accent]Giro.[] Una nave más pesada también gira más despacio: la velocidad de giro se divide entre (1 + peso / 60). Una nave de 60 bloques gira dos veces más despacio que una diminuta, una de 180 bloques cuatro veces; ninguna nave gira más despacio de 6 grados por segundo.\n\nLos motores funcionan todo el tiempo que la nave está en el aire. Mientras se [accent]mueve[] usan toda su energía, combustible y líquido; mientras solo [accent]se mantiene en el aire[] (parada, o descendiendo) usan [accent]la mitad[], el círculo amarillo parpadea el doble de lento y sueltan la mitad de humo; mientras [accent]despega[] sueltan el doble de humo. Los motores de una nave aterrizada están apagados. Un propulsor que apagaste con un procesador no da empuje. Cuando ningún motor funciona, la nave desciende en un aterrizaje de emergencia.\n\nUn propulsor en marcha muestra un círculo amarillo parpadeante en el centro y suelta humo como un taladro: el propulsor de cohete una vez por segundo, el de energía dos veces, el de combustible tres veces (una nave que se mueve; para el vuelo estacionario y el despegue, véase arriba).\n\nLa nave más grande mide unos 110 bloques de ancho.
ycb.guide.rocket.title = Propulsor de cohete
ycb.guide.rocket.text = El motor básico. 1x1, empuje 1. No necesita nada para funcionar.\n\nReceta en Serpulo: 20 de cobre, 10 de plomo, 5 de grafito. En otros planetas se hace con los 2 primeros recursos del planeta (véase Otros planetas y mods).\n\nComo no necesita combustible ni energía, unos pocos propulsores de cohete son la forma más sencilla de hacer volar una nave pequeña. Para una nave grande hacen falta muchos o los motores más potentes: el propulsor de energía (6 propulsores de cohete) y el propulsor de combustible (de 14 a 17 propulsores de cohete solo con combustible).\n\nSe puede colocar en cualquier modo. Fuera del modo de construcción es un bloque de suelo normal; Y o el modo de construcción (G) lo convierte en parte de la nave. Se puede apagar con un procesador (control enabled).
ycb.guide.energy.title = Propulsor de energía
ycb.guide.energy.text = Un motor 2x2 con el empuje de [accent]6 propulsores de cohete[].\n\n[accent]Energía:[] 90 unidades de energía por segundo mientras la nave se mueve o despega, 45 mientras solo se mantiene en el aire. Con falta de energía el empuje baja en proporción; sin energía no funciona. Dale energía con baterías o generadores de la nave.\n\n[accent]Impulso líquido (opcional).[] Aliméntalo con agua o líquido criogénico mediante conductos: el agua duplica el empuje (x2 = 12 propulsores de cohete), el líquido criogénico da x2,5 (15). Usa 10 unidades de líquido por cada 10 segundos de trabajo (la mitad mientras la nave solo se mantiene en el aire), y el depósito contiene 20, un líquido a la vez. Sin el líquido sigue funcionando, solo que más débil.\n\nApúntalo (PC) y el panel muestra qué le falta al motor: la energía o el líquido que faltan aparecen tachados en rojo, y debajo se escribe el empuje actual. Una nave en vuelo muestra este panel junto al cursor.\n\nSe ilumina con su energía. Receta en Serpulo: 100 de cobre, 50 de plomo, 30 de silicio, 20 de plastanio. En otros planetas: los 3 primeros recursos del planeta.
ycb.guide.fuel.title = Propulsor de combustible
ycb.guide.fuel.text = Un motor 3x3 que quema combustible: un objeto cada 8 segundos de trabajo (uno cada 16 segundos mientras la nave solo se mantiene en el aire).\n\n[accent]Combustible y empuje:[] carbón 14 propulsores de cohete, vainas de esporas 15, pirotita 17,3. Guarda hasta 20 objetos de cada tipo; cuando tiene varios tipos, el más débil se quema primero. Aliméntalo con cintas transportadoras o descargadores; un descargador también puede sacarle combustible. Sin combustible no funciona.\n\n[accent]Impulso líquido (opcional):[] agua x1,25, líquido criogénico x3 (carbón 42, vainas de esporas 45, pirotita 52). Se usan 20 unidades de líquido por objeto quemado; el depósito contiene 120.\n\n[accent]En otros planetas y con otros mods[] cualquier objeto inflamable es combustible, con empuje 4 + 10 x su inflamabilidad (como máximo 20). Donde nada arde, se usan los recursos más volátiles del planeta.\n\nReceta en Serpulo: 300 de cobre, 400 de plomo, 100 de grafito, 100 de plastanio, 200 de titanio. En otros planetas: los 4 primeros recursos del planeta.
ycb.guide.control.title = Control de nave
ycb.guide.control.text = El piloto automático de una nave. Un bloque 2x2 en la pestaña [accent]Lógica[]. Receta en Serpulo: 50 de cobre, 300 de plomo, 120 de silicio.\n\nColócalo en el modo de construcción (como los propulsores); puede haber varios en una nave. Pulsa el [accent]lápiz[] del bloque: se abre un panel a pantalla completa donde añades [accent]módulos[]. Los módulos se describen en el tema «Módulos de piloto automático».\n\nEl piloto automático solo dirige una nave en vuelo y una nave que aterrizó por uno de sus módulos. Una nave que aterrizaste tú (G, Shift+Y, el botón Aparcar) se deja en paz. Las órdenes del modo de mando (mover, atacar, aterrizar, despegar) van antes que todos los módulos, y conducir la nave a mano detiene el piloto automático mientras conduces.\n\nLos ajustes del bloque (módulos, porcentajes, puntos, listas de zonas, temporizadores) se guardan con la nave, con la partida y con los esquemas: copiar y pegar los conserva.\n\nUn procesador puede apagar el bloque (control enabled): entonces sus módulos y reglas no funcionan.\n\nEn el servidor de otra persona solo el anfitrión (el propio servidor) puede configurar el bloque.
ycb.guide.spot.title = Zona de aterrizaje
ycb.guide.spot.text = Un bloque 1x1 normal en el suelo. Receta en Serpulo: 20 de cobre, 20 de plomo. Colócalo [accent]fuera[] del modo de construcción.\n\nSolo no hace nada. Una nave con un módulo de aterrizaje (Aterrizaje para recursos, o Punto de reposo en el modo «aterriza») vuela hasta él y aterriza: uno de los almacenes de la nave (el núcleo o un contenedor) tiene que cubrir la zona. La zona no se destruye: solo queda cubierta mientras la nave está allí y vuelve cuando la nave despega. El resto de la nave necesita suelo libre alrededor; si algo estorba, la nave no aterriza y sigue volando.\n\nUna zona con una nave encima, o con una nave volando hacia ella, está ocupada: otras naves de tu equipo usan la siguiente zona libre de su lista.\n\nSi levantas una nave de su zona a mano (la orden Despegar o conduciéndola), su módulo de aterrizaje se pausa y no vuelve a poner la nave hasta que cambies el módulo.
ycb.guide.magnet.title = Imán
ycb.guide.magnet.text = Un bloque 1x1 rotable con un frente (rojo) y una parte trasera (azul). Usa 10 unidades de energía por segundo. Receta en Serpulo: 40 de cobre, 30 de silicio, 20 de titanio. Se puede colocar en ambos modos (fuera del modo de construcción es un bloque de suelo hasta que Y o G lo convierten en parte de una nave).\n\n[accent]Atracción.[] El imán de una nave atrae los imanes de [accent]otra[] nave de tu equipo dentro de 5 casillas que estén orientados al revés (el frente de uno mira al otro imán y el frente del otro mira en la misma dirección: frente con parte trasera). La atracción es tan fuerte como 3 propulsores de cohete y se debilita con la distancia, hasta cero a 5 casillas. Da velocidad como los motores (atracción x potencia del propulsor / casillas de la nave), así que una nave grande apenas se mueve y una pequeña llega rápido (no más de 6 casillas por segundo). Cada imán atrae una vez: una nave con diez imanes es atraída diez veces más fuerte. Las naves también giran, cada una hasta donde le permite su peso, hasta que los imanes miran en la misma dirección, y quedan lado a lado.\n\n[accent]Unión.[] Cuando dos imanes compañeros están a unas 1,5 casillas, miran en la misma dirección con un margen de 10 grados y los bloques se pueden juntar sin solaparse, la nave más ligera entra en la más pesada: se convierten en [accent]UNA sola nave[], con un solo peso y el empuje de todos los motores. Quien conducía la nave que entró conduce toda la nave. Si los bloques se solaparan, las naves simplemente quedan una contra otra.\n\n[accent]Soltarse.[] Si los imanes pierden energía durante 1/3 de segundo o uno es destruido, la unión se rompe. Los grupos de bloques que no están unidos al principal se separan en naves propias con la misma velocidad. Una parte sin motor cae (conserva su velocidad) y sus bloques quedan en el suelo como bloques normales.\n\n[accent]Polos iguales se repelen.[] Dos imanes que se miran (rojo con rojo) o se dan la espalda (azul con azul) separan sus naves con la misma fuerza. Solo empujan: sin giro y sin unión. Los imanes de una misma nave no se hacen nada entre sí.\n\n[accent]En el suelo.[] Un imán con energía que está en el suelo también actúa sobre las naves voladoras de tu equipo que tienen imanes: los polos distintos atraen la nave hacia el imán y la aterrizan cara a cara con él, los polos iguales la empujan lejos. Léelo en el tema Superimán.
ycb.guide.supermagnet.title = Superimán
ycb.guide.supermagnet.text = Un bloque 2x2 rotable con un frente (rojo) y una parte trasera (azul): el hermano fuerte del Imán. Receta en Serpulo: 100 de aleación eléctrica, 200 de grafito, 200 de plomo (en otro planeta, los 3 primeros recursos del planeta). Usa 500 unidades de energía por segundo. Alcance 25 casillas, atracción tan fuerte como 100 propulsores de cohete (el Imán: 5 casillas y 3 propulsores de cohete), es decir, 5 veces el alcance y 33 veces la atracción. Una nave atraída por él va hasta 12 casillas por segundo (el Imán: 6).\n\n[accent]Con otros imanes.[] Funciona con superimanes y con imanes normales por igual, con las mismas reglas (polos distintos atraen, polos iguales repelen, unión de las naves, soltarse: véase el Imán). Una pareja de imanes distintos funciona con la atracción más fuerte y el alcance mayor de los dos, y con la energía del que recibe menos.\n\n[accent]En el suelo.[] Un imán que está en el suelo (también uno normal, también uno de una nave aterrizada) no está inactivo. Actúa sobre los imanes de las naves [accent]voladoras[] de tu equipo dentro de su alcance, con las mismas reglas de polos. [accent]Los polos iguales repelen[] la nave. [accent]Los polos distintos la atraen hacia el imán[]: la nave vuela hacia el imán, gira hasta que su imán mira en la misma dirección, su sombra se encoge suavemente como en un aterrizaje, y cuando ha sido atraída del todo aterriza con su imán [accent]cara a cara[] con el imán del suelo (uno 1x1 contra uno 2x2 se coloca contra una de sus dos celdas; si ese sitio está ocupado, se desliza por la cara o toma la otra celda; si no hay sitio alguno, la nave se queda en el aire). La atracción de todos los imanes que actúan sobre la nave se suma y la pareja más fuerte con sitio es a la que se acopla; cuanto más fuerte la atracción, más rápido llega la nave.\n\n[accent]Cuándo atrae.[] Solo una nave que se mantiene en el aire y está quieta: nadie la conduce, ninguna orden ni el piloto automático la envía a ningún sitio. Una vez comenzada la atracción, la nave no se puede dirigir. Solo puede salir de la atracción (se eleva y sigue volando), y una nave que aterrizó por ella puede despegar, cuando el empuje de sus motores es [accent]mayor[] que la atracción de los imanes que actúan sobre ella. Si los imanes pierden energía o son destruidos, la nave se eleva por sí sola.
ycb.guide.builder.title = Constructor de esquemas
ycb.guide.builder.text = Una impresora de naves [accent]16x16[], construida fuera del modo de construcción. Nunca se convierte en parte de una nave. Tiempo de construcción del propio bloque: 6 minutos. Receta en Serpulo: 1000 de aleación eléctrica, 2000 de grafito, 1500 de plastanio.\n\n[accent]Elegir una nave.[] Pulsa el lápiz bajo el bloque: la lista muestra los esquemas de nave. Un esquema es una nave si mide hasta 16x16 casillas, tiene un núcleo o almacén, todos sus bloques se tocan entre sí y no contiene ningún constructor. Para crear uno: copia una nave en el modo de construcción (G) como esquema. Los esquemas que no son naves aparecen al final con el motivo.\n\n[accent]Dirección.[] El segundo botón (tras el lápiz) fija hacia dónde [accent]mira[] la nave impresa: derecha, arriba (como en el esquema), izquierda o abajo. Cada constructor nuevo empieza con el lado al que mira él mismo (no copia el ajuste de otro constructor). La nave siempre [accent]sale[] hacia el lado al que mira el constructor (gira el constructor con R antes de colocarlo; las flechas del suelo muestran la salida), sea cual sea el rumbo que elijas, y conserva el rumbo elegido.\n\n[accent]Imprimir[] es como una fábrica de unidades. Necesita los objetos del esquema (el precio de cada bloque) + 100 de tejido de fase, 3000 unidades de energía y 240 de líquido criogénico por segundo, y tarda 1,5 veces lo que tarda un jugador en construir todos los bloques. Admite todo tipo de líquido y toma hasta el doble de lo que necesita una nave. Una silueta naranja muestra el progreso, y las tres chimeneas arden mientras imprime.\n\n[accent]La nave nueva[] aparece en el aire sobre el bloque con el rumbo elegido, el constructor la lleva hacia el lado al que mira y luego sigue los módulos de su bloque de control de nave. [accent]Primer vuelo.[] El tercer botón (dos flechas hacia arriba) abre dos deslizadores: el número de bloques que se lleva la nave (0 a 50, 10 por defecto) y la velocidad (1 a 10 bloques por segundo, 2 por defecto). La nave se lleva exactamente a esa velocidad, sea cual sea su peso o sus motores. Con 0 bloques simplemente queda suspendida sobre el constructor (la velocidad es entonces 0 y no se puede cambiar). Bajo cada deslizador está su precio en pirotita, con una x entre ellos: la nave cuesta [accent]bloques x velocidad[] de pirotita más (20 por defecto). Una nave sin motor en marcha cae cuando termina el traslado. Los módulos Precarga de objetos, Carga de líquido y Unión al fabricar los lee el constructor.
ycb.guide.mods.title = Cómo funcionan los módulos
ycb.guide.mods.text = El bloque Control de nave ejecuta sus módulos [accent]uno tras otro de arriba abajo, y luego otra vez desde el primero[] (un círculo).\n\nUn módulo retiene la nave hasta que termina o no puede funcionar; entonces la recibe el siguiente. Un módulo que ahora no puede hacer nada (sin taladro, todo ocupado, el recurso ya está lleno) se omite. Con varios bloques de control en una nave, va primero el que se construyó antes. Las órdenes del modo de mando van antes que todos los módulos.\n\n[accent]Los colores[] son los de las instrucciones de un procesador: [#ff6060]rojo[] - obtener recursos y unirse; [#5aa0ff]azul[] - reposo; [#ffa040]naranja[] - lo que recibe una nave impresa; [#b280ff]morado[] - reglas; [#5fe070]verde[] - procesadores; [#40d8d0]turquesa[] - el centro de giro. Cada tarjeta muestra su estado con palabras (esperando, recogiendo, volando al punto, hecho, en pausa...).\n\nLos módulos se añaden con los botones bajo la lista y se pueden mover o quitar. Si levantas la nave de una zona de aterrizaje a mano, ese módulo de aterrizaje queda en pausa hasta que lo cambies. Un mineral, un punto o una zona de aterrizaje que una nave ha tomado está cerrado a las demás naves mientras sea su objetivo.
ycb.guide.modres.title = Recurso y Aterrizaje para recursos
ycb.guide.modres.text = [accent]Recurso[] (rojo). Elige un mineral, arena o un líquido que haya en el mapa y un porcentaje de llenado (50 % por defecto, de 0 a 100). Los objetos se cuentan según el espacio de los almacenes de la nave (núcleo, contenedores), los líquidos según sus depósitos y contenedores de líquido (sin depósito el líquido no está disponible). La nave necesita un taladro que pueda extraer ese mineral, o una bomba.\n\n[accent]Una pista no basta.[] Después de que la nave lleve 2 segundos en su veta, cuenta las casillas de las que sus taladros (bombas) realmente toman el mineral y las compara con el máximo que permite una veta: las casillas de todos sus taladros y bombas para ese recurso, pero no más de las que tiene la veta (una veta pequeña se cuenta tal cual). Si es menos de la mitad, la nave se mueve a otro sitio, espera allí 2 segundos y cuenta de nuevo, como máximo en 5 sitios en total (el primero incluido). Si ningún sitio llega a la mitad, vuelve al mejor y se queda allí. Solo prueba sitios donde sus taladros cubrirían más que el mejor hasta ahora, así que puede detenerse tras menos intentos. Esto vale para el módulo Recurso y para la orden Minar.\n\nLa nave vuela a la veta más cercana a su taladro o bomba (no a su centro), frena suavemente y se detiene en seco allí: sin empuje, sin giro, sin gastar combustible ni energía. Si algo la empuja más de una celda, vuelve. Cuando se alcanza el porcentaje, el módulo entrega la nave al siguiente. Después de cada comando se vuelve a elegir la veta más cercana desde donde está la nave ahora.\n\n[accent]Cada nave tiene su propio mineral.[] Una veta que una nave eligió queda cerrada a las demás naves de tu equipo (un círculo a su alrededor, para que dos naves no acaben una encima de otra) mientras sea su objetivo. Si la más cercana está tomada, se usa la siguiente libre; si todas están tomadas, la tarjeta dice «Todos los minerales / sitios están tomados por otras naves» y la nave sigue en el círculo.\n\n[accent]Aterrizaje para recursos[] (rojo). Una lista de zonas de aterrizaje (se usa la primera libre) y los recursos, objetos y líquidos, cada uno con un porcentaje. La nave vuela a la primera zona libre, aterriza y se queda hasta que cada recurso indicado alcanza su porcentaje (llénalo con cinta, descargador o a mano). Luego despega y entrega la nave al siguiente módulo. También elige el lado en que aterriza: como está, frente arriba / abajo / izquierda / derecha, o cualquiera que quepa.
ycb.guide.modrest.title = Punto de reposo
ycb.guide.modrest.text = [accent]Punto de reposo[] (azul) indica cómo y dónde reposa la nave.\n\n[accent]La nave[] se mantiene sobre un punto, o aterriza en una zona de aterrizaje. Elige con el botón. La lista contiene puntos del mapa (mantenerse) o zonas de aterrizaje (aterrizar); se prueban en orden, se usa la primera libre y las flechas cambian el orden. Un punto está ocupado si otra nave cuelga allí o vuela hacia él tan cerca que las naves se tocarían. Si ninguno está libre, la tarjeta lo dice y la nave continúa.\n\n[accent]Reposar mientras cada recurso indicado se mantenga al menos en...[] Una lista de recursos con un porcentaje cada uno. Cuando cualquiera de ellos cae por debajo de su porcentaje, el reposo termina y la nave pasa al siguiente módulo. El reposo no empieza mientras un recurso indicado ya está bajo (la nave se iría enseguida).\n\n[accent]Temporizador de reposo (opcional).[] Un botón lo activa y un campo fija los segundos (30 por defecto, hasta 3600). El reposo termina con lo que ocurra primero, el recurso o el temporizador. Sin lista ni temporizador el reposo nunca termina.\n\nSi ningún otro módulo quiere la nave, se queda en el punto de reposo.
ycb.guide.modrule.title = Reglas para taladros y bombas
ycb.guide.modrule.text = [accent]Regla[] (morado) indica qué recursos pueden tomar los taladros y las bombas de la nave. No es una tarea del piloto automático: ponla en cualquier sitio de la lista, el orden no importa.\n\n[accent]Objetivo.[] «Todos los taladros y bombas» (por defecto), o un solo bloque. Elígelo en la lista (su nombre y el desplazamiento desde el bloque de control) o tócalo en el mapa. El desplazamiento es el mismo en vuelo y en tierra, así que la regla no se rompe cuando la nave aterriza o despega. Si el bloque ya no está, la tarjeta dice «Bloque no encontrado».\n\n[accent]Modo.[] Lista blanca: el bloque toma solo los recursos indicados. Lista negra: toma todo salvo los indicados. Recursos de una regla: para un taladro, los minerales y la arena que puede extraer en absoluto, para una bomba los líquidos; para «todos», todo lo que puede tomar cualquier taladro o bomba de la nave.\n\n[accent]Cómo funciona.[] El taladro «no ve» un mineral prohibido: con dos minerales debajo y uno permitido, toma el permitido aunque haya más del prohibido. Una bomba elige su líquido del mismo modo. El piloto automático respeta las reglas: solo recoge un recurso con un taladro o bomba que pueda tomarlo; si todos están prohibidos, el módulo dice «Prohibido por una regla».\n\n[accent]Detalles.[] Una lista vacía no cambia nada. Varias reglas para un mismo bloque se aplican todas: un recurso tiene que pasar cada una. Una lista blanca limita solo el tipo que nombra: una lista de minerales no estorba a las bombas, una lista con agua y cobre limita a ambos. Las reglas funcionan mientras la nave vuela; en tierra los taladros son bloques normales.
ycb.guide.modcenter.title = Centro de giro
ycb.guide.modcenter.text = [accent]Centro[] (turquesa, un ajuste, no una tarea) fija el punto de la nave desde el que se mide todo: la nave gira alrededor de él (teclas Q y E, giro hacia el rumbo, el piloto automático, colisiones, imanes) y es el punto que vuela hacia un objetivo. Pon el módulo en cualquier sitio de la lista; si hay varios, cuenta el primero del bloque de control construido antes.\n\n[accent]Núcleo o almacén.[] Elige cuál en la lista o tocándolo en el mapa. Solo funciona si la nave tiene dos o más núcleos y almacenes; con uno el botón está desactivado y la tarjeta dice que hacen falta dos.\n\n[accent]Media de casillas[] (por defecto). La posición media de todas las casillas que ocupan los bloques; un bloque grande cuenta con cada casilla suya. Se mueve cuando se añaden o pierden bloques.\n\n[accent]Bloque elegido.[] Cualquier bloque de la nave; tócalo en el mapa (por defecto el propio bloque de control).\n\n[accent]Cómo funciona.[] El punto se fija al despegar. Cuando cambia más tarde (se añade o pierde un bloque, se cambia o quita el módulo), los bloques se quedan donde están en el mundo y solo se mueve el punto, así que la nave no da saltos. Durante las animaciones de aterrizaje y despegue el punto no cambia. Sin un módulo Centro, o cuando el módulo no puede funcionar (no hay tal bloque, un solo núcleo), la nave gira alrededor de su núcleo o almacén principal. El desplazamiento del bloque elegido se conserva cuando la nave aterriza girada. No se usa mientras la nave está en el suelo.
ycb.guide.modjoin.title = Unir naves con imanes
ycb.guide.modjoin.text = Dos módulos ayudan a las naves a encontrarse y unirse con imanes (véase el bloque Imán).\n\n[accent]Punto de unión[] (rojo, una tarea del piloto automático). Elige un punto en el mapa y un [accent]rumbo[] en grados (0 = como se construyó la nave, en sentido antihorario). La nave vuela al punto, gira al rumbo y se queda allí hasta que los imanes la unen con otra nave. Tras la unión el módulo está hecho y la nave toma el siguiente; si las naves se separan, vuelve al punto. Mientras los imanes la atraen no se resiste, de lo contrario las naves nunca podrían encontrarse.\n\n[accent]Unión al fabricar[] (naranja, sin ajustes, lo lee el Constructor de esquemas). Una nave impresa por el constructor vuela al punto adonde el constructor la envió, se queda allí con exactamente el rumbo con que se imprimió y no se mueve. Si algo la mueve, vuelve al punto con el rumbo exacto, hasta que los imanes la unen con otra nave. Mientras tanto los módulos del piloto automático no se ejecutan. Una orden del jugador o conducirla a mano termina la espera. La espera se guarda con la partida.\n\nJunto con los imanes, esto permite que el constructor imprima las partes de una nave grande que se ensamblan solas en el aire.
ycb.guide.modmisc.title = Procesadores, precarga, carga de líquido
ycb.guide.modmisc.text = [accent]Procesadores[] (verde, un ajuste, no una tarea). Elige un evento: la nave [accent]aterriza[], [accent]despega[] o [accent]recibe daño[]; elige una acción: activar, desactivar o alternar; y añade procesadores de la nave a la lista con el botón «+ Procesador». La acción es la misma que el comando propio del procesador «control enabled». El aterrizaje y el despegue cuentan siempre, también al entrar o salir del modo de construcción. El daño se comprueba varias veces por segundo y actúa como máximo dos veces por segundo. En el modo de construcción no se vigila el daño. Varios módulos son varias acciones.\n\nLos procesadores pueden apagar más cosas: el imán (sin atracción, sin consumo de energía), el constructor de esquemas (la impresión se detiene), el bloque de control de nave (sus módulos y reglas no funcionan) y cada propulsor (sin empuje, sin consumo de combustible ni energía; si todos están apagados la nave desciende en un aterrizaje de emergencia).\n\n[accent]Precarga de objetos[] (naranja, lo lee el constructor). Los objetos indicados aparecen en el almacén de una nave impresa por el constructor de esquemas (primero el núcleo). Se suman al precio: el constructor los toma también. Lo que no cabe se queda en el constructor. No hace nada en una nave construida a mano.\n\n[accent]Carga de líquido[] (naranja, lo lee el constructor). Los depósitos de una nave impresa se llenan con el líquido elegido hasta la parte elegida de su capacidad. El constructor lo vierte de sus propios depósitos (llévale conductos) y espera hasta tener suficiente.
ycb.guide.fly.title = En vuelo: bloques, taladros, torretas
ycb.guide.fly.text = [accent]Todo funciona.[] Las cintas transportadoras mueven objetos, los puentes y los cables mantienen sus enlaces, los descargadores, almacenes, generadores, fábricas y torretas funcionan como de costumbre. Una nave aterrizada vuelve a ser parte del mapa y allí funciona de la manera normal.\n\n[accent]Los taladros[] extraen lo que hay bajo la nave en ese momento: si el borde del taladro toca un mineral, lo extrae. El mineral cambia al vuelo mientras la nave se mueve, así que un taladro se puede colocar en cualquier sitio (véase Colocación libre) y llevarse sobre un mineral. [accent]Las bombas[] toman líquido del agua que tocan y lo pasan a los depósitos y conductos vecinos. Un conducto que termina en el vacío derrama su líquido sobre el suelo bajo la nave. Los generadores térmicos, los cultivadores y los extractores de agua leen el suelo bajo la nave voladora.\n\n[accent]Las torretas actúan como un solo cañón.[] Cuando la nave elige un objetivo (o disparas tú), todos los cañones giran hacia él y disparan juntos. Cada torreta tiene su propia munición y velocidad de giro. La puntería se adelanta al objetivo y cuenta la velocidad de la nave.\n\n[accent]Las balas conservan la velocidad de la nave.[] Como las balas de una unidad, las balas de sus cañones reciben sumada la velocidad de la nave (no los láseres, rayos y otros que en el juego no heredan velocidad). Una nave voladora cuenta como objetivo aéreo: las balas solo antiaéreas (flak) pueden darle, las balas solo contra tierra (artillería, llamas) no; los muros de fase reflejan las balas.\n\n[accent]Aspecto.[] Cada bloque proyecta una sombra. Un bloque dañado muestra grietas, cuanto más daño, más oscuras. Una nave voladora se dibuja por encima de la oscuridad del borde del mapa y de los muros gruesos, y no se oscurece allí.
ycb.guide.collide.title = Colisiones y peso
ycb.guide.collide.text = Cada celda ocupada pesa 1, así que una nave de 100 bloques es 100 veces más pesada que un solo bloque.\n\nCuando dos naves se tocan, intercambian [accent]momento[] (peso x velocidad) como bolas de billar: el momento total se conserva, pero parte de la energía cinética se pierde (el rebote no es ni perfectamente duro ni perfectamente blando, 0,25). Se separan en proporción inversa a sus pesos, así que la nave pesada apenas se mueve y la ligera sale despedida.\n\nEjemplo: 100 bloques a 1 casilla por segundo llevan un momento de 100, un bloque a 10 casillas por segundo solo 10, así que la nave grande sigue y la pequeña es lanzada hacia atrás.\n\nLos motores siguen funcionando durante el contacto: una nave ligera que empuja a una pesada no la mueve, y una nave pesada puede llevar delante a una ligera. Los golpes fuertes sacan chispas. La nave del jugador no tiene prioridad: solo decide el peso.\n\nLas naves no chocan mientras aterrizan o despegan. En el modo de construcción los bloques del mundo detienen a una nave como bloques normales; en vuelo el terreno no importa.\n\nLas naves más pesadas también giran más despacio (véase Empuje, velocidad y peso).
ycb.guide.damage.title = Daño, bloques que caen, choques
ycb.guide.damage.text = [accent]Daño.[] Las balas enemigas golpean bloques concretos de la nave (la armadura cuenta). Cuando se destruye un bloque que sostenía otros, todo lo que se desprendió del casco cae. Si se destruyen todos los núcleos y almacenes, toda la nave queda destruida y el resto de sus bloques cae.\n\n[accent]Bloques que caen.[] Cada grupo que se desprendió se convierte en escombros: conserva la velocidad y el giro de la nave en ese momento, reproduce la animación de aterrizaje 1,5 veces más rápido (sin humo ni polvo) y toca el suelo. Cada bloque inflige su vida a los [accent]enemigos[] que tiene debajo (una unidad muere cuando recibe al menos su vida). Después todos los bloques de los escombros son destruidos con la explosión habitual: el combustible y los inflamables se encienden, las baterías estallan, los líquidos se derraman. Los aliados no sufren daño. El modo de construcción no deja caer nada: allí los bloques sueltos solo se vuelven rojos.\n\n[accent]Aterrizar sobre enemigos.[] Cuando una nave desciende (cualquier aterrizaje, también G), cada unidad terrestre enemiga (también las que caminan) tocada por un bloque lucha contra los bloques que toca. Si los bloques tienen más vida en total que la unidad (vida + escudo), la unidad muere y los bloques pierden el 25 % de la vida de la unidad entre todos (pero ningún bloque baja de 1). Si no, la unidad pierde tanta vida como tenían los bloques y los bloques [accent]se rompen[] (explotan como cualquier bloque destruido). Si se rompe un núcleo o almacén, otro almacén de la nave ocupa su lugar; si no queda ninguno, la nave se deshace en bloques normales. Las unidades de tu propio equipo y las neutrales no sufren daño, solo se apartan al lugar libre más cercano.\n\n[accent]Choque.[] Una nave sin motor en marcha no elige lugar: cae exactamente donde la lleva su velocidad. Cada edificio que golpea se compara con la vida total de los bloques que caen. Más vida: el edificio se destruye y se sustituye, y los bloques pierden el 25 % de su vida. Menos o igual: los bloques se rompen y el edificio recibe un daño igual a su vida. Los bloques que caen sobre lo que no se puede construir (un muro del mapa, agua profunda, más allá del borde) se rompen. [accent]Zona de aparición.[] Cuando empieza una oleada, el juego destruye todo lo tuyo cerca de las apariciones terrestres (el círculo rojo). Una nave voladora no está a salvo sobre ella: cada bloque que está dentro del círculo en ese momento se arranca y cae como cualquier bloque que perdió su sujeción (una caída de emergencia). Lo que sostenían los bloques arrancados cae con ellos; si se arranca el casco, toda la nave desciende. Las naves del equipo de la oleada no se tocan.
ycb.guide.fire.title = Fuego y explosiones
ycb.guide.fire.text = Una nave voladora tiene sus propios fuegos y explosiones, ligados al suelo que hay bajo ella. Una nave aterrizada está en el mapa, allí funciona el fuego propio del juego.\n\n[accent]Fuego.[] Arde un fuego en cada celda en llamas de un bloque.\n- Empieza con balas incendiarias, con un bloque destruido que tenía inflamables dentro (carbón, petróleo, esporas...), y el fuego del suelo bajo los bloques pasa a la nave al despegar (y de vuelta al suelo al aterrizar).\n- Cada medio segundo golpea su bloque (2,5 de daño x la fuerza del fuego, la armadura no cuenta). Sin combustible vive unos 17 segundos.\n- Mientras el bloque contiene inflamables el fuego crece (hasta x4 de daño) y dura más; sin ellos se apaga.\n- Se extiende a los bloques vecinos y cada 0,75 segundos puede caer hacia abajo: si hay un bloque de suelo debajo, allí empieza un fuego real.\n- Un bloque con agua u otro líquido extintor (10 unidades o más) apaga su fuego rápido. Las torretas Wave de una nave no apagan sus fuegos por sí solas.\nUna nave admite hasta 400 fuegos; no se guardan.\n\n[accent]Explosiones.[] Un bloque que muere explota según los números del juego: la explosividad, la inflamabilidad y la carga de lo que hay dentro.\n- Las ondas golpean los bloques de todas las naves voladoras dentro del radio, también la propia. En el borde el daño es del 40 %. La armadura cuenta.\n- [accent]Las baterías[] (y cualquier bloque con carga) se descargan: daño = carga / 25, como máximo 600; los bloques que necesitan energía reciben x1,5.\n- Un [accent]reactor de torio[] (y un reactor de impacto) vuela todo a su alrededor con su propio radio y daño (19 casillas y 5000 para el torio). Solo explota cuando está cargado: combustible 5 o más o calor 0,5 o más, y si las reglas permiten explosiones de reactor.\n- Un bloque de nave destruido sigue provocando la explosión del juego en el suelo de abajo (bloques que se rompen, fuegos, rayos). Un bloque de suelo que muere golpea a las naves que tiene encima del mismo modo.\nLas explosiones se encadenan con un retardo de algunos ticks, como las ondas del juego. Se respetan las reglas de fuego, daño de explosiones y explosiones de reactor.
ycb.guide.units.title = Proyectores y fábricas de unidades
ycb.guide.units.text = [accent]Reparadores y proyectores.[] Un reparador, un proyector de reparación y un proyector de aceleración en una nave voladora actúan sobre los bloques de [accent]esa nave[], no sobre los bloques reales de debajo: los reparadores curan los bloques dañados, el proyector de aceleración acelera los bloques. El proyector de escudo crea su campo alrededor de la nave, dibujado como el del propio juego. Un procesador puede apagar un proyector. En una nave aterrizada los bloques están en el mapa y funcionan de la manera normal.\n\n[accent]Fábricas de unidades.[] Una fábrica de unidades (y un reconstructor) en una nave voladora conserva una unidad terminada solo si el bloque de delante la acepta: una cinta transportadora de carga, un enrutador, una catapulta electromagnética y así, o un reconstructor que pueda mejorar esa misma unidad. Si no:\n- una unidad [accent]aérea[] sale volando (también cuando hay un bloque delante: ya no se queda dentro para siempre);\n- una unidad [accent]terrestre, con patas o naval[] cae al suelo real bajo la nave: al lugar más cercano donde pueda estar (hasta 5 casillas del punto), con una nube de polvo y parte de la velocidad de la nave. Una unidad naval que cae fuera del agua muere, como en el juego.\nUn reconstructor al final de una cadena deja salir la unidad del mismo modo cuando no tiene adónde mejorarla. Se respeta el límite de unidades: en el límite la unidad espera en la fábrica.
ycb.guide.planets.title = Otros planetas y mods
ycb.guide.planets.text = [accent]Todos los bloques del mod están disponibles en todos los planetas[], también en Erekir y en los planetas de otros mods. Siempre están desbloqueados (nada que investigar), se muestran en la pestaña Unidades (el bloque de control de nave en Lógica) y se pueden colocar en cualquier sitio, también en el espacio y bajo el agua.\n\n[accent]Recetas.[] En Serpulo se usan las recetas clásicas. En cualquier otro planeta un bloque se hace con los primeros recursos de la lista del planeta; cuanto más antiguo el bloque, más toma:\n- Propulsor de cohete: 2 recursos, 20 y 10\n- Zona de aterrizaje: 2 recursos, 20 y 20\n- Propulsor de energía: 3 recursos, 100, 50 y 30\n- Control de nave: 3 recursos, 50, 300 y 120\n- Propulsor de combustible: 4 recursos, 300, 400, 100 y 200\nSi el planeta tiene menos recursos, se usan todos. El Constructor de esquemas usa el último recurso del planeta (en lugar de la aleación eléctrica y el tejido de fase) y los dos primeros (en lugar del grafito y el plastanio).\n\n[accent]La lista de recursos de un planeta[] va en el orden en que el planeta los da: su árbol de investigación, nivel por nivel (solo objetos); luego los otros recursos hechos para este planeta en el orden en que el mod los declaró; solo si el planeta no tiene ninguno, los demás recursos.\n\n[accent]Combustible.[] En Serpulo arden el carbón, las vainas de esporas y la pirotita. Cualquier objeto de otro mod con inflamabilidad 0,3 o más también es combustible, con empuje 10 x inflamabilidad (como máximo 20). Donde nada arde (Erekir), los recursos más volátiles del planeta pasan a ser el combustible. El impulso líquido lo dan todavía solo el agua y el líquido criogénico.\n\nLas recetas se vuelven a calcular al cargar un mundo o sector y cuando cambia el planeta del juego.
ycb.guide.multi.title = Multijugador
ycb.guide.multi.text = El mod funciona en un jugador, para el anfitrión y en un servidor dedicado. [accent]El mod, de la misma versión, hace falta en el servidor y en cada cliente.[]\n\n[accent]Cómo funciona.[] El servidor hace todo el trabajo de las naves: vuelo, aterrizaje y despegue, daño, fuego, piloto automático, órdenes. Un cliente no ejecuta la lógica de las naves; guarda una copia de cada nave y la dibuja. Se sincronizan el vuelo, las animaciones de despegue y aterrizaje con polvo, la puntería de las torretas, los motores en marcha, el daño, el fuego, los disparos y las explosiones.\n\n[accent]Un cliente puede[] conducir una nave (Y, Shift+Y o Ctrl + clic), darle órdenes del modo de mando (mover, Aterrizar, Despegar) y usar G e Y. Solo el anfitrión (el propio servidor) puede configurar el bloque Control de nave y el Constructor de esquemas.\n\n[accent]El modo de construcción es local.[] G está activado solo para ti: la nave que eliges (en la que estás sentado, si no la que está bajo el cursor, si no la más cercana) aterriza, las demás siguen volando. La [accent]máscara violeta[] es la capa de la nave; las celdas con la máscara las ven todos los jugadores, y una nave que alguien está editando ahora tiene una máscara más brillante y parpadeante. Los bloques que colocas en G se ven violetas para los demás hasta que sales. Salir de G solo levanta las naves que se quedan sin editores; una nave aterrizada (aparcada) se queda en el suelo.\n\n[accent]Guardado.[] Las naves se guardan en un bloque propio del archivo de guardado, así que incluso las bases grandes se guardan sin el error «encoded string too long». Las partidas antiguas también se cargan.
ycb.guide.settings.title = Ajustes, límites y consejos
ycb.guide.settings.text = [accent]Ajustes[] (Ajustes, la página del mod):\n- Empuje de un propulsor de cohete: 45 casillas por segundo por casilla de la nave por defecto. La velocidad de cada nave depende de él.\n- Girar la nave voladora hacia la dirección de conducción: activado por defecto.\n- El botón de la guía de YCB.\n\n[accent]Límites.[]\n- Una nave mide como máximo unos 110 bloques de ancho.\n- Los bloques en construcción no se mueven: termínalos antes de despegar.\n- La colocación libre funciona solo en el modo de construcción y solo para bloques cuyo terreno comprueba el juego (taladros, bombas, generadores térmicos y similares). El núcleo debe tener al menos un objeto de cada tipo necesario.\n- Los objetos de un almacén que se cortó y se eliminó al salir del modo de construcción se pierden.\n- Los enemigos terrestres encuentran el camino a los núcleos por el mapa: mientras un núcleo vuela, no lo encuentran así. Cualquier enemigo que vea una nave y dispare al aire puede atacarla.\n- El piloto automático cede ante las órdenes del modo de mando. Un aterrizaje por un módulo necesita espacio bajo toda la nave. Durante un aterrizaje o despegue la nave no se puede dirigir y las órdenes no funcionan.\n- Los propulsores no se reflejan al girar.\n- Los enemigos apuntan al centro de una nave voladora, no a bloques sueltos. Los láseres, los rayos y los campos de energía (Navanax, Aegires) no dañan sus bloques, y un Parallax enemigo no puede atraerla.\n- Los perforadores de plasma y los trituradores de paredes no extraen de las paredes mientras la nave vuela.\n\n[accent]Consejos.[]\n- Copia una nave en el modo de construcción como esquema: el constructor puede imprimirla, y los módulos de su bloque de control vienen con ella.\n- Pon zonas de aterrizaje cerca de tus taladros y dale a la nave un módulo de Aterrizaje para recursos: recoge y descarga por sí sola.\n- Varios imanes en una nave la atraen más fuerte; ponlos en el lado que mira hacia el compañero.\n- Si una nave no despega, mira en la parte superior de la pantalla la pista de los propulsores y comprueba el combustible y la energía.
