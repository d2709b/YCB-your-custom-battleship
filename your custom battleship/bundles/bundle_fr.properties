mb.hud.build = Mode construction de vaisseau volant. Les blocs que vous placez rejoignent le vaisseau volant ; les blocs non rattachés à la coque sont marqués en rouge et supprimés à la sortie. Y déplace le bloc sous le curseur entre la couche du monde (bleu) et la couche du vaisseau volant ; maintenez Y et tracez un carré pour déplacer tous les blocs qu'il contient (départ sur un bloc du monde : ils rejoignent le vaisseau volant ; départ sur un bloc du vaisseau volant : ils le quittent). La flèche verte sur un noyau / stockage indique l'avant du vaisseau volant : R la fait tourner (Shift+R dans l'autre sens). Les foreuses, pompes, générateurs thermiques et autres blocs liés au sol peuvent être placés n'importe où ici.
