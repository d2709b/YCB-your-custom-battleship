mb.hud.build.mobile = Mode construction de vaisseau volant. Les blocs que vous placez rejoignent le vaisseau volant ; les blocs non rattachés à la coque sont marqués en rouge et supprimés à la sortie. « Déplacer des blocs » envoie un bloc vers l'autre couche (monde / vaisseau volant). « Tourner l'avant du vaisseau volant » fait tourner la flèche verte du vaisseau volant au milieu de l'écran.
