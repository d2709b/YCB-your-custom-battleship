ycb.guide.theme.world = Monde et paramètres
ycb.guide.idea.title = Qu'est-ce qu'un vaisseau volant
ycb.guide.idea.text = Un vaisseau volant est une unité construite à partir de blocs. Sa coque est un [accent]noyau[] ou un [accent]stockage / conteneur[]. Chaque bloc rattaché à la coque (côte à côte, même à travers d'autres blocs) fait partie du vaisseau.\n\nEn vol, le vaisseau n'est pas sur la grille de cases : les convoyeurs, les câbles et les tourelles du monde ne le voient pas et ne le touchent pas. Il n'interagit qu'avec les autres vaisseaux, les ennemis et les projectiles. Il se déplace et tourne selon [accent]n'importe quel angle[], pas case par case, et chacun de ses blocs continue de fonctionner en vol : les convoyeurs déplacent les objets, les foreuses extraient, les usines produisent, les générateurs fournissent de l'énergie, les tourelles tirent. Chaque bloc projette une ombre au sol, comme une unité volante.\n\nSeul ce que vous avez transformé en vaisseau est un vaisseau. Un noyau ordinaire posé sur la carte n'en est pas un tant que vous n'appuyez pas sur [accent]Y[] dessus en mode construction ([accent]G[]) ou que vous n'y construisez pas une coque.\n\nUn vaisseau a besoin de [accent]propulseurs[] (moteurs) : sans eux, il ne vole pas. Vitesse = poussée totale des propulseurs x puissance d'un propulseur à fusée / nombre de blocs du vaisseau : plus le vaisseau est lourd, plus il est lent.
ycb.guide.first.title = Votre premier vaisseau, pas à pas
ycb.guide.first.text = [accent]1.[] Posez un noyau ou un stockage / conteneur au sol (ou utilisez-en un que vous avez déjà).\n[accent]2.[] Appuyez sur [accent]G[] (sur téléphone : le bouton de construction). Le mode construction est activé : la grille s'affiche et tout ce qui ne fait pas partie d'un vaisseau est peint en bleu (la couche du monde).\n[accent]3.[] Pointez le noyau / stockage et appuyez sur [accent]Y[] (sur téléphone : le bouton Déplacer des blocs, puis touchez-le). Il devient un vaisseau et une flèche verte, son avant, apparaît dessus.\n[accent]4.[] Construisez des blocs à côté : chaque bloc que vous posez en contact avec le vaisseau le rejoint aussitôt. Les blocs déjà posés au sol le rejoignent avec [accent]Y[] (maintenez Y et tracez un carré pour en déplacer beaucoup d'un coup).\n[accent]5.[] Mettez-y au moins un propulseur, un propulseur à fusée suffit pour commencer. Sans propulseurs, un message clignotant « Il faut des propulseurs (moteurs) ! » s'affiche en haut de l'écran.\n[accent]6.[] Alimentez ce qui doit l'être : de l'énergie pour les propulseurs à énergie, du charbon / des spores / de la pyratite pour les propulseurs à carburant, des munitions pour les tourelles.\n[accent]7.[] Appuyez de nouveau sur [accent]G[] : le vaisseau décolle. Appuyez sur [accent]Y[] (curseur loin des blocs) pour y entrer et voler avec [accent]WASD[]. [accent]Shift+Y[] le fait atterrir.\n\nLes blocs qui ne sont pas rattachés à la coque sont marqués en rouge et supprimés quand vous quittez le mode construction (une partie des ressources est rendue).
ycb.guide.layers.title = Couches : monde et vaisseau
ycb.guide.layers.text = Chaque bloc est sur l'une de deux couches. La [accent]couche du monde[] est la carte ordinaire : ses blocs sont peints en bleu en mode construction. La [accent]couche du vaisseau[] contient les blocs des vaisseaux (ils portent un masque violet en mode construction).\n\n[accent]Y[] fait passer le bloc sous le curseur à l'autre couche ; le bloc doit toucher le vaisseau. Maintenez [accent]Y[] et tracez un carré (comme la sélection avec F / B) : tous les blocs du carré changent de couche d'un coup. Le bloc sur lequel vous commencez donne le sens :\n- départ sur un bloc du monde : les blocs du monde dans le carré rejoignent le vaisseau (un bâtiment entier le rejoint d'un coup, chaîne par chaîne en partant du vaisseau) ;\n- départ sur un bloc du vaisseau : les blocs du vaisseau dans le carré quittent le vaisseau et deviennent des blocs ordinaires (les blocs qui ne tenaient que par eux deviennent rouges) ;\n- départ sur une case vide : les blocs du monde rejoignent ; s'il n'y en a pas, les blocs du vaisseau partent.\nLes blocs des autres équipes et les blocs en construction ne sont pas touchés. Le cadre montre ce qui va changer : la couleur de la couche du vaisseau signifie rejoindre, le bleu clair signifie quitter.\n\nUn noyau ou un stockage qui n'est rattaché à rien devient un nouveau vaisseau quand il rejoint. Un groupe de blocs avec son propre noyau ou stockage est un vaisseau distinct : il n'est pas supprimé, il décolle de lui-même.\n\nSur téléphone, le bouton Déplacer des blocs remplace la touche Y : touchez un bloc ou tracez un carré.
ycb.guide.pc.title = Touches sur PC
ycb.guide.pc.text = Il n'y a pas de panneau de boutons sur PC : tout se fait au clavier.\n\n[accent]G[] - mode construction activé / désactivé. Le vaisseau que vous pilotez (sinon celui le plus proche du curseur) se pose sur la grille, face vers le haut, et se déplace case par case. Appuyez de nouveau : il décolle.\n[accent]Y[] hors du mode construction - un bloc de votre équipe sous le curseur change de couche ; ailleurs, vous entrez dans un vaisseau / le quittez. [accent]V[] quitte aussi un vaisseau.\n[accent]Shift+Y[] hors du mode construction - faire atterrir le vaisseau, ou le relever s'il est posé (comme les ordres Atterrir / Décoller).\n[accent]Y[] en mode construction - déplacer le bloc sous le curseur entre les couches ; maintenez-le et tracez un carré pour déplacer beaucoup de blocs.\n[accent]R[] en mode construction - tourne la flèche avant du vaisseau de 90 degrés ([accent]Shift+R[] dans l'autre sens). Sur un bloc que le jeu sait orienter lui-même (un convoyeur), R tourne le bloc à la place.\n[accent]WASD[] - voler. Par défaut, le vaisseau se tourne dans le sens du vol (un paramètre).\n[accent]Q / E[] - tourner le vaisseau à la main selon n'importe quel angle.\n[accent]Bouton gauche de la souris[] (maintenu) - toutes les tourelles se tournent vers le curseur et tirent ensemble.\n[accent]Ctrl + bouton gauche de la souris[] sur un vaisseau - en prendre le contrôle, comme de n'importe quelle unité.
ycb.guide.phone.title = Commandes sur téléphone
ycb.guide.phone.text = Sur téléphone, le panneau des boutons est à gauche de l'écran. La flèche au-dessus le masque et l'affiche.\n\nLe panneau contient : le mode construction (comme G), entrer dans / quitter un vaisseau (comme Y), poser / relever le vaisseau (comme Shift+Y). En mode construction, deux boutons de plus apparaissent : [accent]Déplacer des blocs[] (comme Y) et [accent]Tourner l'avant[] (comme R). Pour un vaisseau posé, les flèches sous les boutons le déplacent case par case.\n\nUn vaisseau volant suit le [accent]centre de l'écran[] : faites glisser la carte avec un doigt et le vaisseau vole vers le centre, tourne son avant vers lui, ralentit en douceur et s'y arrête. Toucher un vaisseau n'y entre pas, utilisez le bouton d'entrée.\n\n[accent]Déplacer des blocs[] : appuyez une fois pour l'activer (il s'allume). Un toucher sur un bloc l'envoie sur l'autre couche ; un carré tracé déplace tous les blocs qu'il contient (le bloc de départ donne le sens, comme avec Y). Tant qu'il est activé, la carte ne défile pas. Appuyez de nouveau sur le bouton pour terminer.\n\n[accent]Tourner l'avant[] : tourne de 90 degrés dans le sens antihoraire le vaisseau au centre de l'écran (sinon celui où vous êtes, sinon le plus proche posé). Quatre touchers font un tour complet.
ycb.guide.build.title = Mode construction (G)
ycb.guide.build.text = Le mode construction sert à créer et modifier des vaisseaux.\n\n- Le vaisseau se pose sur la grille, face vers le haut, et vous le déplacez case par case (8 cases par seconde). La grille est affichée, la couche du monde est bleue.\n- Les blocs que vous posez en contact avec le vaisseau le rejoignent aussitôt. Un bloc qui a perdu son lien avec la coque est marqué en rouge et supprimé quand vous quittez le mode (une partie des ressources est rendue). Un groupe de blocs avec son propre noyau ou stockage n'est pas supprimé : il devient un vaisseau à part entière.\n- [accent]Avant.[] Chaque noyau / stockage d'un vaisseau affiche une flèche verte, l'avant. [accent]R[] la tourne (toutes les coques du vaisseau à la fois). Quand vous pilotez avec « tourner dans le sens du vol » activé, le vaisseau se tourne pour que le côté de la flèche regarde vers l'avant. Les tourelles sans cible regardent vers l'avant. Après le mode, le vaisseau décolle dans la même position ; seul le côté considéré comme l'avant change.\n- [accent]Pose libre.[] Les foreuses, pompes, générateurs thermiques, extracteurs d'eau et autres blocs liés au sol peuvent être posés n'importe où : pas besoin de minerai, d'eau ni de chaleur. Choisissez le bloc et cliquez (touchez sur téléphone) comme d'habitude ; il coûte autant et prend autant de temps. Le noyau doit contenir au moins un exemplaire de chaque objet nécessaire au bloc. Fonctionne aussi pour les schémas collés (leurs fantômes sont blancs).\n- [accent]Coller un schéma.[] Les blocs sont terminés dans n'importe quel ordre. Les blocs terminés qui ne touchent encore rien attendent en rouge ; dès qu'une chaîne atteint un noyau / stockage, tout le schéma devient un seul vaisseau.\n- Les blocs en construction ne bougent pas : terminez-les avant le décollage.\n- Les propulseurs et les aimants peuvent aussi être posés hors du mode construction : ce sont des blocs au sol jusqu'à ce que Y ou le mode construction en fasse une partie du vaisseau.\n- Si un vaisseau n'a pas de propulseurs, un message clignotant s'affiche en haut.
ycb.guide.landing.title = Atterrissage et décollage
ycb.guide.landing.text = [accent]Shift+Y[] (PC) ou le bouton Poser (téléphone) fait atterrir le vaisseau que vous pilotez, ou le plus proche, sans le mode construction. Appuyez de nouveau pour le relever. Un vaisseau en cours de modification en mode construction est laissé à G.\n\n[accent]L'animation.[] Le vaisseau descend lentement : son ombre glisse sous lui, il se tourne avant vers le haut et glisse jusqu'aux cases exactes ; au contact, des nuages de poussière se dégagent, comme lors de l'atterrissage d'un noyau sur une planète (leur nombre et leur taille dépendent du poids et de la largeur du vaisseau). Le décollage est identique à l'envers, la poussière vient progressivement. Le vaisseau ne peut pas être dirigé pendant ce temps et n'entre pas en collision avec les autres vaisseaux. Cela dure d'environ 1,3 à 8 secondes, un vaisseau lourd et lent met le plus de temps. Le mode construction (G) pose et relève aussitôt, sans animation.\n\nS'il n'y a pas de place libre sous tout le vaisseau, il n'atterrit pas et continue de voler. Un vaisseau qui atterrit se tourne en entier vers le côté le plus proche (haut, droite, bas, gauche) : ses blocs, ses tourelles et sa flèche avant tournent avec lui.\n\n[accent]Ordres.[] En mode commande (RTS), le panneau de commandes contient [accent]Atterrir[] et [accent]Décoller[]. Un vaisseau posé qui reçoit un ordre de déplacement ou d'attaque s'élève d'abord, puis part. Les ordres du joueur passent avant le pilotage automatique.\n\n[accent]La rangée de postures[] sous les ordres contient [accent]Désactiver le bloc de contrôle du vaisseau[] (la grille barrée). Tant qu'elle est activée, les blocs de contrôle de tous les vaisseaux sélectionnés n'envoient aucun signal : aucun module ne tourne, aucun processeur n'est basculé, rien n'est joint par les aimants. Le vaisseau reste où il est jusqu'à ce que vous lui donniez un ordre ; les règles pour foreuses et pompes restent. [accent]Miner[] (pour les vaisseaux qui ont une foreuse) fonctionne comme pour mono et poly : cochez les minerais sous l'ordre (ou Auto). Le vaisseau vole vers le filon libre le plus proche du minerai dont il a le moins, y pose sa foreuse et reste jusqu'à ce que ses stockages soient pleins ; ensuite il reste en suspens là où il est. Auto ignore le sable. Cela ne dépend pas des blocs de contrôle.\n\nBloc [accent]Aire d'atterrissage[] : un vaisseau avec un module d'atterrissage s'y pose de lui-même (voir les thèmes Blocs et Pilotage automatique).\n\n[accent]Atterrissage d'urgence.[] Si aucun moteur ne fonctionne pendant plus d'une demi-seconde (aucun du tout, plus de carburant, plus d'énergie, désactivés), le vaisseau tombe : il garde sa vitesse, ne se dirige plus et atterrit là où sa vitesse le porte. Ce sur quoi il atterrit affronte ses blocs (voir Dégâts, chute de blocs et crashs).
ycb.guide.thrust.title = Poussée, vitesse et poids
ycb.guide.thrust.text = La poussée se compte en [accent]propulseurs à fusée[] : un propulseur à fusée = 1.\n\n[accent]Vitesse[] d'un vaisseau = poussée totale de ses propulseurs x la poussée d'un propulseur à fusée (45 cases par seconde par case du vaisseau par défaut, voir Paramètres) / le nombre de cases occupées par le vaisseau. Deux fois plus lourd = deux fois plus lent.\n\n[accent]Rotation.[] Un vaisseau plus lourd tourne aussi plus lentement : la vitesse de rotation est divisée par (1 + poids / 60). Un vaisseau de 60 blocs tourne deux fois moins vite qu'un minuscule, un de 180 blocs quatre fois moins ; aucun vaisseau ne tourne à moins de 6 degrés par seconde.\n\nLes moteurs fonctionnent tout le temps que le vaisseau est en l'air. Quand il [accent]se déplace[], ils utilisent toute leur puissance, tout leur carburant et tout leur liquide ; quand il ne fait que [accent]faire du surplace[] (immobile, ou en descente), ils en utilisent [accent]la moitié[], le cercle jaune clignote deux fois moins vite et ils dégagent moitié moins de fumée ; quand il [accent]décolle[], ils dégagent deux fois plus de fumée. Les moteurs d'un vaisseau posé sont éteints. Un propulseur que vous avez désactivé avec un processeur ne donne aucune poussée. Quand aucun moteur ne fonctionne, le vaisseau descend en atterrissage d'urgence.\n\nUn propulseur en marche affiche au milieu un cercle jaune clignotant et dégage de la fumée comme une foreuse : le propulseur à fusée une fois par seconde, le propulseur à énergie deux fois, le propulseur à carburant trois fois (vaisseau en mouvement ; voir plus haut pour le surplace et le décollage).\n\nLe plus grand vaisseau fait environ 110 blocs de large.
ycb.guide.rocket.title = Propulseur à Fusée
ycb.guide.rocket.text = Le moteur de base. 1x1, poussée 1. Il n'a besoin de rien pour fonctionner.\n\nRecette sur Serpulo : 20 cuivre, 10 plomb, 5 graphite. Sur les autres planètes, il est fait des 2 premières ressources de la planète (voir Autres planètes et mods).\n\nComme il n'a besoin ni de carburant ni d'énergie, quelques propulseurs à fusée sont le moyen le plus simple de faire voler un petit vaisseau. Pour un gros vaisseau, il en faut beaucoup ou des moteurs plus puissants : le propulseur à énergie (6 propulseurs à fusée) et le propulseur à carburant (14 à 17 propulseurs à fusée avec le seul carburant).\n\nIl peut être posé dans n'importe quel mode. Hors du mode construction, c'est un bloc au sol ordinaire ; Y ou le mode construction (G) en fait une partie du vaisseau. Il peut être désactivé avec un processeur (control enabled).
ycb.guide.energy.title = Propulseur à Énergie
ycb.guide.energy.text = Un moteur 2x2 avec la poussée de [accent]6 propulseurs à fusée[].\n\n[accent]Énergie :[] 90 unités d'énergie par seconde quand le vaisseau se déplace ou décolle, 45 quand il fait seulement du surplace. En cas de manque d'énergie, la poussée baisse proportionnellement ; sans énergie, il ne fonctionne pas. Alimentez-le avec les batteries ou générateurs du vaisseau.\n\n[accent]Boost liquide (facultatif).[] Alimentez-le en eau ou en liquide cryogénique par des conduits : l'eau double la poussée (x2 = 12 propulseurs à fusée), le liquide cryogénique donne x2,5 (15). Il consomme 10 unités de liquide par 10 secondes de fonctionnement (moitié moins quand le vaisseau fait seulement du surplace), et le réservoir en contient 20, un seul liquide à la fois. Sans liquide, il fonctionne quand même, en moins puissant.\n\nPointez-le (PC) et le panneau montre ce qui manque au moteur : l'énergie ou le liquide manquant est barré en rouge, et la poussée actuelle est indiquée en dessous. Un vaisseau volant affiche ce panneau près du curseur.\n\nIl s'illumine avec son énergie. Recette sur Serpulo : 100 cuivre, 50 plomb, 30 silicium, 20 plastanium. Sur les autres planètes : les 3 premières ressources de la planète.
ycb.guide.fuel.title = Propulseur à Carburant
ycb.guide.fuel.text = Un moteur 3x3 qui brûle du carburant : un objet par 8 secondes de fonctionnement (un par 16 secondes quand le vaisseau fait seulement du surplace).\n\n[accent]Carburant et poussée :[] charbon 14 propulseurs à fusée, spores 15, pyratite 17,3. Il contient jusqu'à 20 objets de chaque sorte ; quand il en a plusieurs sortes, la plus faible brûle en premier. Alimentez-le avec des convoyeurs ou des déchargeurs ; un déchargeur peut aussi en retirer le carburant. Sans carburant, il ne fonctionne pas.\n\n[accent]Boost liquide (facultatif) :[] eau x1,25, liquide cryogénique x3 (charbon 42, spores 45, pyratite 52). 20 unités de liquide sont consommées par objet brûlé ; le réservoir en contient 120.\n\n[accent]Sur les autres planètes et avec d'autres mods[], tout objet inflammable est un carburant, avec une poussée de 4 + 10 x son inflammabilité (20 au plus). Là où rien ne brûle, les ressources les plus volatiles de la planète sont utilisées.\n\nRecette sur Serpulo : 300 cuivre, 400 plomb, 100 graphite, 100 plastanium, 200 titane. Sur les autres planètes : les 4 premières ressources de la planète.
ycb.guide.control.title = Contrôle du Vaisseau
ycb.guide.control.text = Le pilote automatique d'un vaisseau. Un bloc 2x2 dans l'onglet [accent]Logique[]. Recette sur Serpulo : 50 cuivre, 300 plomb, 120 silicium.\n\nPosez-le en mode construction (comme les propulseurs) ; plusieurs peuvent se trouver sur un même vaisseau. Appuyez sur le [accent]crayon[] du bloc : un panneau plein écran s'ouvre, où vous ajoutez des [accent]modules[]. Les modules sont décrits dans le thème « Modules de pilotage automatique ».\n\nLe pilote automatique ne dirige qu'un vaisseau en vol et un vaisseau posé par l'un de ses modules. Un vaisseau que vous avez posé vous-même (G, Shift+Y, le bouton Poser) est laissé tranquille. Les ordres du mode commande (déplacer, attaquer, atterrir, décoller) passent avant tous les modules, et piloter le vaisseau à la main arrête le pilote automatique tant que vous pilotez.\n\nLes réglages du bloc (modules, pourcentages, points, listes d'aires, minuteurs) sont enregistrés avec le vaisseau, avec la sauvegarde de la partie et avec les schémas : copier et coller les conserve.\n\nUn processeur peut désactiver le bloc (control enabled) : ses modules et ses règles ne fonctionnent alors plus.\n\nSur le serveur de quelqu'un d'autre, seul l'hôte (le serveur lui-même) peut configurer le bloc.
ycb.guide.spot.title = Aire d'Atterrissage
ycb.guide.spot.text = Un simple bloc 1x1 au sol. Recette sur Serpulo : 20 cuivre, 20 plomb. Posez-la [accent]hors[] du mode construction.\n\nSeule, elle ne fait rien. Un vaisseau avec un module d'atterrissage (Atterrissage pour ressources, ou Point de repos en mode « se pose ») vole jusqu'à elle et atterrit : l'un des stockages du vaisseau (le noyau ou un conteneur) doit recouvrir l'aire. L'aire n'est pas détruite : elle est seulement recouverte tant que le vaisseau s'y trouve et revient quand il décolle. Le reste du vaisseau a besoin de sol libre autour de lui ; si quelque chose gêne, le vaisseau n'atterrit pas et continue de voler.\n\nUne aire avec un vaisseau dessus, ou avec un vaisseau qui vole vers elle, est prise : les autres vaisseaux de votre équipe utilisent la prochaine aire libre de leur liste.\n\nSi vous relevez un vaisseau de son aire à la main (l'ordre Décoller ou en le pilotant), son module d'atterrissage est mis en pause et ne le repose pas tant que vous ne modifiez pas le module.
ycb.guide.magnet.title = Aimant
ycb.guide.magnet.text = Un bloc orientable 1x1 avec un avant (rouge) et un arrière (bleu). Il consomme 10 unités d'énergie par seconde. Recette sur Serpulo : 40 cuivre, 30 silicium, 20 titane. Peut être posé dans les deux modes (hors du mode construction, c'est un bloc au sol jusqu'à ce que Y ou G en fasse une partie d'un vaisseau).\n\n[accent]Attraction.[] Un aimant d'un vaisseau attire les aimants d'un [accent]autre[] vaisseau de votre équipe situés à moins de 5 cases et tournés dans l'autre sens (l'avant de l'un regarde l'autre aimant et l'avant de l'autre regarde dans la même direction : avant contre arrière). L'attraction est aussi forte que 3 propulseurs à fusée et faiblit avec la distance, jusqu'à zéro à 5 cases. Elle donne de la vitesse comme les moteurs (attraction x puissance du propulseur / cases du vaisseau) : un gros vaisseau ne bouge presque pas, un petit arrive vite (pas plus vite que 6 cases par seconde). Chaque aimant attire une fois : un vaisseau avec dix aimants est attiré dix fois plus fort. Les vaisseaux tournent aussi, chacun autant que son poids le permet, jusqu'à ce que les aimants regardent dans la même direction, et se placent côte à côte.\n\n[accent]Jonction.[] Quand deux aimants partenaires sont à environ 1,5 case l'un de l'autre, regardent dans la même direction à 10 degrés près et que les blocs peuvent être réunis sans se chevaucher, le vaisseau le plus léger entre dans le plus lourd : ils deviennent [accent]UN seul vaisseau[], avec un seul poids et la poussée de tous les moteurs. Celui qui pilotait le vaisseau absorbé pilote le vaisseau entier. Si des blocs se chevauchaient, les vaisseaux restent simplement l'un contre l'autre.\n\n[accent]Séparation.[] Si les aimants perdent leur énergie pendant 1/3 de seconde ou si l'un est détruit, le lien se rompt. Les groupes de blocs qui ne sont plus rattachés au principal se séparent en vaisseaux distincts avec la même vitesse. Une partie sans moteur tombe (elle garde sa vitesse) et ses blocs restent au sol comme des blocs ordinaires.\n\n[accent]Les pôles identiques se repoussent.[] Deux aimants qui se font face (rouge contre rouge) ou se tournent le dos (bleu contre bleu) repoussent leurs vaisseaux avec la même force. Ils ne font que repousser : pas de rotation ni de jonction. Les aimants d'un même vaisseau n'ont aucun effet l'un sur l'autre.\n\n[accent]Au sol.[] Un aimant alimenté posé au sol agit aussi sur les vaisseaux volants de votre équipe qui ont des aimants : les pôles opposés attirent le vaisseau vers l'aimant et le posent face à lui, les pôles identiques le repoussent. Voir le thème Super aimant.
ycb.guide.supermagnet.title = Super aimant
ycb.guide.supermagnet.text = Un bloc orientable 2x2 avec un avant (rouge) et un arrière (bleu) : le grand frère de l'Aimant. Recette sur Serpulo : 100 alliage superchargé, 200 graphite, 200 plomb (sur une autre planète, les 3 premières ressources de la planète). Il consomme 500 unités d'énergie par seconde. Portée 25 cases, attraction égale à 100 propulseurs à fusée (l'Aimant : 5 cases et 3 propulseurs à fusée), soit 5 fois la portée et 33 fois l'attraction. Un vaisseau attiré par lui va jusqu'à 12 cases par seconde (l'Aimant : 6).\n\n[accent]Avec d'autres aimants.[] Il fonctionne aussi bien avec les super aimants qu'avec les aimants ordinaires, selon les mêmes règles (les pôles opposés attirent, les pôles identiques repoussent, jonction des vaisseaux, séparation : voir l'Aimant). Une paire d'aimants différents fonctionne avec l'attraction la plus forte et la portée la plus longue des deux, et avec l'énergie de celui qui en reçoit le moins.\n\n[accent]Au sol.[] Un aimant posé au sol (un ordinaire aussi, y compris celui d'un vaisseau posé) n'est pas inactif. Il agit sur les aimants des vaisseaux [accent]volants[] de votre équipe à sa portée, selon les mêmes règles des pôles. [accent]Les pôles identiques repoussent[] le vaisseau. [accent]Les pôles opposés l'attirent vers l'aimant[] : le vaisseau vole vers l'aimant, se tourne jusqu'à ce que son aimant regarde dans la même direction, son ombre rétrécit en douceur comme lors d'un atterrissage, et quand il a été attiré jusqu'au bout, il atterrit avec son aimant [accent]face à face[] avec l'aimant au sol (un 1x1 contre un 2x2 se place contre l'une de ses deux cases ; si cette place est prise, il glisse le long de la face ou prend l'autre case ; s'il n'y a pas de place du tout, le vaisseau reste en l'air). L'attraction de tous les aimants qui agissent sur le vaisseau s'additionne et la paire la plus forte qui a de la place est celle à laquelle il s'amarre ; plus l'attraction est forte, plus le vaisseau arrive vite.\n\n[accent]Quand il attire.[] Seulement un vaisseau qui fait du surplace et ne bouge pas : personne ne le pilote, aucun ordre ni pilote automatique ne l'envoie nulle part. Une fois l'attraction commencée, le vaisseau ne peut plus être dirigé. Il ne peut quitter l'attraction (il s'élève et continue de voler), et un vaisseau posé par elle ne peut décoller, que si la poussée de ses moteurs est [accent]supérieure[] à l'attraction des aimants qui agissent sur lui. Si les aimants perdent leur énergie ou sont détruits, le vaisseau s'élève de lui-même.
ycb.guide.builder.title = Constructeur de Schémas
ycb.guide.builder.text = Une imprimante de vaisseaux [accent]16x16[], construite hors du mode construction. Elle ne devient jamais une partie d'un vaisseau. Temps de construction du bloc lui-même : 6 minutes. Recette sur Serpulo : 1000 alliage superchargé, 2000 graphite, 1500 plastanium.\n\n[accent]Choix d'un vaisseau.[] Appuyez sur le crayon sous le bloc : la liste montre les schémas de vaisseau. Un schéma est un vaisseau s'il fait au plus 16x16 cases, contient un noyau ou un stockage, que tous ses blocs se touchent et qu'il ne contient aucun constructeur. Pour en créer un : copiez un vaisseau en mode construction (G) comme schéma. Les schémas qui ne sont pas des vaisseaux sont listés en bas avec la raison.\n\n[accent]Direction.[] Le deuxième bouton (après le crayon) règle le côté vers lequel le vaisseau imprimé est [accent]tourné[] : droite, haut (comme dans le schéma), gauche ou bas. Chaque nouveau constructeur commence avec le côté vers lequel il est lui-même tourné (il ne copie pas le réglage d'un autre constructeur). Le vaisseau [accent]sort[] toujours du côté vers lequel le constructeur est tourné (tournez le constructeur avec R avant de le poser, les flèches au sol montrent la sortie), quel que soit le cap choisi, et il garde le cap choisi.\n\n[accent]L'impression[] fonctionne comme une usine d'unités. Il lui faut les objets du schéma (le prix de chaque bloc) + 100 de tissu phasé, 3000 unités d'énergie et 240 de liquide cryogénique par seconde, et elle prend 1,5 fois le temps qu'un joueur met pour construire tous les blocs. Il contient toutes sortes de liquides et en accepte jusqu'à deux fois ce qu'il faut pour un vaisseau. Une silhouette orange montre la progression, et les trois cheminées fument pendant l'impression.\n\n[accent]Le nouveau vaisseau[] apparaît en l'air au-dessus du bloc avec le cap choisi, est porté par le constructeur vers le côté vers lequel il est tourné, puis suit les modules de son bloc de contrôle. [accent]Premier vol.[] Le troisième bouton (deux flèches vers le haut) ouvre deux curseurs : le nombre de blocs sur lesquels le vaisseau est porté (0 à 50, 10 par défaut) et la vitesse (1 à 10 blocs par seconde, 2 par défaut). Le vaisseau est porté exactement à cette vitesse, quels que soient son poids ou ses moteurs. Avec 0 bloc, il reste simplement suspendu au-dessus du constructeur (la vitesse est alors 0 et ne peut pas être changée). Sous chaque curseur figure son prix en pyratite, avec un x entre les deux : le vaisseau coûte [accent]blocs x vitesse[] de pyratite en plus (20 par défaut). Un vaisseau sans moteur en état de marche tombe quand le portage est terminé. Les modules Préchargement d'objets, Charge de liquide et Jonction à la fabrication sont lus par le constructeur.
ycb.guide.mods.title = Fonctionnement des modules
ycb.guide.mods.text = Le bloc Contrôle du Vaisseau exécute ses modules [accent]l'un après l'autre de haut en bas, puis de nouveau depuis le premier[] (en boucle).\n\nUn module garde le vaisseau jusqu'à ce qu'il ait fini ou ne puisse plus travailler ; alors le suivant le prend. Un module qui ne peut rien faire pour l'instant (pas de foreuse, tout est pris, la ressource est déjà pleine) est ignoré. Avec plusieurs blocs de contrôle sur un vaisseau, celui construit en premier passe en premier. Les ordres du mode commande passent avant tous les modules.\n\n[accent]Les couleurs[] sont celles des instructions d'un processeur : [#ff6060]rouge[] - obtenir des ressources et rejoindre ; [#5aa0ff]bleu[] - repos ; [#ffa040]orange[] - ce que reçoit un vaisseau imprimé ; [#b280ff]violet[] - règles ; [#5fe070]vert[] - processeurs ; [#40d8d0]turquoise[] - le centre de rotation. Chaque carte affiche son état en toutes lettres (en attente, en collecte, vol vers le point, terminé, en pause...).\n\nLes modules s'ajoutent avec les boutons sous la liste et peuvent être déplacés ou supprimés. Si vous relevez le vaisseau d'une aire d'atterrissage à la main, ce module d'atterrissage est mis en pause jusqu'à ce que vous le changiez. Un minerai, un point ou une aire d'atterrissage qu'un vaisseau a pris est fermé aux autres vaisseaux tant que c'est sa cible.
ycb.guide.modres.title = Ressource et Atterrissage pour ressources
ycb.guide.modres.text = [accent]Ressource[] (rouge). Choisissez un minerai, du sable ou un liquide présent sur la carte et un pourcentage de remplissage (50 % par défaut, 0 à 100). Les objets sont comptés par rapport à la place des stockages du vaisseau (noyau, conteneurs), les liquides par rapport à ses réservoirs et conteneurs de liquide (sans réservoir, le liquide n'est pas disponible). Le vaisseau a besoin d'une foreuse capable d'extraire ce minerai, ou d'une pompe.\n\n[accent]Une indication ne suffit pas.[] Après que le vaisseau est resté 2 secondes à son filon, il compte les cases d'où ses foreuses (pompes) prennent réellement le minerai, et les compare au maximum qu'un filon permet : les cases de toutes ses foreuses et pompes pour cette ressource, mais pas plus que le filon n'en a (un petit filon est compté tel quel). Si c'est moins de la moitié, le vaisseau se déplace vers un autre endroit, y reste 2 secondes et recompte, au plus 5 endroits en tout (le premier compris). Si aucun endroit n'atteint la moitié, il retourne au meilleur et y reste. Il n'essaie que des endroits où ses foreuses couvriraient plus que le meilleur jusqu'ici, il peut donc s'arrêter après moins d'essais. Cela vaut pour le module Ressource et pour l'ordre Miner.\n\nLe vaisseau vole vers le filon le plus proche de sa foreuse ou de sa pompe (pas de son centre), ralentit en douceur et s'y arrête net : pas de poussée, pas de rotation, ni carburant ni énergie dépensés. Si quelque chose le pousse à plus d'une case, il revient. Quand le pourcentage est atteint, le module donne le vaisseau au suivant. Après chaque commande, le filon le plus proche est de nouveau choisi depuis la position actuelle du vaisseau.\n\n[accent]Chaque vaisseau a son propre minerai.[] Un filon qu'un vaisseau a choisi est fermé aux autres vaisseaux de votre équipe (un cercle autour de lui, pour que deux vaisseaux ne se retrouvent pas l'un sur l'autre) tant que c'est sa cible. Si le plus proche est pris, le suivant libre est utilisé ; si tous sont pris, la carte affiche « Tous les minerais / emplacements sont pris par d'autres vaisseaux » et le vaisseau continue dans la boucle.\n\n[accent]Atterrissage pour ressources[] (rouge). Une liste d'aires d'atterrissage (la première libre est utilisée) et les ressources, objets et liquides, chacune avec un pourcentage. Le vaisseau vole jusqu'à la première aire libre, atterrit et reste jusqu'à ce que chaque ressource listée atteigne son pourcentage (remplissez-les par convoyeur, déchargeur ou à la main). Puis il décolle et donne le vaisseau au module suivant. Il choisit aussi le côté d'atterrissage : tel quel, avant en haut / bas / à gauche / à droite, ou n'importe lequel qui convient.
ycb.guide.modrest.title = Point de repos
ycb.guide.modrest.text = Le [accent]Point de repos[] (bleu) dit comment et où le vaisseau se repose.\n\n[accent]Le vaisseau[] survole un point ou se pose sur une aire d'atterrissage. Choisissez avec le bouton. La liste contient des points sur la carte (survol) ou des aires d'atterrissage (atterrissage) ; ils sont essayés dans l'ordre, le premier libre est utilisé, les flèches changent l'ordre. Un point est pris si un autre vaisseau y est suspendu ou y vole de si près que les vaisseaux se toucheraient. Si aucun n'est libre, la carte l'indique et le vaisseau continue.\n\n[accent]Se reposer tant que chaque ressource listée reste à au moins...[] Une liste de ressources avec un pourcentage chacune. Quand l'une d'elles passe sous son pourcentage, le repos se termine et le vaisseau passe au module suivant. Le repos ne commence pas tant qu'une ressource listée est déjà basse (le vaisseau repartirait aussitôt).\n\n[accent]Minuteur de repos (facultatif).[] Un bouton l'active et un champ règle les secondes (30 par défaut, jusqu'à 3600). Le repos se termine selon ce qui arrive en premier, la ressource ou le minuteur. Sans liste ni minuteur, le repos ne se termine jamais.\n\nSi aucun autre module ne veut le vaisseau, il reste au point de repos.
ycb.guide.modrule.title = Règles pour foreuses et pompes
ycb.guide.modrule.text = La [accent]Règle[] (violet) dit quelles ressources les foreuses et les pompes du vaisseau peuvent prendre. Ce n'est pas une tâche du pilote automatique : placez-la n'importe où dans la liste, l'ordre n'a pas d'importance.\n\n[accent]Cible.[] « Toutes les foreuses et pompes » (par défaut), ou un seul bloc. Choisissez-le dans la liste (son nom et le décalage par rapport au bloc de contrôle) ou touchez-le sur la carte. Le décalage est le même en vol et au sol, donc la règle ne se brise pas quand le vaisseau atterrit ou décolle. Si le bloc a disparu, la carte affiche « Bloc introuvable ».\n\n[accent]Mode.[] Liste blanche : le bloc ne prend que les ressources listées. Liste noire : il prend tout sauf les ressources listées. Ressources d'une règle : pour une foreuse, les minerais et le sable qu'elle peut extraire, pour une pompe, les liquides ; pour « toutes », tout ce que n'importe quelle foreuse ou pompe du vaisseau peut prendre.\n\n[accent]Fonctionnement.[] La foreuse « ne voit pas » un minerai interdit : avec deux minerais dessous dont un autorisé, elle prend l'autorisé même s'il y a plus de l'interdit. Une pompe choisit son liquide de la même façon. Le pilote automatique respecte les règles : il ne va chercher une ressource qu'avec une foreuse ou une pompe qui peut la prendre ; si toutes sont interdites, le module indique « Interdit par une règle ».\n\n[accent]Détails.[] Une liste vide ne change rien. Plusieurs règles pour un même bloc s'appliquent toutes : une ressource doit passer chacune d'elles. Une liste blanche ne limite que le genre qu'elle nomme : une liste de minerais ne gêne pas les pompes, une liste avec de l'eau et du cuivre limite les deux. Les règles fonctionnent pendant que le vaisseau vole ; au sol, les foreuses sont des blocs ordinaires.
ycb.guide.modcenter.title = Centre de rotation
ycb.guide.modcenter.text = Le [accent]Centre[] (turquoise, un réglage, pas une tâche) définit le point du vaisseau à partir duquel tout est mesuré : le vaisseau tourne autour de lui (touches Q et E, rotation vers le cap, pilote automatique, collisions, aimants) et c'est le point qui vole vers une cible. Placez le module n'importe où dans la liste ; s'il y en a plusieurs, c'est le premier du bloc de contrôle construit en premier qui compte.\n\n[accent]Noyau ou stockage.[] Choisissez lequel dans la liste ou par un toucher sur la carte. Cela ne fonctionne que si le vaisseau a au moins deux noyaux et stockages ; avec un seul, le bouton est désactivé et la carte indique qu'il en faut deux.\n\n[accent]Moyenne des cases[] (par défaut). La position moyenne de toutes les cases que les blocs occupent ; un gros bloc compte avec chacune de ses cases. Elle bouge quand des blocs sont ajoutés ou perdus.\n\n[accent]Bloc choisi.[] N'importe quel bloc du vaisseau ; touchez-le sur la carte (le bloc de contrôle lui-même par défaut).\n\n[accent]Fonctionnement.[] Le point est fixé au décollage. Quand il change ensuite (un bloc est ajouté ou perdu, le module est modifié ou supprimé), les blocs restent où ils sont dans le monde et seul le point bouge, donc le vaisseau ne saute pas. Pendant les animations d'atterrissage et de décollage, le point ne change pas. Sans module Centre, ou quand le module ne peut pas fonctionner (pas de tel bloc, un seul noyau), le vaisseau tourne autour de son noyau ou stockage principal. Le décalage du bloc choisi est conservé quand le vaisseau atterrit tourné. Inutilisé tant que le vaisseau est au sol.
ycb.guide.modjoin.title = Jonction de vaisseaux par aimants
ycb.guide.modjoin.text = Deux modules aident les vaisseaux à se rencontrer et à se joindre avec des aimants (voir le bloc Aimant).\n\n[accent]Point de jonction[] (rouge, une tâche du pilote automatique). Choisissez un point sur la carte et un [accent]cap[] en degrés (0 = comme le vaisseau a été construit, sens antihoraire). Le vaisseau vole jusqu'au point, se tourne vers le cap et y reste jusqu'à ce que des aimants le joignent à un autre vaisseau. Après la jonction, le module est terminé et le vaisseau prend le suivant ; si les vaisseaux se séparent, il retourne au point. Tant que des aimants l'attirent, il ne résiste pas, sinon les vaisseaux ne pourraient jamais se rencontrer.\n\n[accent]Jonction à la fabrication[] (orange, sans réglages, lu par le Constructeur de Schémas). Un vaisseau imprimé par le constructeur vole jusqu'au point où le constructeur l'a envoyé, s'y tient avec exactement le cap de son impression et ne bouge pas. Si quelque chose le déplace, il revient au point avec le cap exact, jusqu'à ce que des aimants le joignent à un autre vaisseau. Les modules du pilote automatique ne tournent pas pendant ce temps. Un ordre du joueur ou le pilotage à la main met fin à l'attente. L'attente est enregistrée avec la partie.\n\nAvec les aimants, cela permet au constructeur d'imprimer les parties d'un grand vaisseau qui s'assemblent d'elles-mêmes en l'air.
ycb.guide.modmisc.title = Processeurs, préchargement, charge de liquide
ycb.guide.modmisc.text = [accent]Processeurs[] (vert, un réglage, pas une tâche). Choisissez un événement : le vaisseau [accent]atterrit[], [accent]décolle[] ou [accent]est endommagé[] ; choisissez une action : activer, désactiver ou basculer ; et ajoutez des processeurs du vaisseau à la liste avec le bouton « + Processeur ». L'action est la même que la commande propre du processeur « control enabled ». L'atterrissage et le décollage comptent à chaque fois, aussi en entrant dans le mode construction ou en le quittant. Les dégâts sont vérifiés quelques fois par seconde et ne déclenchent l'action que deux fois par seconde au plus. En mode construction, les dégâts ne sont pas surveillés. Plusieurs modules font plusieurs actions.\n\nLes processeurs peuvent désactiver bien plus : l'aimant (plus d'attraction, plus de consommation d'énergie), le constructeur de schémas (l'impression s'arrête), le bloc de contrôle du vaisseau (ses modules et ses règles ne fonctionnent plus) et chaque propulseur (plus de poussée, plus de carburant ni d'énergie consommés ; si tous sont désactivés, le vaisseau descend en atterrissage d'urgence).\n\n[accent]Préchargement d'objets[] (orange, lu par le constructeur). Les objets listés apparaissent dans le stockage d'un vaisseau imprimé par le constructeur de schémas (d'abord le noyau). Ils s'ajoutent au prix : le constructeur les prend aussi. Ce qui ne rentre pas reste dans le constructeur. Sans effet pour un vaisseau construit à la main.\n\n[accent]Charge de liquide[] (orange, lue par le constructeur). Les réservoirs d'un vaisseau imprimé sont remplis du liquide choisi jusqu'à la part choisie de leur capacité. Le constructeur le verse depuis ses propres réservoirs (amenez-lui des conduits) et attend d'en avoir assez.
ycb.guide.fly.title = En vol : blocs, foreuses, tourelles
ycb.guide.fly.text = [accent]Tout fonctionne.[] Les convoyeurs déplacent les objets, les ponts et les câbles gardent leurs liens, les déchargeurs, stockages, générateurs, usines et tourelles fonctionnent comme d'habitude. Un vaisseau posé fait de nouveau partie de la carte et y fonctionne de façon ordinaire.\n\n[accent]Les foreuses[] extraient ce qui se trouve sous le vaisseau à cet instant : si le bord de la foreuse touche un minerai, elle l'extrait. Le minerai change en cours de route pendant que le vaisseau se déplace, donc une foreuse peut être posée n'importe où (voir Pose libre) et portée au-dessus d'un minerai. [accent]Les pompes[] prennent du liquide dans l'eau qu'elles touchent et le passent aux réservoirs et conduits voisins. Un conduit qui débouche dans le vide fuit sur le sol sous le vaisseau. Les générateurs thermiques, cultivateurs et extracteurs d'eau lisent le sol sous le vaisseau volant.\n\n[accent]Les tourelles agissent comme un seul canon.[] Quand le vaisseau choisit une cible (ou que vous tirez vous-même), tous les canons se tournent vers elle et tirent ensemble. Chaque tourelle a ses propres munitions et sa propre vitesse de rotation. La visée anticipe la cible et tient compte de la vitesse du vaisseau.\n\n[accent]Les projectiles gardent la vitesse du vaisseau.[] Comme les projectiles d'une unité, les projectiles de ses canons reçoivent la vitesse du vaisseau en plus (pas les lasers, la foudre et les autres qui n'héritent pas de la vitesse dans le jeu). Un vaisseau volant compte comme une cible aérienne : les projectiles antiaériens (flak) peuvent le toucher, pas les projectiles anti-sol (artillerie, flammes) ; les murs phasés réfléchissent les projectiles.\n\n[accent]Apparence.[] Chaque bloc projette une ombre. Un bloc endommagé montre des fissures, d'autant plus sombres qu'il est abîmé. Un vaisseau volant est dessiné au-dessus de l'obscurité du bord de la carte et des murs épais, et n'y est pas assombri.
ycb.guide.collide.title = Collisions et poids
ycb.guide.collide.text = Chaque case occupée pèse 1, donc un vaisseau de 100 blocs est 100 fois plus lourd qu'un seul bloc.\n\nQuand deux vaisseaux se touchent, ils échangent de la [accent]quantité de mouvement[] (poids x vitesse) comme des boules de billard : la quantité de mouvement totale reste, mais une partie de l'énergie cinétique est perdue (le rebond n'est ni parfaitement dur ni parfaitement mou, 0,25). Ils sont repoussés en proportion inverse de leurs poids, donc le vaisseau lourd ne bouge presque pas et le léger est projeté.\n\nExemple : 100 blocs à 1 case par seconde portent une quantité de mouvement de 100, un bloc à 10 cases par seconde seulement 10, donc le gros vaisseau continue et le petit est rejeté.\n\nLes moteurs continuent de fonctionner pendant le contact : un vaisseau léger qui pousse contre un lourd ne le déplace pas, et un vaisseau lourd peut porter un léger devant lui. Les chocs violents font jaillir des étincelles. Le vaisseau du joueur n'a aucune priorité : seul le poids décide.\n\nLes vaisseaux n'entrent pas en collision pendant qu'ils atterrissent ou décollent. En mode construction, les blocs du monde arrêtent un vaisseau comme des blocs ordinaires ; en vol, le terrain n'a pas d'importance.\n\nLes vaisseaux plus lourds tournent aussi plus lentement (voir Poussée, vitesse et poids).
ycb.guide.damage.title = Dégâts, chute de blocs et crashs
ycb.guide.damage.text = [accent]Dégâts.[] Les projectiles ennemis touchent des blocs précis du vaisseau (l'armure compte). Quand un bloc qui en retenait d'autres est détruit, tout ce qui s'est détaché de la coque tombe. Si tous les noyaux et stockages sont détruits, le vaisseau entier est détruit et le reste de ses blocs tombe.\n\n[accent]Chute de blocs.[] Chaque groupe détaché devient une épave : il garde la vitesse et la rotation du vaisseau à cet instant, joue l'animation d'atterrissage 1,5 fois plus vite (sans fumée ni poussière) et touche le sol. Chaque bloc inflige ses points de vie aux [accent]ennemis[] en dessous (une unité meurt quand elle reçoit au moins ses points de vie). Ensuite, tous les blocs de l'épave sont détruits avec l'explosion habituelle : le carburant et les inflammables s'enflamment, les batteries éclatent, les liquides se répandent. Les alliés ne sont pas blessés. Le mode construction ne fait rien tomber : les blocs libres y deviennent simplement rouges.\n\n[accent]Atterrissage sur des ennemis.[] Quand un vaisseau descend (tout atterrissage, G aussi), chaque unité ennemie au sol (marcheuse aussi) touchée par un bloc affronte les blocs qu'elle touche. Si les blocs ont ensemble plus de points de vie que l'unité (vie + bouclier), l'unité meurt et les blocs perdent ensemble 25 % de la vie de l'unité (mais aucun bloc ne descend sous 1). Sinon, l'unité perd autant de vie que les blocs en avaient et les blocs [accent]se brisent[] (explosent comme tout bloc détruit). Si un noyau ou un stockage se brise, un autre stockage du vaisseau prend sa place ; s'il n'en reste aucun, le vaisseau se disloque en blocs ordinaires. Les unités de votre propre équipe et les neutres ne sont pas blessées, simplement déplacées vers la place libre la plus proche.\n\n[accent]Crash.[] Un vaisseau sans moteur en état de marche ne choisit pas d'endroit : il tombe exactement là où sa vitesse le porte. Chaque bâtiment qu'il heurte est comparé à la vie totale des blocs qui tombent. Plus de vie : le bâtiment est détruit et remplacé, et les blocs perdent 25 % de sa vie. Moins ou égal : les blocs se brisent et le bâtiment subit des dégâts égaux à leur vie. Les blocs qui tombent sur ce qu'on ne peut pas construire (un mur de la carte, de l'eau profonde, au-delà du bord) se brisent. [accent]Zone de largage.[] Quand une vague commence, le jeu détruit tout ce qui est à vous près des points d'apparition au sol (le cercle rouge). Un vaisseau volant n'y est pas en sécurité : chaque bloc qui se trouve dans le cercle à cet instant est arraché et tombe comme tout bloc qui a perdu son lien (une chute d'urgence). Ce que les blocs arrachés retenaient tombe avec eux ; si la coque est arrachée, tout le vaisseau descend. Les vaisseaux de l'équipe de la vague ne sont pas touchés.
ycb.guide.fire.title = Feu et explosions
ycb.guide.fire.text = Un vaisseau volant a ses propres feux et explosions, liés au sol en dessous. Un vaisseau posé est sur la carte, où le feu du jeu fonctionne.\n\n[accent]Feu.[] Un feu brûle sur chaque case en feu d'un bloc.\n- Il naît de projectiles incendiaires, d'un bloc détruit contenant des inflammables (charbon, pétrole, spores...), et le feu du sol sous les blocs passe au vaisseau au décollage (et retourne au sol à l'atterrissage).\n- Toutes les demi-secondes, il frappe son bloc (2,5 dégâts x la force du feu, l'armure ne compte pas). Sans combustible, il vit environ 17 secondes.\n- Tant que le bloc contient des inflammables, le feu grandit (jusqu'à x4 dégâts) et dure plus longtemps ; sans eux, il s'éteint.\n- Il se propage aux blocs voisins, et toutes les 0,75 seconde il peut tomber : s'il y a un bloc au sol en dessous, un vrai feu y démarre.\n- Un bloc avec de l'eau ou un autre liquide extincteur (10 unités ou plus) éteint rapidement son feu. Les tourelles Vague d'un vaisseau n'éteignent pas ses feux d'elles-mêmes.\nUn vaisseau contient jusqu'à 400 feux ; ils ne sont pas enregistrés.\n\n[accent]Explosions.[] Un bloc qui meurt explose selon les chiffres du jeu : l'explosivité, l'inflammabilité et la charge de ce qu'il contient.\n- Les explosions touchent les blocs de tous les vaisseaux volants dans le rayon, y compris le sien. Au bord, les dégâts sont de 40 %. L'armure compte.\n- [accent]Les batteries[] (et tout bloc avec une charge) se déchargent : dégâts = charge / 25, au plus 600 ; les blocs qui ont besoin d'énergie subissent x1,5.\n- Un [accent]réacteur à thorium[] (et un réacteur à impulsion) souffle tout autour selon son propre rayon et ses propres dégâts (19 cases et 5000 pour le thorium). Il n'explose que s'il est chargé : carburant 5 ou plus ou chaleur 0,5 ou plus, et si les règles permettent les explosions de réacteur.\n- Un bloc de vaisseau détruit déclenche quand même l'explosion du jeu au sol en dessous (blocs brisés, feux, foudre). Un bloc au sol qui meurt frappe de la même façon les vaisseaux au-dessus.\nLes explosions s'enchaînent avec un délai de quelques ticks, comme les ondes du jeu. Les règles feu, dégâts des explosions et explosions de réacteur sont respectées.
ycb.guide.units.title = Projecteurs et usines d'unités
ycb.guide.units.text = [accent]Gardiens et projecteurs.[] Un gardien, un projecteur de soin et un projecteur d'accélération sur un vaisseau volant agissent sur les blocs de [accent]ce vaisseau[], pas sur les vrais blocs en dessous : les gardiens soignent les blocs endommagés, le projecteur d'accélération accélère les blocs. Le projecteur de force crée son champ autour du vaisseau, dessiné comme celui du jeu. Un processeur peut désactiver un projecteur. Sur un vaisseau posé, les blocs sont sur la carte et fonctionnent de façon ordinaire.\n\n[accent]Usines d'unités.[] Une usine d'unités (et un reconstructeur) sur un vaisseau volant ne garde une unité terminée que si le bloc devant la prend : un convoyeur de charge utile, un routeur, un transporteur de masse, etc., ou un reconstructeur capable d'améliorer cette unité. Sinon :\n- une unité [accent]aérienne[] s'envole (aussi quand un bloc se trouve devant : elle ne reste plus enfermée à jamais) ;\n- une unité [accent]terrestre, à pattes ou navale[] tombe sur le vrai sol sous le vaisseau : vers l'endroit le plus proche où elle peut se tenir (jusqu'à 5 cases du point), avec un nuage de poussière et une partie de la vitesse du vaisseau. Une unité navale qui ne tombe pas sur l'eau meurt, comme dans le jeu.\nUn reconstructeur en bout de chaîne laisse sortir l'unité de la même façon quand il n'a nulle part où l'améliorer. La limite d'unités est respectée : à la limite, l'unité attend dans l'usine.
ycb.guide.planets.title = Autres planètes et mods
ycb.guide.planets.text = [accent]Chaque bloc du mod est disponible sur chaque planète[], y compris Erekir et les planètes d'autres mods. Ils sont toujours débloqués (rien à rechercher), affichés dans l'onglet Unités (le bloc de contrôle du vaisseau dans Logique) et peuvent être posés n'importe où, aussi dans l'espace et sous l'eau.\n\n[accent]Recettes.[] Sur Serpulo, les recettes classiques sont utilisées. Sur toute autre planète, un bloc est fait des premières ressources de la liste de la planète ; plus le bloc est ancien, plus il en prend :\n- Propulseur à Fusée : 2 ressources, 20 et 10\n- Aire d'Atterrissage : 2 ressources, 20 et 20\n- Propulseur à Énergie : 3 ressources, 100, 50 et 30\n- Contrôle du Vaisseau : 3 ressources, 50, 300 et 120\n- Propulseur à Carburant : 4 ressources, 300, 400, 100 et 200\nSi la planète a moins de ressources, toutes sont utilisées. Le Constructeur de Schémas utilise la dernière ressource de la planète (à la place de l'alliage superchargé et du tissu phasé) et les deux premières (à la place du graphite et du plastanium).\n\n[accent]La liste des ressources d'une planète[] suit l'ordre dans lequel la planète les donne : son arbre de recherche, niveau par niveau (objets uniquement) ; puis les autres ressources créées pour cette planète dans l'ordre où le mod les a déclarées ; seulement si la planète n'en a aucune, les autres ressources.\n\n[accent]Carburant.[] Sur Serpulo, le charbon, les spores et la pyratite brûlent. Tout objet d'un autre mod avec une inflammabilité de 0,3 ou plus est aussi un carburant, avec une poussée de 10 x l'inflammabilité (20 au plus). Là où rien ne brûle (Erekir), les ressources les plus volatiles de la planète deviennent le carburant. Le boost liquide n'est toujours donné que par l'eau et le liquide cryogénique.\n\nLes recettes sont recalculées au chargement d'un monde ou d'un secteur et quand la planète de la partie change.
ycb.guide.multi.title = Multijoueur
ycb.guide.multi.text = Le mod fonctionne en solo, pour l'hôte et sur un serveur dédié. [accent]Le mod, de la même version, est nécessaire sur le serveur et sur chaque client.[]\n\n[accent]Fonctionnement.[] Le serveur fait tout le travail des vaisseaux : vol, atterrissage et décollage, dégâts, feu, pilote automatique, ordres. Un client n'exécute pas la logique des vaisseaux ; il garde une copie de chaque vaisseau et la dessine. Le vol, les animations de décollage et d'atterrissage avec la poussière, la visée des tourelles, les moteurs en marche, les dégâts, le feu, les tirs et les explosions sont synchronisés.\n\n[accent]Un client peut[] piloter un vaisseau (Y, Shift+Y ou Ctrl + clic), lui donner des ordres du mode commande (déplacer, Atterrir, Décoller) et utiliser G et Y. Seul l'hôte (le serveur lui-même) peut configurer le bloc Contrôle du Vaisseau et le Constructeur de Schémas.\n\n[accent]Le mode construction est local.[] G n'est activé que pour vous : le vaisseau que vous choisissez (celui où vous êtes assis, sinon celui sous le curseur, sinon le plus proche) atterrit, les autres continuent de voler. Le [accent]masque violet[] est la couche du vaisseau ; les cases avec le masque sont vues de tous les joueurs, et un vaisseau que quelqu'un modifie en ce moment a un masque plus brillant et clignotant. Les blocs que vous posez en G apparaissent violets pour les autres jusqu'à ce que vous quittiez. Quitter G ne relève que les vaisseaux qui n'ont plus d'éditeurs ; un vaisseau posé (garé) reste au sol.\n\n[accent]Sauvegarde.[] Les vaisseaux sont enregistrés dans un bloc à part du fichier de sauvegarde, donc même de grandes bases se sauvegardent sans l'erreur « encoded string too long ». Les anciennes sauvegardes se chargent aussi.
ycb.guide.settings.title = Paramètres, limites et conseils
ycb.guide.settings.text = [accent]Paramètres[] (Paramètres, la page du mod) :\n- Poussée d'un propulseur à fusée : 45 cases par seconde par case du vaisseau par défaut. La vitesse de chaque vaisseau en dépend.\n- Tourner le vaisseau volant dans la direction de pilotage : activé par défaut.\n- Le bouton du guide YCB.\n\n[accent]Limites.[]\n- Un vaisseau fait au plus environ 110 blocs de large.\n- Les blocs en construction ne bougent pas : terminez-les avant le décollage.\n- La pose libre ne fonctionne qu'en mode construction et seulement pour les blocs dont le jeu vérifie le terrain (foreuses, pompes, générateurs thermiques et similaires). Le noyau doit contenir au moins un objet de chaque sorte nécessaire.\n- Les objets d'un stockage qui a été coupé et supprimé quand vous avez quitté le mode construction sont perdus.\n- Les ennemis terrestres trouvent le chemin vers les noyaux par la carte : tant qu'un noyau vole, ils ne le trouvent pas ainsi. Tout ennemi qui voit un vaisseau et tire sur les cibles aériennes peut l'attaquer.\n- Le pilote automatique cède la place aux ordres du mode commande. Un atterrissage par un module demande de la place sous tout le vaisseau. Pendant un atterrissage ou un décollage, le vaisseau ne peut pas être dirigé et les ordres ne fonctionnent pas.\n- Les propulseurs ne sont pas inversés en miroir quand ils sont tournés.\n- Les ennemis visent le centre d'un vaisseau volant, pas des blocs isolés. Les lasers, la foudre et les champs d'énergie (Navanax, Aegires) n'endommagent pas ses blocs, et un Parallax ennemi ne peut pas l'attirer.\n- Les foreuses à plasma et les broyeurs de parois n'extraient rien des parois tant que le vaisseau vole.\n\n[accent]Conseils.[]\n- Copiez un vaisseau en mode construction comme schéma : le constructeur peut l'imprimer, et les modules de son bloc de contrôle viennent avec.\n- Mettez des aires d'atterrissage près de vos foreuses et donnez au vaisseau un module Atterrissage pour ressources : il va chercher et décharge tout seul.\n- Plusieurs aimants sur un vaisseau l'attirent plus fort ; mettez-les du côté qui fait face au partenaire.\n- Si un vaisseau ne décolle pas, regardez en haut de l'écran l'indication sur les propulseurs et vérifiez le carburant et l'énergie.
