block.your-custom-battleship-ship-builder.name = Constructeur de Schémas
block.your-custom-battleship-ship-builder.description = Une imprimante de vaisseaux de 16x16. Touchez le crayon sous le bloc et choisissez un schéma de vaisseau : seuls les schémas d'au plus 16x16 cases avec un noyau ou un stockage, dont tous les blocs se touchent, figurent dans la liste. Orientez le bloc (R) avant de le poser : les flèches au sol indiquent par où sort le vaisseau terminé (toujours du côté vers lequel le constructeur est tourné ; le vaisseau garde le cap choisi avec le bouton de direction). Il imprime comme une usine d'unités : il lui faut les objets du schéma (le coût de construction de chaque bloc) + 100 de tissu phasé, 3000 unités d'énergie par seconde et 240 de liquide cryogénique par seconde ; l'impression dure 1,5 fois le temps qu'un joueur met pour construire tous ses blocs. Les trois cheminées fument pendant l'impression. Le vaisseau terminé avance un peu en vol, puis suit les ordres de son bloc de contrôle. Ne peut pas être posé dans le mode construction du vaisseau volant et ne fait jamais partie d'un vaisseau. La recette dépend de la planète : sur Serpulo, alliage superchargé, graphite et plastanium ; sur une autre planète, la dernière ressource de la planète par identifiant (à la place de l'alliage superchargé et du tissu phasé) et ses deux premières ressources (à la place du graphite et du plastanium). Il contient toutes sortes de liquides. Un bloc de contrôle du schéma peut demander un préchargement d'objets (ajoutés au prix, ils apparaissent dans le stockage du nouveau vaisseau) et une charge de liquide (versée des réservoirs du constructeur dans ceux du nouveau vaisseau).
