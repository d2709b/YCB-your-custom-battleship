block.your-custom-battleship-ship-control.name = Contrôle du Vaisseau
mb.ship.nothing = La carte n'a ni minerais ni liquides
block.your-custom-battleship-ship-control.description = Dit au vaisseau volant quoi faire grâce à des modules logiques. Ils s'exécutent l'un après l'autre de haut en bas, puis en boucle en repartant du premier ; un module garde le vaisseau jusqu'à ce qu'il ait terminé. Ressource : aller chercher un minerai ou un liquide jusqu'à un pourcentage de remplissage (un minerai pris par un vaisseau est inaccessible aux autres). Point de repos : survoler un point ou se poser sur une aire d'atterrissage et y rester tant que les ressources listées gardent leur pourcentage, ou pendant la durée d'un minuteur ; une liste d'emplacements est essayée dans l'ordre, le premier libre est utilisé. Atterrissage pour ressources : se poser sur la première aire d'atterrissage libre d'une liste et y rester jusqu'à ce que les ressources listées atteignent leur pourcentage, puis décoller. Le crayon ouvre le panneau. Uniquement constructible en mode construction de vaisseau volant ; plusieurs peuvent être installés sur un même vaisseau volant. La recette dépend de la planète : sur Serpulo, la recette classique ; sur toute autre planète, elle est composée des 3 premières ressources de la planète. Un bloc de contrôle peut aussi contenir un préchargement d'objets et un chargement de liquide : un vaisseau imprimé par le constructeur de schémas reçoit ces objets dans son stockage (ils sont ajoutés au prix) et ses réservoirs sont remplis du liquide.
block.your-custom-battleship-landing-spot.name = Aire d'Atterrissage
block.your-custom-battleship-landing-spot.description = Un simple bloc posé au sol. Un vaisseau volant doté d'un module d'atterrissage vole jusqu'à elle et s'y pose : l'un de ses stockages recouvre l'aire, qui n'est pas détruite (elle est seulement recouverte tant que le vaisseau volant y reste). Le vaisseau volant redécolle lorsque ses modules ont terminé. Constructible hors du mode construction. La recette dépend de la planète : sur Serpulo, la recette classique ; sur toute autre planète, elle est composée des 2 premières ressources de la planète.
block.your-custom-battleship-magnet.name = Aimant
block.your-custom-battleship-magnet.description = Un bloc d'une case avec un avant (rouge) et un arrière (bleu) ; orientable. Consomme 10 unités d'énergie / seconde. Un aimant d'un vaisseau volant attire les aimants d'un AUTRE vaisseau volant de votre équipe situés à moins de 5 blocs et tournés dans l'autre sens (l'avant de l'un regarde l'autre aimant et l'avant de l'autre regarde dans la même direction : avant contre arrière). L'attraction équivaut à celle de 3 propulseurs à fusée, plus faible à mesure que la distance augmente, et elle donne de la vitesse comme le font les moteurs : un gros vaisseau volant bouge à peine, un petit arrive vite ; les vaisseaux volants pivotent aussi pour se placer côte à côte. Quand deux aimants se rejoignent, les vaisseaux volants ne forment plus qu'UN seul vaisseau volant : un seul poids, la poussée de tous les moteurs. Les pôles identiques repoussent au contraire les vaisseaux volants : quand les avants se font face (rouge contre rouge) ou les arrières (bleu contre bleu), l'aimant repousse son vaisseau volant avec la même force. Les aimants d'un même vaisseau volant n'ont aucun effet entre eux. Quand les aimants n'ont plus d'énergie, les vaisseaux volants se lâchent ; une partie qui n'a plus de moteur tombe avec une animation de chute, en gardant sa vitesse, et ses blocs restent au sol comme des blocs ordinaires. Uniquement constructible en mode construction de vaisseau volant. La recette dépend de la planète : sur Serpulo, la recette classique ; sur toute autre planète, elle est composée des 3 premières ressources de la planète. Les aimants posés au sol fonctionnent aussi sur les vaisseaux volants (voir le Super Aimant).
block.your-custom-battleship-super-magnet.name = Super Aimant
block.your-custom-battleship-super-magnet.description = Un bloc de deux par deux avec un avant (rouge) et un arrière (bleu) ; orientable. Consomme 500 unités d'énergie / seconde. Fonctionne comme l'Aimant, mais avec une portée de 25 blocs et une attraction de 100 propulseurs à fusée (un vaisseau attiré va jusqu'à 12 blocs par seconde), et il fonctionne aussi bien avec les aimants simples qu'avec les super aimants (une paire fonctionne avec l'attraction la plus forte et la portée la plus longue des deux). Un aimant alimenté posé AU SOL n'est pas inactif non plus : il attire VERS lui un vaisseau volant de votre équipe dont les aimants sont tournés dans l'autre sens (le vaisseau vole vers l'aimant, pivote, l'ombre rétrécit comme lors d'un atterrissage, et le vaisseau se pose face à face avec l'aimant, comme lors d'une jonction) si le vaisseau est en vol stationnaire et immobile, et repousse les vaisseaux dont les aimants sont tournés dans le même sens. Un vaisseau pris dans l'attraction ne peut la quitter, et un vaisseau posé ne peut décoller, que lorsque la poussée de ses moteurs est supérieure à l'attraction des aimants. La recette dépend de la planète : sur Serpulo 100 alliage superchargé, 200 graphite et 200 plomb ; sur toute autre planète, elle est composée des 3 premières ressources de la planète.
mb.ship.title = Contrôle du vaisseau
mb.ship.hint = Les modules s'exécutent l'un après l'autre de haut en bas, puis, après le dernier, de nouveau depuis le premier (en boucle). Un module garde le vaisseau jusqu'à ce qu'il ait terminé ou ne puisse plus fonctionner ; ensuite, le module suivant le prend. Les ordres du panneau RTS passent avant tous les modules. Un minerai, une aire d'atterrissage ou un point pris par un vaisseau est inaccessible aux autres vaisseaux.
