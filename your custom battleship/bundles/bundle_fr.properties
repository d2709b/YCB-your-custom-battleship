block.your-custom-battleship-rocket-booster.name = Propulseur à Fusée
block.your-custom-battleship-rocket-booster.description = Le moteur de base d'un vaisseau volant. Uniquement constructible en mode construction de vaisseau volant. Poussée = 1. La vitesse du vaisseau volant est la poussée totale de tous les propulseurs multipliée par la puissance d'un propulseur à fusée, divisée par le nombre de cases occupées par le vaisseau volant. La recette dépend de la planète : sur Serpulo, la recette classique ; sur toute autre planète, elle est composée des 2 premières ressources de la planète.
block.your-custom-battleship-energy-booster.name = Propulseur à Énergie
block.your-custom-battleship-energy-booster.description = Un moteur 2x2 avec la poussée de 6 propulseurs à fusée. Consomme 90 unités d'énergie par seconde tant que le vaisseau volant est piloté ; en cas de manque d'énergie, la poussée diminue. Boost liquide (facultatif) : l'eau double la poussée (x2 = 12 propulseurs à fusée), le liquide cryogénique donne x2.5 (15) ; il consomme 10 unités de liquide par 10 secondes de fonctionnement. Uniquement constructible en mode construction de vaisseau volant. La recette dépend de la planète : sur Serpulo, la recette classique ; sur toute autre planète, elle est composée des 3 premières ressources de la planète.
block.your-custom-battleship-fuel-booster.name = Propulseur à Carburant
block.your-custom-battleship-fuel-booster.description = Un moteur 3x3 qui brûle un objet toutes les 8 secondes de fonctionnement. Le charbon donne la poussée de 14 propulseurs à fusée, les spores 15, la pyratite 17.3. Boost liquide (facultatif) : l'eau donne x1.25, le liquide cryogénique x3 (42 / 45 / 52 propulseurs à fusée) ; 20 unités de liquide sont consommées par objet brûlé. Alimentez-le avec des convoyeurs ou des déchargeurs ; le carburant peut aussi en être retiré avec un déchargeur ; sans carburant, il ne fonctionne pas. Uniquement constructible en mode construction de vaisseau volant. Sur les autres planètes et avec d'autres mods, toute ressource inflammable sert de carburant (poussée = 4 + 10 x son inflammabilité) ; là où rien ne brûle, ce sont les ressources les plus volatiles. La recette dépend de la planète : sur Serpulo, la recette classique ; sur toute autre planète, elle est composée des 4 premières ressources de la planète.
